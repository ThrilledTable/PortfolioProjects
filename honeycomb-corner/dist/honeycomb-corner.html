<script>
// =============================================================================
// builds.js: UPGRADES TAKE TIME
// -----------------------------------------------------------------------------
// Buying an upgrade no longer takes effect instantly. You pay up front, and
// a "build" starts with a timer. When the timer runs out, the upgrade is
// applied. You have one builder, so only one thing is built at a time,
// unless you buy a second builder with gems.
//
// Timers count against the game clock (s.clock), which keeps running while
// you're away, so builds finish even if the game is closed.
//
// A build in the save looks like:
//   { id, kind, key, label, end, dur }
//   kind  - what's being built: 'upgrade', 'hive', 'hiveUp', 'machine', 'machineUp'
//   key   - which one (e.g. the upgrade id 'sign', or the hive number)
//   end   - the game-clock time it finishes
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data: D, bus } = HC;
  const f = () => HC.sim.f;

  // Is this particular thing already being built? Returns the build or null.
  function find(s, kind, key) {
    return s.builds.find((b) => b.kind === kind && String(b.key) === String(key)) || null;
  }
  const freeBuilder = (s) => s.builds.length < s.builders;
  const left = (s, b) => Math.max(0, b.end - s.clock);

  // Start building. `cost` coins are paid now; returns {ok, msg}.
  function start(s, kind, key, label, cost) {
    if (find(s, kind, key)) return { ok: false, msg: label + ' is already being built.' };
    if (!freeBuilder(s)) return { ok: false, msg: 'Your builder is busy. Wait, finish the current build with gems, or hire a second builder in the Store.' };
    if (s.coins < cost) return { ok: false, msg: 'Not enough coins.' };
    s.coins -= cost;
    const dur = f().buildTime(cost);
    s.builds.push({ id: util.uid(), kind, key, label, end: s.clock + dur, dur });
    bus.emit('buildStart', { label, dur });
    bus.emit('dirty');
    return { ok: true, msg: 'Building ' + label + '. Ready in ' + util.fmtTime(dur) + '.' };
  }

  // Apply a finished build's effect.
  function finish(s, b) {
    s.builds = s.builds.filter((x) => x !== b);
    if (b.kind === 'upgrade') {
      s.up[b.key]++;
      if (b.key === 'shelf') {
        s.shelves.push({ good: null, qty: 0 });
        // Fill the new shelf with your best sellable product not already out.
        const shelved = new Set(s.shelves.map((x) => x.good));
        const best = D.GOODS.filter((g) => s.unlockedGoods[g.id] && !g.raw && !shelved.has(g.id)).pop();
        if (best) s.shelves[s.shelves.length - 1].good = best.id;
      }
      if (b.key === 'nursery') s.nursery.push(null);
    } else if (b.kind === 'hive') {
      s.hives.push({ level: 0, bees: [], stock: {} });
      fillFromBox(s, s.hives[s.hives.length - 1]);
    } else if (b.kind === 'hiveUp') {
      const h = s.hives[b.key];
      if (h) {
        h.level++;
        fillFromBox(s, h);
      }
    } else if (b.kind === 'machine') {
      s.machine = { level: 0, wax: 0, candles: 0, prog: 0 };
    } else if (b.kind === 'machineUp' && s.machine) {
      s.machine.level++;
    }
    if (!HC.sim.rt.silent) bus.emit('built', b);
    bus.emit('dirty');
  }

  // New or bigger hives take spare bees from the bee box automatically.
  function fillFromBox(s, h) {
    while (s.box.length && h.bees.length < f().hiveCap(h)) h.bees.push(s.box.shift());
  }

  // Called every update: finish anything whose time is up.
  function update(s) {
    for (const b of s.builds.slice()) if (s.clock >= b.end) finish(s, b);
  }

  // Finish a build right now by paying gems.
  function skip(s, id) {
    const b = s.builds.find((x) => x.id === id);
    if (!b) return { ok: false, msg: 'That build already finished.' };
    const cost = f().gemsToSkip(left(s, b));
    if (s.gems < cost) return { ok: false, msg: 'Not enough gems. Goals, requests and festivals award more.' };
    s.gems -= cost;
    s.stats.skips++;
    finish(s, b);
    return { ok: true, msg: b.label + ' finished.' };
  }

  HC.builds = { start, finish, update, skip, find, left, freeBuilder };
})();

<script>
// =============================================================================
// customers.js: SHOPPERS AND TOWNSFOLK
// -----------------------------------------------------------------------------
// Every customer is a little "state machine": at any moment they're in one
// state (walking in, browsing a shelf, waiting in line...) and switch to the
// next when something happens. The journey:
//
//   enter    walk from the street through the door to the aisle
//   toShelf  walk to the shelf they picked
//   browse   look for a moment, take items off the shelf
//   toQueue  walk to the end of the checkout line
//   queue    wait in line. They can only pay once someone is standing at the
//            register. If they wait longer than their patience allows, they
//            put the items back and storm out (reputation drops).
//   pay      the person at the register rings them up and coins are earned
//   exit / leave   walk out and disappear
//
// Nobody new arrives while the shop is closed at night.
//
// "Requesters" are townsfolk who walk up to the request board outside,
// pin a note (which becomes a request in the Town tab) and walk away.
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data: D, bus, nav } = HC;
  const L = HC.layout;
  const sim = () => HC.sim;
  const f = () => HC.sim.f;
  const rt = () => HC.sim.rt;

  // ---------------------------------------------------------------------------
  // Choosing what to buy
  // ---------------------------------------------------------------------------
  function rollCustomerType(s) {
    // More nobles and collectors show up as your reputation grows.
    return util.weighted(D.CUSTOMERS, (c) => c.weight + (c.repWeight || 0) * s.rep);
  }

  // Pick a shelf for this customer, or -1 if nothing suits them. They can
  // only afford products up to a few tiers below your best one on display,
  // and they prefer pricier items among what they can afford.
  function chooseShelf(s, ctype) {
    const best = f().bestStockedTier(s);
    if (best < 0) return -1;
    const maxTier = Math.max(0, best - ctype.offset);
    const idx = [];
    s.shelves.forEach((sh, i) => {
      if (sh.good && sh.qty > 0 && D.good[sh.good].tier <= maxTier) idx.push(i);
    });
    if (!idx.length) return -1;
    const pick = util.weighted(idx, (i) => {
      const p = D.good[s.shelves[i].good].price;
      return ctype.id === 'collector' ? Math.pow(p, 1.5) : Math.sqrt(p);
    });
    return pick == null ? -1 : pick;
  }

  // How many items they'll take; Tasting Samples adds a chance of one more.
  function unitsWanted(s, ctype) {
    let n = util.randInt(ctype.units[0], ctype.units[1]);
    for (let i = 0; i < s.up.samples; i++) if (Math.random() < 0.1) n++;
    return n;
  }

  // Reputation goes up a little with each happy customer (more slowly the
  // closer you are to 5 stars; String Lights and Lanterns speed it up)...
  function repGain(s, scale = 1) {
    const boost = 1 + f().decorBonus(s, 'rep');
    s.rep = Math.min(5, s.rep + 0.02 * scale * boost * (1 - s.rep / 5.5));
  }
  // ...and down with each unhappy one.
  function repLoss(s, amt = 0.04) {
    s.rep = Math.max(0, s.rep - amt);
  }

  // A random appearance for a new customer.
  function makeLook(ctype) {
    const hair = util.pick(D.HAIR), skin = util.pick(D.SKIN);
    const shirt = ctype.shirt || util.pick(D.SHIRTS);
    return { hair, skin, shirt, hat: ctype.hat };
  }

  // The route out of the shop to a random end of the street.
  function exitPath(fromY) {
    const side = Math.random() < 0.5 ? -12 : L.W + 12;
    const p = [];
    if (fromY < L.insideY) p.push({ x: L.doorX, y: L.insideY });
    p.push({ x: L.doorX, y: L.doorY }, { x: L.doorX, y: L.streetY }, { x: side, y: L.streetY });
    return p;
  }

  // ---------------------------------------------------------------------------
  // Creating people
  // ---------------------------------------------------------------------------
  function spawnCustomer(s) {
    const ctype = rollCustomerType(s);
    const fromLeft = Math.random() < 0.5;
    rt().customers.push({
      id: util.uid(),
      kind: 'customer',
      type: ctype,
      look: makeLook(ctype),
      x: fromLeft ? -12 : L.W + 12,
      y: L.streetY,
      dir: fromLeft ? 'right' : 'left',
      walk: 0,
      speed: util.rand(26, 34),
      state: 'enter',
      path: [
        { x: L.doorX, y: L.streetY },
        { x: L.doorX, y: L.doorY },
        { x: L.doorX, y: L.insideY },
        { x: L.doorX, y: L.aisleY },
      ],
      shelf: -1,
      retries: 0,
      bubble: null,
      timer: 0,
      wait: 0, // seconds spent waiting in line
      patience: util.rand(40, 70), // how long they'll wait before walking out
    });
  }

  // A townsperson who walks to the board outside and pins request `order`.
  function spawnRequester(s, order) {
    const fromLeft = Math.random() < 0.5;
    const look = makeLook(D.customer.villager);
    look.hat = util.pick([null, 'cap', 'straw', 'tophat']);
    rt().customers.push({
      id: util.uid(),
      kind: 'requester',
      order,
      look,
      x: fromLeft ? -12 : L.W + 12,
      y: L.streetY + 4,
      dir: fromLeft ? 'right' : 'left',
      walk: 0,
      speed: 30,
      state: 'toBoard',
      path: [{ x: L.board.x, y: L.streetY + 4 }],
      bubble: null,
      timer: 0,
    });
  }

  // ---------------------------------------------------------------------------
  // Leaving
  // ---------------------------------------------------------------------------
  function leaveUnhappy(s, c) {
    c.bubble = { kind: 'dots', t: 0 };
    c.state = 'leave';
    c.path = exitPath(c.y);
    repLoss(s);
    s.stats.disappointed++;
    bus.emit('disappointed', c);
  }

  // Waited too long in line: put the items back and storm out.
  function walkOut(s, c) {
    const q = rt().queue;
    q.splice(q.indexOf(c), 1);
    const sh = s.shelves[c.shelf];
    if (sh && sh.good === c.bought.good) sh.qty = Math.min(f().shelfCap(s), sh.qty + c.bought.qty);
    else sim().addToStore(s, c.bought.good, c.bought.qty);
    c.bubble = { kind: 'angry', t: 0 };
    c.state = 'leave';
    c.path = exitPath(c.y);
    repLoss(s, 0.06);
    s.stats.walkouts++;
    if (!rt().silent) bus.emit('walkout', c);
  }

  function goToShelf(c, idx) {
    c.shelf = idx;
    c.state = 'toShelf';
    c.path = [{ x: L.shelfX(idx), y: L.aisleY }];
  }

  // ---------------------------------------------------------------------------
  // One step of one person's behaviour.
  // ---------------------------------------------------------------------------
  function updateCustomer(s, c, dt) {
    // Speech bubbles fade after a moment (except the "I want this" bubble).
    if (c.bubble) {
      c.bubble.t += dt;
      if (c.bubble.kind !== 'good' && c.bubble.kind !== 'note' && c.bubble.t > 1.6) c.bubble = null;
    }
    switch (c.state) {
      // -- Requesters ----------------------------------------------------------
      case 'toBoard':
        if (nav.moveAlong(c, dt)) {
          c.state = 'pinning';
          c.dir = 'up';
          c.timer = 1.6;
          c.bubble = { kind: 'note', t: 0 };
        }
        break;
      case 'pinning':
        c.timer -= dt;
        if (c.timer <= 0) {
          c.bubble = null;
          sim().pinOrder(s, c.order);
          c.state = 'leave';
          const side = Math.random() < 0.5 ? -12 : L.W + 12;
          c.path = [{ x: side, y: c.y }];
        }
        break;

      // -- Customers ------------------------------------------------------------
      case 'enter':
        if (nav.moveAlong(c, dt)) {
          const idx = chooseShelf(s, c.type);
          if (idx < 0) leaveUnhappy(s, c);
          else goToShelf(c, idx);
        }
        break;
      case 'toShelf':
        if (nav.moveAlong(c, dt)) {
          c.state = 'browse';
          c.dir = 'up';
          c.timer = util.rand(0.9, 1.7);
          const sh = s.shelves[c.shelf];
          c.bubble = sh.good ? { kind: 'good', good: sh.good, t: 0 } : null;
        }
        break;
      case 'browse': {
        c.timer -= dt;
        if (c.timer > 0) break;
        c.bubble = null;
        const sh = s.shelves[c.shelf];
        const maxTier = Math.max(0, f().bestStockedTier(s) - c.type.offset);
        if (sh && sh.good && sh.qty > 0 && D.good[sh.good].tier <= maxTier) {
          // Take the items off the shelf and head for the line.
          const take = Math.min(unitsWanted(s, c.type), sh.qty);
          sh.qty -= take;
          c.bought = { good: sh.good, qty: take };
          c.total = f().price(s, sh.good, c.type.mult || 1) * take;
          rt().queue.push(c);
          c.state = 'toQueue';
          const slot = L.queueSlot(rt().queue.length - 1);
          const sx = L.shelfX(c.shelf);
          c.path = [
            { x: sx, y: L.turnY },
            { x: L.corridorX, y: L.turnY },
            { x: L.corridorX, y: slot.y },
            { x: slot.x, y: slot.y },
          ];
          c.bubble = { kind: 'heart', t: 0 };
        } else if (c.retries < 1) {
          // Someone got there first; try one other shelf.
          c.retries++;
          const idx = chooseShelf(s, c.type);
          if (idx < 0) leaveUnhappy(s, c);
          else goToShelf(c, idx);
        } else leaveUnhappy(s, c);
        break;
      }
      case 'toQueue':
        c.wait += dt;
        if (nav.moveAlong(c, dt)) c.state = 'queue';
        break;
      case 'queue': {
        const qi = rt().queue.indexOf(c);
        const slot = L.queueSlot(qi);
        // Shuffle forward when the line moves.
        if (Math.abs(c.x - slot.x) > 0.5 || Math.abs(c.y - slot.y) > 0.5) {
          c.path = [slot];
          nav.moveAlong(c, dt);
          break;
        }
        c.dir = qi === 0 ? 'up' : qi < 3 ? 'right' : 'down';
        c.wait += dt;
        // First in line and someone is at the register: start paying.
        if (qi === 0 && HC.workers && HC.workers.cashierPresent(s)) {
          c.state = 'pay';
          c.timer = f().checkoutTime(s);
          break;
        }
        // Getting impatient: show a "!" when nearly out of patience.
        if (c.wait > c.patience * 0.7 && (!c.bubble || c.bubble.kind !== 'impatient')) c.bubble = { kind: 'impatient', t: 0 };
        if (c.wait > c.patience) walkOut(s, c);
        break;
      }
      case 'pay':
        c.timer -= dt;
        if (c.timer <= 0) {
          sim().earn(s, c.total, L.desk.x, L.desk.y - 24);
          s.stats.sold += c.bought.qty;
          s.stats.customers++;
          s.stats.best = Math.max(s.stats.best, c.total);
          repGain(s);
          rt().queue.shift();
          c.state = 'exit';
          c.path = exitPath(c.y);
          c.bubble = null;
          bus.emit('sale', c);
        }
        break;
      case 'exit':
      case 'leave':
        if (nav.moveAlong(c, dt)) c.done = true;
        break;
    }
  }

  // Called every update: maybe let a new customer in, then move everyone.
  function update(s, dt) {
    const r = rt();
    r.spawnT -= dt;
    if (r.spawnT <= 0) {
      r.spawnT = f().spawnInterval(s) * util.rand(0.7, 1.3);
      const shoppers = r.customers.filter((c) => c.kind === 'customer').length;
      if (f().isOpen(s) && shoppers < 14) spawnCustomer(s);
    }
    for (const c of r.customers) updateCustomer(s, c, dt);
    r.customers = r.customers.filter((c) => !c.done);
  }

  // Fast-forward version of a whole customer visit, used while you're away:
  // pick a shelf, buy, pay, done. No walking, no waiting.
  function instantSale(s) {
    const ctype = rollCustomerType(s);
    const idx = chooseShelf(s, ctype);
    if (idx < 0) {
      s.stats.disappointed++;
      repLoss(s, 0.01);
      return 0;
    }
    const sh = s.shelves[idx];
    const take = Math.min(unitsWanted(s, ctype), sh.qty);
    sh.qty -= take;
    const amt = f().price(s, sh.good, ctype.mult || 1) * take;
    s.coins += amt;
    s.lifetime += amt;
    s.runEarned += amt;
    s.stats.sold += take;
    s.stats.customers++;
    repGain(s);
    sim().restockInstant(s);
    return amt;
  }

  HC.customers = { update, spawnRequester, instantSale, chooseShelf };
})();

</script>
<script>
// =============================================================================
// workers.js: THE SHOPKEEPER AND THE STAFF
// -----------------------------------------------------------------------------
// Everyone who works at the shop is a "worker". There is always the
// shopkeeper (you), plus any staff you've hired:
//
//   Shopkeeper  Stands at the register ringing up customers. Goes out to a
//               hive only when you tap it (honey collection), and restocks
//               an empty shelf when the shop is quiet. While they're out,
//               nobody is at the register unless you hired a Cashier.
//   Cashier     Never leaves the register.
//   Stocker     Refills shelves from the storehouse whenever they run low.
//   Collector   Brings honey in from any hive that's filling up.
//   Candle Maker  Loads wax into the Candle Machine and carries candles out.
//
// HOW A JOB WORKS
// A job is a to-do list of steps, done in order:
//   { go: 'HV2' }             walk to that spot on the map (see nav.js)
//   { wait: 1.5 }             stand still for 1.5 seconds (working)
//   { act: function }         do something instantly: pick up honey, put it
//                             down... An act can add more steps (e.g. "now
//                             visit these three shelves") or a wait.
// When the list is finished the worker is idle again and picks new work.
// =============================================================================
(function () {
  const HC = window.HC;
  const { data: D, bus, nav } = HC;
  const sim = () => HC.sim;
  const f = () => HC.sim.f;
  const rt = () => HC.sim.rt;

  // Where each kind of worker waits when there's nothing to do.
  function homeOf(s, role) {
    if (role === 'keeper') return s.staff.cashier ? 'SIDE' : 'DESK';
    return { cashier: 'DESK', stocker: 'STORE', collector: 'LANE3', candler: 'MACH' }[role];
  }

  // Jobs you've asked the shopkeeper to do (tapping hives, the machine...).
  // Kept outside the save: a reload simply forgets pending errands.
  const keeperJobs = [];

  // ---------------------------------------------------------------------------
  // Creating and removing workers
  // ---------------------------------------------------------------------------
  function makeWorker(s, role, atNode) {
    const p = nav.NODES[atNode];
    return {
      id: role,
      role,
      x: p.x, y: p.y, node: atNode,
      dir: 'down', walk: 0,
      speed: role === 'keeper' ? 38 : 32, // pixels per second
      path: [],
      job: null,
      carry: {}, // what they're holding, e.g. { wildflower: 12 }
      waitT: 0,
      thinkT: 0, // staff only look for work every half second
    };
  }

  // Make sure the list of workers matches who is hired: add newcomers (they
  // walk in from the street), remove anyone who left (dropping what they
  // carried into the storehouse).
  function sync(s) {
    const list = rt().workers;
    if (!list.find((w) => w.role === 'keeper')) list.push(makeWorker(s, 'keeper', homeOf(s, 'keeper')));
    for (const st of D.STAFF) {
      const has = list.find((w) => w.role === st.id);
      if (s.staff[st.id] && !has) {
        const w = makeWorker(s, st.id, 'STREET');
        w.job = { label: 'Arriving for their first shift', steps: [{ go: homeOf(s, st.id) }], i: 0 };
        list.push(w);
      } else if (!s.staff[st.id] && has) {
        dropCarry(s, has);
        list.splice(list.indexOf(has), 1);
      }
    }
    // With a Cashier hired, the shopkeeper steps aside from the register.
    const k = list.find((w) => w.role === 'keeper');
    if (k && !k.job && k.node !== homeOf(s, 'keeper')) k.job = homeJob(s, k);
  }

  function dropCarry(s, w) {
    for (const g in w.carry) sim().addToStore(s, g, w.carry[g]);
    w.carry = {};
  }
  function dropAll(s) {
    for (const w of rt().workers) dropCarry(s, w);
  }
  const carried = (w) => Object.values(w.carry).reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------------
  // Job recipes
  // ---------------------------------------------------------------------------
  function homeJob(s, w) {
    return { label: 'Heading back', steps: [{ go: homeOf(s, w.role) }], i: 0 };
  }

  // Put everything being carried into the storehouse (takes a second).
  const depositStep = { act: (s, w) => {
    const had = carried(w);
    dropCarry(s, w);
    return { wait: had ? 1 : 0 };
  } };

  // Walk to hive i, scoop out as much honey as the basket holds, bring it to
  // the storehouse, go back to your spot.
  function collectJob(s, w, i) {
    w.targetHive = i;
    return {
      type: 'collect', hive: i, label: 'Collecting honey from Hive ' + (i + 1),
      steps: [
        { go: 'HV' + i },
        { act: (s2, w2) => {
          w2.targetHive = null;
          if (!s2.hives[i]) return { insert: [{ go: homeOf(s2, w2.role) }] };
          const got = sim().takeFromHive(s2, i, f().carryCap(s2) - carried(w2));
          let n = 0;
          for (const g in got) {
            w2.carry[g] = (w2.carry[g] || 0) + got[g];
            n += got[g];
          }
          if (!n) return { insert: [{ go: homeOf(s2, w2.role) }] }; // nothing there after all
          if (!rt().silent) bus.emit('collected', { hive: i, n, who: w2.role });
          return { wait: 1 + 0.04 * n };
        } },
        { go: 'STORE' },
        depositStep,
        { go: homeOf(s, w.role) },
      ],
      i: 0,
    };
  }

  // Walk to the storehouse, fill the basket with what the emptiest shelves
  // need, visit each of those shelves, then return anything left over.
  function restockJob(s, w, threshold) {
    return {
      type: 'restock', label: 'Restocking the shelves',
      steps: [
        { go: 'STORE' },
        { act: (s2, w2) => {
          const cap = f().shelfCap(s2);
          let room = f().carryCap(s2) - carried(w2);
          const visits = [];
          // Emptiest shelves first.
          const order = s2.shelves.map((sh, k) => k).filter((k) => s2.shelves[k].good)
            .sort((a, b) => s2.shelves[a].qty - s2.shelves[b].qty);
          for (const k of order) {
            const sh = s2.shelves[k];
            if (room <= 0) break;
            if (sh.qty > threshold) continue;
            const take = Math.min(cap - sh.qty, s2.store[sh.good] || 0, room);
            if (take <= 0) continue;
            s2.store[sh.good] -= take;
            w2.carry[sh.good] = (w2.carry[sh.good] || 0) + take;
            room -= take;
            visits.push({ go: 'SH' + k }, { act: placeOnShelf(k) });
          }
          if (!visits.length) return { insert: [{ go: homeOf(s2, w2.role) }] };
          return {
            wait: 0.8,
            insert: visits.concat([
              { act: (s3, w3) => (carried(w3) ? { insert: [{ go: 'STORE' }, depositStep, { go: homeOf(s3, w3.role) }] } : { insert: [{ go: homeOf(s3, w3.role) }] }) },
            ]),
          };
        } },
      ],
      i: 0,
    };
  }
  function placeOnShelf(k) {
    return (s, w) => {
      const sh = s.shelves[k];
      if (!sh || !sh.good || !w.carry[sh.good]) return {};
      const put = Math.min(w.carry[sh.good], f().shelfCap(s) - sh.qty);
      sh.qty += put;
      w.carry[sh.good] -= put;
      if (w.carry[sh.good] <= 0) delete w.carry[sh.good];
      return { wait: 0.5 };
    };
  }

  // Candle Machine run: fetch wax from the storehouse, load it, take the
  // finished candles, bring them back to the storehouse.
  function tendJob(s, w) {
    return {
      type: 'tend', label: 'Tending the Candle Machine',
      steps: [
        { go: 'STORE' },
        { act: (s2, w2) => {
          const m = s2.machine;
          if (!m) return { insert: [{ go: homeOf(s2, w2.role) }] };
          const want = Math.min(f().carryCap(s2) - carried(w2), f().machineCap(s2) - m.wax, s2.store.wax || 0);
          if (want > 0) {
            s2.store.wax -= want;
            w2.carry.wax = (w2.carry.wax || 0) + want;
            return { wait: 0.8 };
          }
          return {};
        } },
        { go: 'MACH' },
        { act: (s2, w2) => {
          const m = s2.machine;
          if (!m) return {};
          if (w2.carry.wax) {
            // Only top the machine up to its limit (someone else may have
            // loaded it meanwhile); any spare wax goes back to the storehouse.
            const load = Math.min(w2.carry.wax, f().machineCap(s2) - m.wax);
            m.wax += load;
            w2.carry.wax -= load;
            if (w2.carry.wax <= 0) delete w2.carry.wax;
          }
          const take = Math.min(m.candles, f().carryCap(s2) - carried(w2));
          if (take > 0) {
            m.candles -= take;
            w2.carry.candle = (w2.carry.candle || 0) + take;
          }
          return { wait: 1.5 };
        } },
        { act: (s2, w2) => (carried(w2) ? { insert: [{ go: 'STORE' }, depositStep, { go: homeOf(s2, w2.role) }] } : { insert: [{ go: homeOf(s2, w2.role) }] }) },
      ],
      i: 0,
    };
  }

  // ---------------------------------------------------------------------------
  // Deciding what to do next (only when idle)
  // ---------------------------------------------------------------------------
  // Does any stocked shelf have `threshold` items or fewer while the
  // storehouse has more of that product?
  function shelvesNeed(s, threshold) {
    return s.shelves.some((sh) => sh.good && sh.qty <= threshold && (s.store[sh.good] || 0) > 0);
  }

  function nextJobFor(s, w) {
    const r = rt();
    if (w.role === 'keeper') {
      // Never walk away in the middle of ringing someone up.
      if (!s.staff.cashier && r.queue[0] && r.queue[0].state === 'pay') return null;
      if (keeperJobs.length) {
        const j = keeperJobs.shift();
        if (j.type === 'collect') return collectJob(s, w, j.hive);
        if (j.type === 'tend') return tendJob(s, w);
        if (j.type === 'restock') return restockJob(s, w, f().shelfCap(s) - 1);
      }
      // Quietly restock an empty shelf, but only if nobody is waiting to pay
      // (or a Cashier is covering) and there's no Stocker to do it.
      if (!s.staff.stocker && (s.staff.cashier || !r.queue.length) && shelvesNeed(s, 0)) return restockJob(s, w, 1);
      return null;
    }
    if (w.role === 'stocker' && shelvesNeed(s, 3)) return restockJob(s, w, 3);
    if (w.role === 'collector') {
      // Fullest hive first, skipping any another worker is already heading to.
      const taken = new Set(r.workers.filter((o) => o !== w && o.targetHive != null).map((o) => o.targetHive));
      let best = -1, bestFill = 0.3;
      s.hives.forEach((h, i) => {
        const fill = f().honeyIn(h) / f().honeyCap(h);
        if (!taken.has(i) && fill >= bestFill) {
          best = i;
          bestFill = fill;
        }
      });
      if (best >= 0) return collectJob(s, w, best);
    }
    if (w.role === 'candler' && s.machine) {
      const m = s.machine;
      if (m.candles >= 4 || (m.wax <= f().machineCap(s) * 0.3 && (s.store.wax || 0) >= 3)) return tendJob(s, w);
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // Carrying out the current job, step by step
  // ---------------------------------------------------------------------------
  function runJob(s, w, dt) {
    const job = w.job;
    for (let guard = 0; guard < 20; guard++) {
      const step = job.steps[job.i];
      if (!step) {
        w.job = null;
        return;
      }
      if (step.go) {
        if (!w.path.length && w.node === step.go) {
          job.i++;
          continue;
        }
        if (!w.path.length) w.path = nav.route(w.node, step.go);
        if (nav.moveAlong(w, dt)) {
          w.node = step.go;
          job.i++;
        }
        return;
      }
      if (step.wait != null) {
        w.waitT += dt;
        if (w.waitT < step.wait) return;
        w.waitT = 0;
        job.i++;
        continue;
      }
      if (step.act) {
        const res = step.act(s, w) || {};
        job.i++;
        const extra = [];
        if (res.wait) extra.push({ wait: res.wait });
        if (res.insert) extra.push(...res.insert);
        if (extra.length) job.steps.splice(job.i, 0, ...extra);
        if (res.wait) return;
      }
    }
  }

  // Called every update.
  function update(s, dt) {
    sync(s);
    for (const w of rt().workers) {
      if (w.job) {
        runJob(s, w, dt);
        continue;
      }
      // Idle: look for work (staff check twice a second; the keeper every frame).
      w.thinkT -= dt;
      if (w.role !== 'keeper' && w.thinkT > 0) continue;
      w.thinkT = 0.5;
      w.job = nextJobFor(s, w);
      if (!w.job && w.node !== homeOf(s, w.role)) w.job = homeJob(s, w);
      if (!w.job) {
        // Stand facing the right way at home.
        w.dir = w.role === 'collector' ? 'right' : w.role === 'stocker' ? 'left' : w.role === 'candler' ? 'up' : 'down';
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Questions other files ask
  // ---------------------------------------------------------------------------
  // Is someone standing at the register ready to take payment?
  function cashierPresent(s) {
    return rt().workers.some((w) => !w.job && !w.path.length && w.node === 'DESK');
  }

  function keeper() {
    return rt().workers.find((w) => w.role === 'keeper');
  }

  // Ask the shopkeeper to collect from hive i (queued if they're busy).
  function orderCollect(s, i) {
    if (keeperJobs.some((j) => j.type === 'collect' && j.hive === i)) return { ok: false, msg: 'Already on the list.' };
    const k = keeper();
    if (k && k.job && k.job.type === 'collect' && k.job.hive === i) return { ok: false, msg: 'On the way already.' };
    if (keeperJobs.length >= 6) return { ok: false, msg: 'The shopkeeper has enough errands for now.' };
    keeperJobs.push({ type: 'collect', hive: i });
    return { ok: true };
  }
  function orderTend() {
    if (keeperJobs.some((j) => j.type === 'tend')) return { ok: false, msg: 'Already on the list.' };
    keeperJobs.push({ type: 'tend' });
    return { ok: true };
  }
  function orderRestock() {
    if (keeperJobs.some((j) => j.type === 'restock')) return { ok: false, msg: 'Already on the list.' };
    keeperJobs.push({ type: 'restock' });
    return { ok: true };
  }
  function cancelErrands() {
    keeperJobs.length = 0;
  }

  // A short sentence describing what a worker is up to (shown in the UI).
  function statusOf(s, w) {
    if (w.job) return w.job.label;
    if (w.node === 'DESK') return 'At the register';
    if (w.role === 'keeper') return 'Beside the register';
    return { stocker: 'Waiting by the storeroom', collector: 'Watching the hives', candler: 'Minding the machine' }[w.role] || 'Idle';
  }

  HC.workers = {
    sync, update, dropAll, cashierPresent, keeper, orderCollect, orderTend, orderRestock, cancelErrands,
    statusOf, homeOf, keeperJobs,
    get list() { return rt().workers; },
  };
})();

</script>
<script>
// =============================================================================
// actions.js: EVERYTHING THE PLAYER CAN DO
// -----------------------------------------------------------------------------
// Every button in the game ends up calling one of these functions. Each one
// checks the move is allowed (enough coins? room for the bee?), changes the
// save, and returns { ok: true/false, msg: 'what happened' }. The UI shows
// `msg` as a little pop-up message.
//
// They also announce 'dirty' on the message bus, which tells the menus to
// redraw because something changed, plus a sound effect name ('buy', 'click'...).
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data: D, bus } = HC;
  const S = () => HC.game; // the current save
  const f = () => HC.sim.f; // the formulas in sim.js

  // Helpers for returning results.
  function fail(msg) {
    bus.emit('fail', msg);
    return { ok: false, msg };
  }
  function done(msg, sound = 'buy') {
    bus.emit('dirty');
    if (sound) bus.emit('sfx', sound);
    return { ok: true, msg };
  }
  // Pay `cost` coins if you can afford it. Returns true if paid.
  function spend(cost) {
    const s = S();
    if (s.coins < cost) return false;
    s.coins -= cost;
    return true;
  }
  // Pass a builds.js result through as an action result.
  function fromBuild(r) {
    return r.ok ? done(r.msg, 'buy') : fail(r.msg);
  }

  // Put a new bee in the first hive with space, else the bee box.
  function placeBee(bee) {
    const s = S();
    const h = s.hives.find((hv) => hv.bees.length < f().hiveCap(hv));
    if (h) {
      h.bees.push(bee.id);
      return 'hive';
    }
    s.box.push(bee.id);
    return 'box';
  }
  function hasRoom() {
    const s = S();
    return s.hives.some((h) => h.bees.length < f().hiveCap(h)) || s.box.length < f().boxCap(s);
  }
  // First time you get a species: a few gems.
  function newSpeciesReward(isNew) {
    if (isNew) HC.sim.gainGems(S(), D.GEMS.newSpecies, 'a new species');
  }

  const act = {
    // -------------------------------------------------------------------------
    // BEES
    // -------------------------------------------------------------------------
    buyBee(sp) {
      const s = S();
      if (!f().marketUnlocked(s, sp)) return fail('That bee is not for sale yet.');
      if (!hasRoom()) return fail('No room. Build a hive or expand the bee box.');
      const cost = f().marketPrice(s, sp);
      if (!spend(cost)) return fail('Not enough coins.');
      s.market[sp] = (s.market[sp] || 0) + 1;
      const isNew = !s.discovered[sp];
      const bee = HC.state.makeBee(s, sp);
      const where = placeBee(bee);
      newSpeciesReward(isNew);
      bus.emit('newBee', { bee, isNew, source: 'market' });
      return done(bee.name + ' the ' + D.species[sp].name + ' joined your ' + (where === 'hive' ? 'hive' : 'bee box') + '.');
    },

    // Move a bee to hive number `target`, or to 'box'.
    moveBee(id, target) {
      const s = S();
      if (!s.bees[id]) return fail('That bee is gone.');
      const from = f().hiveOf(s, id);
      if (target === 'box') {
        if (from < 0) return fail('Already in the bee box.');
        if (s.box.length >= f().boxCap(s)) return fail('The bee box is full.');
        s.hives[from].bees = s.hives[from].bees.filter((b) => b !== id);
        s.box.push(id);
        return done(s.bees[id].name + ' moved to the bee box.', 'click');
      }
      const h = s.hives[target];
      if (!h) return fail('No such hive.');
      if (from === target) return fail('Already in that hive.');
      if (h.bees.length >= f().hiveCap(h)) return fail('Hive ' + (target + 1) + ' is full.');
      if (from >= 0) s.hives[from].bees = s.hives[from].bees.filter((b) => b !== id);
      else s.box = s.box.filter((b) => b !== id);
      h.bees.push(id);
      return done(s.bees[id].name + ' moved to hive ' + (target + 1) + '.', 'click');
    },

    // Swap a spare bee with one living in a hive.
    swapBee(boxId, hiveIdx, hiveBeeId) {
      const s = S();
      const h = s.hives[hiveIdx];
      if (!h || !h.bees.includes(hiveBeeId) || !s.box.includes(boxId)) return fail('Those bees moved.');
      h.bees[h.bees.indexOf(hiveBeeId)] = boxId;
      s.box[s.box.indexOf(boxId)] = hiveBeeId;
      return done('Swapped ' + s.bees[boxId].name + ' into hive ' + (hiveIdx + 1) + '.', 'click');
    },

    sellBee(id) {
      const s = S();
      const bee = s.bees[id];
      if (!bee) return fail('That bee is gone.');
      if (f().beeCount(s) <= 1) return fail('Keep at least one bee.');
      if (s.nursery.some((n) => n && (n.a === id || n.b === id))) return fail(bee.name + ' is busy in the nursery.');
      const price = f().sellPrice(bee);
      s.hives.forEach((h) => (h.bees = h.bees.filter((b) => b !== id)));
      s.box = s.box.filter((b) => b !== id);
      if (s.keepsake === id) s.keepsake = null;
      delete s.bees[id];
      HC.sim.earn(s, price);
      return done(bee.name + ' went to a keeper in the next town for ₵' + util.fmt(price) + '.', 'coin');
    },

    // Sell every spare bee except the best of each species, sparkles, and
    // any bee raising an egg. With dryRun, only reports what would happen.
    sellExtras(dryRun) {
      const s = S();
      const busy = f().busyBees(s);
      const best = {};
      for (const id of s.box) {
        const b = s.bees[id];
        if (b.sparkle) continue; // sparkles are always kept, so they can't displace the best normal bee
        if (!best[b.sp] || f().beeValue(b) > f().beeValue(s.bees[best[b.sp]])) best[b.sp] = id;
      }
      const sell = s.box.filter((id) => !busy.has(id) && best[s.bees[id].sp] !== id && !s.bees[id].sparkle);
      const total = sell.reduce((t, id) => t + f().sellPrice(s.bees[id]), 0);
      if (dryRun) return { ok: true, count: sell.length, total };
      if (!sell.length) return fail('Nothing to sell: the box only holds your best bee of each kind.');
      for (const id of sell) delete s.bees[id];
      s.box = s.box.filter((id) => s.bees[id]);
      HC.sim.earn(s, total);
      return done('Sold ' + sell.length + ' spare bees for ₵' + util.fmt(total) + '.', 'coin');
    },

    renameBee(id, name) {
      const s = S();
      const bee = s.bees[id];
      name = String(name || '').trim().slice(0, 16);
      if (!bee || !name) return fail('Enter a name.');
      bee.name = name;
      return done('Renamed to ' + name + '.', 'click');
    },

    // -------------------------------------------------------------------------
    // HONEY COLLECTION AND ERRANDS (the shopkeeper walks out to do these)
    // -------------------------------------------------------------------------
    collect(i) {
      const s = S();
      const h = s.hives[i];
      if (!h) return fail('No such hive.');
      if (f().honeyIn(h) <= 0) return fail('Hive ' + (i + 1) + ' has no honey yet.');
      const r = HC.workers.orderCollect(s, i);
      if (!r.ok) return fail(r.msg);
      return done('The shopkeeper will collect from Hive ' + (i + 1) + '.', 'click');
    },
    collectAll() {
      const s = S();
      let n = 0;
      s.hives.forEach((h, i) => {
        if (f().honeyIn(h) > 0 && HC.workers.orderCollect(s, i).ok) n++;
      });
      if (!n) return fail('No hives have honey waiting (or they are already on the list).');
      return done('The shopkeeper will visit ' + n + (n === 1 ? ' hive.' : ' hives.'), 'click');
    },
    tendMachine() {
      const s = S();
      if (!s.machine) return fail('Build the Candle Machine first.');
      if (!s.machine.candles && !(s.store.wax > 0)) return fail('No Beeswax in the storehouse and no candles to unload.');
      const r = HC.workers.orderTend();
      if (!r.ok) return fail(r.msg);
      return done('The shopkeeper will tend the Candle Machine.', 'click');
    },
    restockNow() {
      const r = HC.workers.orderRestock();
      if (!r.ok) return fail(r.msg);
      return done('The shopkeeper will restock the shelves.', 'click');
    },
    cancelErrands() {
      HC.workers.cancelErrands();
      return done('Errands cleared.', 'click');
    },

    // -------------------------------------------------------------------------
    // SHELVES
    // -------------------------------------------------------------------------
    // Choose what shelf i sells. Items already on it go back to the storehouse.
    setShelf(i, good) {
      const s = S();
      const sh = s.shelves[i];
      if (!sh) return fail('No such shelf.');
      if (good && !s.unlockedGoods[good]) return fail('You have not made that yet.');
      if (good && D.good[good].raw) return fail(D.good[good].name + ' is an ingredient, not something to sell.');
      if (sh.good && sh.qty) HC.sim.addToStore(s, sh.good, sh.qty);
      sh.good = good || null;
      sh.qty = 0;
      return done(good ? 'Shelf ' + (i + 1) + ' will sell ' + D.good[good].name + ' once it is restocked.' : 'Shelf ' + (i + 1) + ' cleared.', 'click');
    },

    // -------------------------------------------------------------------------
    // BUILDING (all timed: see builds.js)
    // -------------------------------------------------------------------------
    buyUpgrade(id) {
      const s = S();
      const u = D.upgrade[id];
      if (!u) return fail('Unknown upgrade.');
      if (s.up[id] >= u.max) return fail(u.name + ' is maxed out.');
      return fromBuild(HC.builds.start(s, 'upgrade', id, u.name + ' Lv ' + (s.up[id] + 1), f().upgradeCost(s, id)));
    },
    buildHive() {
      const s = S();
      if (s.hives.length >= 6) return fail('The garden has room for six hives.');
      if (HC.builds.find(s, 'hive', s.hives.length)) return fail('That hive is already being built.');
      return fromBuild(HC.builds.start(s, 'hive', s.hives.length, 'Hive ' + (s.hives.length + 1), f().hiveCost(s)));
    },
    upgradeHive(i) {
      const s = S();
      const h = s.hives[i];
      if (!h) return fail('No such hive.');
      if (h.level >= D.HIVE_MAX_LEVEL) return fail('This hive is fully upgraded.');
      return fromBuild(HC.builds.start(s, 'hiveUp', i, 'Hive ' + (i + 1) + ' → Lv ' + (h.level + 2), f().hiveUpgradeCost(s, i)));
    },
    buildMachine() {
      const s = S();
      if (s.machine) return fail('You already have a Candle Machine.');
      if (!s.discovered.waxwing) return fail('You need Waxwing Bees making Beeswax first.');
      return fromBuild(HC.builds.start(s, 'machine', 0, 'Candle Machine', D.MACHINE.buildCost));
    },
    upgradeMachine() {
      const s = S();
      if (!s.machine) return fail('Build the Candle Machine first.');
      if (s.machine.level >= D.MACHINE.maxLevel) return fail('The machine is fully upgraded.');
      return fromBuild(HC.builds.start(s, 'machineUp', 0, 'Candle Machine Lv ' + (s.machine.level + 2), f().machineUpgradeCost(s)));
    },
    skipBuild(id) {
      const r = HC.builds.skip(S(), id);
      return r.ok ? done(r.msg, 'discover') : fail(r.msg);
    },
    // A second (or third) builder, bought with gems.
    buyBuilder() {
      const s = S();
      if (s.builders >= 3) return fail('Three builders is plenty.');
      const cost = D.GEMS.builderSlot * s.builders;
      if (s.gems < cost) return fail('Not enough gems.');
      s.gems -= cost;
      s.builders++;
      return done('A new builder joins the crew. You can build ' + s.builders + ' things at once.', 'discover');
    },

    // -------------------------------------------------------------------------
    // STAFF
    // -------------------------------------------------------------------------
    hire(id) {
      const s = S();
      const st = D.staff[id];
      if (!st) return fail('Unknown job.');
      if (s.staff[id]) return fail('You already have a ' + st.name + '.');
      if (st.needs === 'machine' && !s.machine) return fail('Build the Candle Machine first.');
      if (!spend(st.hire)) return fail('Not enough coins.');
      s.staff[id] = true;
      HC.workers.sync(s);
      return done('You hired a ' + st.name + '. Wages are ₵' + st.wage + ' each morning.');
    },
    fire(id) {
      const s = S();
      if (!s.staff[id]) return fail('Nobody to let go.');
      s.staff[id] = false;
      HC.workers.sync(s);
      return done('Your ' + D.staff[id].name + ' has left. No more wages for them.', 'click');
    },

    // -------------------------------------------------------------------------
    // NURSERY
    // -------------------------------------------------------------------------
    startBreed(slot, aId, bId) {
      const s = S();
      const a = s.bees[aId], b = s.bees[bId];
      if (!a || !b || aId === bId) return fail('Pick two different bees.');
      if (s.nursery[slot]) return fail('That cradle is busy.');
      if (f().busyBees(s).has(aId) || f().busyBees(s).has(bId)) return fail('One of those bees is already in the nursery.');
      const cost = f().breedCost(a, b);
      if (!spend(cost)) return fail('Not enough coins.');
      s.nursery[slot] = { a: aId, b: bId, t: 0, dur: f().breedTime(a, b), ready: false };
      bus.emit('breedStart', slot);
      return done(a.name + ' and ' + b.name + ' are resting in the nursery with an egg.');
    },
    skipEgg(slot) {
      const s = S();
      const n = s.nursery[slot];
      if (!n || n.ready) return fail('Nothing to hurry.');
      const cost = f().gemsToSkip(n.dur - n.t);
      if (s.gems < cost) return fail('Not enough gems.');
      s.gems -= cost;
      s.stats.skips++;
      n.t = n.dur;
      n.ready = true;
      return done('The egg is ready to hatch!', 'discover');
    },
    hatch(slot) {
      const s = S();
      const n = s.nursery[slot];
      if (!n || !n.ready) return fail('The egg is not ready.');
      if (!hasRoom()) return fail('No room for a new bee. Free a space first.');
      const a = s.bees[n.a], b = s.bees[n.b];
      // Parents may have been sold mid-brood; fall back to whichever is left.
      const pa = a || b, pb = b || a;
      if (!pa) {
        s.nursery[slot] = null;
        return fail('Both parents are gone; the egg was lost.');
      }
      const egg = HC.sim.decideEgg(s, pa, pb);
      const isNew = !s.discovered[egg.sp];
      const newSparkle = egg.sparkle && !s.sparkleSeen[egg.sp];
      const bee = HC.state.makeBee(s, egg.sp, egg);
      placeBee(bee);
      s.nursery[slot] = null;
      s.stats.bred++;
      newSpeciesReward(isNew);
      bus.emit('newBee', { bee, isNew, newSparkle, source: 'nursery' });
      return done(null, 'hatch');
    },
    cancelBreed(slot) {
      const s = S();
      if (!s.nursery[slot]) return fail('Nothing to cancel.');
      s.nursery[slot] = null;
      return done('The cradle is empty again. The parents are back at work.', 'click');
    },

    // -------------------------------------------------------------------------
    // TOWN
    // -------------------------------------------------------------------------
    deliverOrder(id) {
      const s = S();
      const o = s.orders.find((x) => x.id === id);
      if (!o) return fail('That order has expired.');
      if ((s.store[o.good] || 0) < o.qty) return fail('Not enough ' + D.good[o.good].name + ' in the storehouse.');
      s.store[o.good] -= o.qty;
      s.orders = s.orders.filter((x) => x.id !== id);
      HC.sim.earn(s, o.reward);
      if (o.gems) HC.sim.gainGems(s, o.gems, o.who);
      s.rep = Math.min(5, s.rep + 0.15);
      s.stats.orders++;
      bus.emit('orderDone', o);
      return done(o.who + ' paid ₵' + util.fmt(o.reward) + (o.gems ? ' and ' + o.gems + ' 💎' : '') + '. Word gets around.', 'order');
    },
    dismissOrder(id) {
      const s = S();
      s.orders = s.orders.filter((x) => x.id !== id);
      return done(null, 'click');
    },
    buyMerchant() {
      const s = S();
      if (!s.merchant) return fail('The merchant has left.');
      if (!hasRoom()) return fail('No room for another bee.');
      const o = s.merchant.offer;
      if (!spend(o.price)) return fail('Not enough coins.');
      const isNew = !s.discovered[o.sp];
      const newSparkle = o.sparkle && !s.sparkleSeen[o.sp];
      const bee = HC.state.makeBee(s, o.sp, o);
      placeBee(bee);
      s.merchant = null;
      newSpeciesReward(isNew);
      bus.emit('newBee', { bee, isNew, newSparkle, source: 'merchant' });
      return done(null, 'hatch');
    },

    // -------------------------------------------------------------------------
    // STORE (cosmetics)
    // -------------------------------------------------------------------------
    buyItem(id) {
      const s = S();
      const item = D.item[id];
      if (!item) return fail('Unknown item.');
      if (s.cos.owned[id]) return fail('You already own that.');
      const cost = item.cost || {};
      if (cost.coins && s.coins < cost.coins) return fail('Not enough coins.');
      if (cost.gems && s.gems < cost.gems) return fail('Not enough gems.');
      if (cost.coins) s.coins -= cost.coins;
      if (cost.gems) s.gems -= cost.gems;
      s.cos.owned[id] = true;
      if (/Decor$/.test(item.cat)) s.stats.decor++;
      act.useItem(id, true);
      return done(item.name + ' is yours!', 'discover');
    },
    // Wear/use an owned item; decorations toggle between placed and stored.
    useItem(id, quiet) {
      const s = S();
      const item = D.item[id];
      if (!item || !s.cos.owned[id]) return fail('You do not own that yet.');
      const section = D.STORE_SECTIONS.find((x) => x.cat === item.cat);
      if (section.pick) s.cos.equip[item.cat] = id;
      else s.cos.placed[id] = quiet ? true : !s.cos.placed[id];
      if (quiet) return { ok: true };
      return done(section.pick ? item.name + ' equipped.' : item.name + (s.cos.placed[id] ? ' placed.' : ' put away.'), 'click');
    },

    // -------------------------------------------------------------------------
    // FESTIVAL (start over for permanent ribbons)
    // -------------------------------------------------------------------------
    holdFestival(keepId) {
      const old = S();
      const gain = f().festivalRibbons(old);
      if (!gain) return fail('The town is not ready for a festival yet.');
      const s = HC.state.newGame();
      // Carried over: lifetime totals, ribbons, the Field Guide, cosmetics,
      // gems, stats, settings and tutorial progress.
      s.lifetime = old.lifetime;
      s.ribbons = old.ribbons + gain;
      s.festivals = old.festivals + 1;
      s.discovered = old.discovered;
      s.sparkleSeen = old.sparkleSeen;
      s.triedPairs = old.triedPairs;
      s.stats = old.stats;
      s.settings = old.settings;
      s.hints = old.hints;
      s.goal = old.goal;
      s.cos = old.cos;
      s.gems = old.gems + D.GEMS.festival;
      s.builders = old.builders;
      s.playTime = old.playTime;
      s.time = old.time;
      s.clock = old.clock;
      s.lastDay = old.lastDay;
      s.coins = 50 * (1 + s.ribbons);
      for (const sp of Object.keys(s.discovered)) s.unlockedGoods[D.species[sp].good] = true;
      const keep = old.bees[keepId];
      if (keep) {
        const copy = Object.assign({}, keep, { prog: 0 });
        s.bees[copy.id] = copy;
        s.hives[0].bees.push(copy.id);
      }
      HC.game = s;
      HC.workers.cancelErrands();
      HC.sim.resetRuntime();
      bus.emit('festival', { gain, total: s.ribbons });
      return done(null, 'hatch');
    },
  };

  HC.act = act;
})();

</script>
<script>
// =============================================================================
// goals.js: THE GOAL CHAIN (the guided "what to do next" list)
// -----------------------------------------------------------------------------
// One goal is active at a time and shows in the strip under the game picture.
// When its `check` becomes true, a Claim button appears. Claiming pays the
// coin and gem reward and moves on to the next goal. Tapping the goal text
// shows a hint (the `tip`, or for "discover a species" goals, the Field
// Guide clue for that species).
//
// To add or reorder goals, edit the GOALS list below. Each entry is:
//   text   - what the player sees
//   check  - a test that looks at the save `s` and says whether it's done
//   reward - coins paid when claimed
//   gems   - gems paid when claimed
//   tip    - (optional) hint text
// =============================================================================
(function () {
  const HC = window.HC;
  const { bus } = HC;
  const f = () => HC.sim.f;
  // A reusable check for "have you discovered species sp?". It also records
  // the species so the hint can show the right Field Guide clue.
  const disc = (sp) => Object.assign((s) => !!s.discovered[sp], { sp });

  const GOALS = [
    { text: 'Collect honey from a hive', check: (s) => s.stats.collected > 0, reward: 20, gems: 2,
      tip: 'Tap a hive in the garden. The shopkeeper walks out, scoops up the honey and carries it to the storehouse.' },
    { text: 'Sell 10 items', check: (s) => s.stats.sold >= 10, reward: 30, gems: 1,
      tip: 'Customers only pay when someone is at the register, so keep the shopkeeper nearby while the line is long.' },
    { text: 'Buy another Meadow Bee', check: (s) => f().beeCount(s) >= 3, reward: 30, gems: 1,
      tip: 'Open the Apiary tab and scroll down to the Bee Market.' },
    { text: 'Build a second hive', check: (s) => s.hives.length >= 2, reward: 60, gems: 3,
      tip: 'Apiary tab → "Build hive 2". Building takes a little while.' },
    { text: 'Hire a Cashier', check: (s) => !!s.staff.cashier, reward: 80, gems: 3,
      tip: 'Shop tab → Staff. A Cashier keeps the register open while you collect honey.' },
    { text: 'Buy a Clover Bee', check: disc('clover'), reward: 100, gems: 2 },
    { text: 'Stock two different shelves', check: (s) => new Set(s.shelves.map((x) => x.good).filter(Boolean)).size >= 2, reward: 120, gems: 2,
      tip: 'Build an Extra Shelf in the Shop tab, then tap a shelf to choose what it sells.' },
    { text: 'Hatch an egg in the Nursery', check: (s) => s.stats.bred >= 1, reward: 150, gems: 3,
      tip: 'Nursery tab → Pick parents. The parents rest while they raise the egg.' },
    { text: 'Discover the Waxwing Bee', check: disc('waxwing'), reward: 250, gems: 3 },
    { text: 'Build the Candle Machine', check: (s) => !!s.machine, reward: 300, gems: 4,
      tip: 'Shop tab → Candle Machine. Waxwings make Beeswax; the machine turns it into candles.' },
    { text: 'Make 10 candles', check: (s) => s.stats.candles >= 10, reward: 400, gems: 3,
      tip: 'Tap the Candle Machine (behind the counter) to have the shopkeeper load wax and unload candles.' },
    { text: 'Fill a request from the board', check: (s) => s.stats.orders >= 1, reward: 300, gems: 3,
      tip: 'Townsfolk pin requests on the board outside the shop. Deliver them from the Town tab.' },
    { text: 'Hire a Honey Collector', check: (s) => !!s.staff.collector, reward: 500, gems: 4,
      tip: 'Shop tab → Staff. The collector brings honey in on their own, even while you are away.' },
    { text: 'Reach 3 stars of reputation', check: (s) => s.rep >= 3, reward: 500, gems: 4,
      tip: 'Keep shelves stocked and the line moving. Requests give a big boost.' },
    { text: 'Buy a decoration from the Store', check: (s) => s.stats.decor >= 1, reward: 200, gems: 5,
      tip: 'Store tab. Many decorations come with a small bonus.' },
    { text: 'Build a third hive', check: (s) => s.hives.length >= 3, reward: 600, gems: 4 },
    { text: 'Discover the Citrus Bee', check: disc('citrus'), reward: 1000, gems: 4 },
    { text: 'Upgrade any hive to level 3', check: (s) => s.hives.some((h) => h.level >= 2), reward: 1500, gems: 5 },
    { text: 'Discover the Lavender Bee', check: disc('lavender'), reward: 3000, gems: 5 },
    { text: 'Sell 1,000 items', check: (s) => s.stats.sold >= 1000, reward: 5000, gems: 5 },
    { text: 'Discover the Scout Bee', check: disc('scout'), reward: 6000, gems: 5 },
    { text: 'Build a fourth hive', check: (s) => s.hives.length >= 4, reward: 8000, gems: 6 },
    { text: 'Discover the Royal Bee', check: disc('royal'), reward: 15000, gems: 6 },
    { text: 'Discover the Moonmoth Bee', check: disc('moonmoth'), reward: 30000, gems: 8 },
    { text: 'Build a fifth hive', check: (s) => s.hives.length >= 5, reward: 40000, gems: 8 },
    { text: 'Discover the Nurse Bee', check: disc('nurse'), reward: 60000, gems: 8 },
    { text: 'Discover the Golden Bee', check: disc('golden'), reward: 120000, gems: 10 },
    { text: 'Reach 4.5 stars of reputation', check: (s) => s.rep >= 4.5, reward: 150000, gems: 10 },
    { text: 'Hatch a sparkle bee', check: (s) => Object.keys(s.sparkleSeen).length > 0, reward: 250000, gems: 15 },
    { text: 'Build all six hives', check: (s) => s.hives.length >= 6, reward: 400000, gems: 12 },
    { text: 'Discover the Crystal Bee', check: disc('crystal'), reward: 800000, gems: 15 },
    { text: 'Discover the Starlight Bee', check: disc('star'), reward: 3000000, gems: 25 },
    { text: 'Hold a Honey Festival', check: (s) => s.festivals >= 1, reward: 1000, gems: 30 },
  ];

  // Discovery goals remember their species so the hint can use its clue.
  for (const g of GOALS) if (g.check.sp) g.sp = g.check.sp;

  // The goal you're currently on (or null once they're all done).
  function current(s) {
    return GOALS[s.goal || 0] || null;
  }

  // Claim the current goal if it's complete.
  function claim() {
    const s = HC.game;
    const g = current(s);
    if (!g || !g.check(s)) return { ok: false };
    s.goal = (s.goal || 0) + 1;
    HC.sim.earn(s, g.reward);
    if (g.gems) s.gems += g.gems;
    bus.emit('sfx', 'order');
    bus.emit('goalClaimed', g);
    bus.emit('dirty');
    return { ok: true, msg: 'Goal complete: +₵' + HC.util.fmt(g.reward) + (g.gems ? ' and ' + g.gems + ' 💎' : '') };
  }

  HC.goals = { GOALS, current, claim };
})();
