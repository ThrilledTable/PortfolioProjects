<script>
// =============================================================================
// sprites.js: ALL THE PIXEL ART
// -----------------------------------------------------------------------------
// There are no image files in this game. Every picture is drawn by code,
// either:
//   - from a little text "grid", where each letter stands for a colour (see
//     the character heads below: 'k' is the dark outline, 'h' is hair...), or
//   - by drawing rectangles and circles directly (hives, bees, the machine).
//
// Drawing is fairly slow, so every picture is drawn once into a small hidden
// canvas and remembered ("cached"). After that, the game just copies it.
//
// The same pictures are also turned into image links (data URLs) so the
// menus can show them: the bee portraits in the Apiary, product icons, etc.
// =============================================================================
(function () {
  const HC = window.HC;
  const D = HC.data;
  const cache = new Map();

  const INK = '#2b1d14'; // the dark brown used for every outline

  // Make a blank hidden drawing surface of the given size.
  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // Build a picture once, then reuse it: cached('name', () => draw it).
  function cached(key, build) {
    if (!cache.has(key)) cache.set(key, build());
    return cache.get(key);
  }

  // Draw a text grid: each character maps to a colour in `pal`; '.' is
  // transparent. `flip` mirrors it left-to-right.
  function drawGrid(ctx, rows, pal, ox = 0, oy = 0, flip = false) {
    const w = rows[0].length;
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const col = pal[row[x]];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(ox + (flip ? w - 1 - x : x), oy + y, 1, 1);
      }
    });
  }

  function gridCanvas(rows, pal, flip) {
    const c = canvas(rows[0].length, rows.length);
    drawGrid(c.getContext('2d'), rows, pal, 0, 0, flip);
    return c;
  }

  // Lighten (amt > 0) or darken (amt < 0) a colour. shade('#808080', 0.5)
  // is halfway to white.
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((t - r) * p + r);
    g = Math.round((t - g) * p + g);
    b = Math.round((t - b) * p + b);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  // Blend two colours: mix(a, b, 0.25) is 25% of the way from a to b.
  function mix(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (n, sh) => (n >> sh) & 255;
    const m = (sh) => Math.round(ch(pa, sh) + (ch(pb, sh) - ch(pa, sh)) * k);
    return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
  }

  // ---------------------------------------------------------------------------
  // PEOPLE (16 pixels wide, 20 tall; the top 4 rows are room for hats)
  // Letters: k outline, h/H hair and hair shadow, s/S skin and shadow,
  //          u/U shirt and shadow, e trousers.
  // Heads and bodies are drawn separately so they can be mixed and matched.
  // ---------------------------------------------------------------------------
  const HEAD_FRONT = [
    '................',
    '....kkkkkkkk....',
    '...khhhhhhhhk...',
    '..khhhhhhhhhhk..',
    '..khHhhhhhhHhk..',
    '..kHssssssssHk..',
    '..kssksssskssk..',
    '..kssksssskssk..',
    '...kssssssssk...',
    '....kkSSSSkk....',
  ];
  const HEAD_BACK = [
    '................',
    '....kkkkkkkk....',
    '...khhhhhhhhk...',
    '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..',
    '..kHhhhhhhhhHk..',
    '..kHHhhhhhhHHk..',
    '...kHHHHHHHHk...',
    '....kkSSSSkk....',
  ];
  const HEAD_SIDE = [
    '................',
    '.....kkkkkkk....',
    '....khhhhhhhk...',
    '...khhhhhhhhhk..',
    '...khhhhhhHHhk..',
    '...kssshhhhHHk..',
    '...ksksshhhHHk..',
    '..ksssssshhhk...',
    '...kssssssHk....',
    '....kkSSSkk.....',
  ];
  // Two frames each: standing, and mid-step (legs apart).
  const BODY_FRONT = [
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksuUUUUUUusk..', '...kkeeeeeekk...', '....kek..kek....', '....kk....kk....'],
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksuUUUUUUusk..', '...kkeeeeeekk...', '....kek..kkk....', '....kk..........'],
  ];
  const BODY_BACK = [
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksUUUUUUUUsk..', '...kkeeeeeekk...', '....kek..kek....', '....kk....kk....'],
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksUUUUUUUUsk..', '...kkeeeeeekk...', '....kek..kkk....', '....kk..........'],
  ];
  const BODY_SIDE = [
    ['....kuuuuuk.....', '....kuuuusk.....', '....kUUUUsk.....', '....kkeeekk.....', '....kek.kek.....', '....kk..kk......'],
    ['....kuuuuuk.....', '....kuuuusk.....', '....kUUUUsk.....', '....kkeeek......', '.....keeek......', '.....kkkk.......'],
  ];

  function charPalette(look) {
    return {
      k: INK, h: look.hair[0], H: look.hair[1], s: look.skin[0], S: look.skin[1],
      u: look.shirt[0], U: look.shirt[1], e: '#4a3a5a', w: '#fff8e8',
    };
  }

  // Hats are painted on top of the head. `dir` is which way the person faces.
  function drawHat(ctx, hat, dir) {
    const side = dir === 'left' || dir === 'right';
    const px = (x, y, w, h, c) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, y, w, h);
    };
    if (hat === 'cap') {
      px(4, 5, 8, 2, '#3a6a2a');
      px(3, 5, 1, 2, INK); px(12, 5, 1, 2, INK); px(4, 4, 8, 1, INK);
      if (dir === 'down') px(3, 7, 10, 1, '#2a4a1e');
      if (side) px(1, 7, 5, 1, '#2a4a1e');
    } else if (hat === 'chef') {
      px(4, 0, 8, 6, '#fbf8f0');
      px(3, 1, 1, 4, INK); px(12, 1, 1, 4, INK); px(4, 0, 8, 1, INK);
      px(4, 5, 8, 1, '#d8d0c0');
    } else if (hat === 'tophat') {
      px(5, 0, 6, 5, '#2a2232');
      px(5, 3, 6, 1, '#8a2a3a');
      px(3, 5, 10, 1, '#2a2232');
      px(4, 0, 1, 5, INK); px(11, 0, 1, 5, INK);
    } else if (hat === 'beret') {
      px(3, 4, 9, 2, '#b03a78');
      px(4, 3, 7, 1, '#b03a78');
      px(10, 2, 1, 1, INK);
      px(3, 3, 1, 1, INK); px(12, 4, 1, 1, INK);
    } else if (hat === 'bandana') {
      px(3, 5, 10, 2, '#e8a020');
      px(3, 6, 10, 1, '#b87818');
    } else if (hat === 'straw') {
      px(5, 2, 6, 3, '#e8c870');
      px(5, 4, 6, 1, '#c84a3a'); // ribbon
      px(1, 5, 14, 1, '#d8b058');
      px(1, 6, 14, 1, '#b8903a');
      px(4, 2, 1, 3, INK); px(11, 2, 1, 3, INK); px(5, 1, 6, 1, INK);
    } else if (hat === 'crown') {
      // A ring of flowers
      const cols = ['#f07898', '#ffffff', '#f8d030', '#b890e8', '#f07898'];
      cols.forEach((c, i) => px(3 + i * 2, 4, 2, 2, c));
      px(4, 5, 8, 1, '#4a9a3c');
    }
  }

  // Draw a person. `look` = { hair, skin, shirt, hat, apron }.
  // dir: 'down' | 'up' | 'left' | 'right'; frame: 0-3 of the walk cycle.
  function character(look, dir, frame) {
    const key = ['ch', look.hair, look.skin, look.shirt, look.hat, look.apron, dir, frame].join('|');
    return cached(key, () => {
      const c = canvas(16, 20);
      const ctx = c.getContext('2d');
      const pal = charPalette(look);
      const step = frame === 1 ? 1 : 0; // frames 1 and 3 use the stepping legs
      const flip = frame === 3; // frame 3 is frame 1 mirrored (other foot)
      let head, body, hflip = false;
      if (dir === 'down') { head = HEAD_FRONT; body = BODY_FRONT[step]; }
      else if (dir === 'up') { head = HEAD_BACK; body = BODY_BACK[step]; }
      else { head = HEAD_SIDE; body = BODY_SIDE[frame === 1 || frame === 3 ? 1 : 0]; hflip = dir === 'right'; }
      const rows = head.concat(body);
      const tmp = gridCanvas(rows, pal, hflip !== (flip && (dir === 'down' || dir === 'up')));
      const bob = frame === 1 || frame === 3 ? 1 : 0; // bounce while walking
      ctx.drawImage(tmp, 0, 4 + bob);
      if (look.hat) {
        ctx.save();
        ctx.translate(0, bob);
        if (hflip) {
          ctx.translate(16, 0);
          ctx.scale(-1, 1);
        }
        drawHat(ctx, look.hat, dir);
        ctx.restore();
      }
      if (look.apron && dir !== 'up') {
        ctx.fillStyle = look.apron;
        ctx.fillRect(5, 15 + bob, dir === 'down' ? 6 : 4, 2);
      }
      return c;
    });
  }

  // The shopkeeper's look comes from what you've equipped in the Store.
  function keeperLook(s) {
    const eq = s.cos.equip;
    const item = (cat, fallback) => D.item[eq[cat]] || D.item[fallback];
    return {
      hair: item('hair', 'hair-brown').colors,
      skin: ['#f8c898', '#d89868'],
      shirt: item('shirt', 'shirt-cream').colors,
      hat: item('hat', 'hat-bandana').value,
      apron: item('apron', 'apron-honey').colors[0],
    };
  }

  // ---------------------------------------------------------------------------
  // BEE PORTRAITS (16×16), built from each species' shape and colours.
  // ---------------------------------------------------------------------------
  // Sparkle bees keep their species colours with a rose-gold sheen.
  function sparklePalette(sp) {
    return { body: mix(sp.body, '#ffc8dc', 0.45), stripe: mix(sp.stripe, '#b0306a', 0.35), wing: '#ffe6f2' };
  }

  function beePortrait(spId, sparkle) {
    return cached('bee|' + spId + '|' + !!sparkle, () => {
      const sp = D.species[spId];
      const col = sparkle ? sparklePalette(sp) : { body: sp.body, stripe: sp.stripe, wing: sp.wing };
      const N = 16;
      // Work on a 16×16 grid of colours first, then outline it, then paint it.
      const px = Array.from({ length: N }, () => Array(N).fill(null));
      const set = (x, y, c) => {
        if (x >= 0 && y >= 0 && x < N && y < N) px[y][x] = c;
      };
      const shp = Object.assign({ rx: 4.7, ry: 3.3, wing: 'round', stripes: 'double' }, sp.shape || {});
      // Wings sit behind the body. Each style gives a different silhouette.
      // e() tests "inside an oval", d() "inside a diamond".
      const inWing = (x, y) => {
        const e = (cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
        const d = (cx, cy, a, b) => Math.abs(x - cx) / a + Math.abs(y - cy) / b <= 1;
        switch (shp.wing) {
          case 'small': return e(7.5, 5.5, 2.1, 2.4) || e(10.5, 6, 1.8, 2.1);
          case 'long': return e(9, 4.2, 4.3, 2.1) || e(12, 5.6, 3.2, 1.8);
          case 'moth': return e(7, 4.6, 3.5, 4) || e(11.6, 5.4, 3.1, 3.4);
          case 'angular': return d(7.5, 4, 2.8, 3.8) || d(11.5, 4.8, 2.4, 3.2);
          default: return e(7.5, 4.5, 2.6, 3.3) || e(11, 5, 2.2, 2.8);
        }
      };
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (inWing(x, y)) set(x, y, col.wing);
      const vein = shade(col.wing, -0.18);
      if (shp.wing === 'moth') {
        set(6, 4, col.stripe); set(11, 5, col.stripe); set(7, 3, vein); set(12, 4, vein);
      } else if (shp.wing === 'angular') {
        set(7, 3, '#ffffff'); set(8, 4, vein); set(11, 4, '#ffffff');
      } else {
        set(8, 4, vein); set(11, 5, vein);
      }
      // The striped body ("abdomen"). The pattern depends on the species.
      const bands = {
        double: (x) => x === 8 || x === 9 || x === 12 || x === 13,
        triple: (x) => x === 7 || x === 10 || x === 13,
        single: (x) => x === 10 || x === 11,
        spots: (x, y) => (x + y) % 4 === 0,
      }[shp.stripes];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (((x - (5.1 + shp.rx)) / shp.rx) ** 2 + ((y - 10.2) / shp.ry) ** 2 <= 1) {
          set(x, y, bands(x, y) ? col.stripe : col.body);
        }
      }
      set(7, 11 - Math.round(shp.ry), shade(col.body, 0.5)); set(10, 11 - Math.round(shp.ry), shade(col.body, 0.5)); // shine
      // Head
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (((x - 4) / 2.7) ** 2 + ((y - 10.3) / 2.6) ** 2 <= 1) set(x, y, shade(col.stripe, 0.12));
      }
      set(15, 10, INK); // stinger
      set(7, 14, INK); set(10, 14, INK); // legs
      // Outline: any empty pixel touching a coloured one becomes dark.
      const out = px.map((r) => r.slice());
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (px[y][x]) continue;
        const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => px[y + dy] && px[y + dy][x + dx] && px[y + dy][x + dx] !== INK);
        if (nb) out[y][x] = INK;
      }
      // Eye and antennae on top.
      out[9][3] = '#fffdf4';
      out[10][3] = INK;
      out[9][2] = '#fffdf4';
      out[7][3] = INK; out[6][2] = INK; out[5][2] = INK; out[4][1] = INK;
      out[7][5] = INK; out[6][5] = INK; out[5][6] = INK;
      if (sp.shape && sp.shape.feathery) {
        out[4][0] = INK; out[5][1] = INK; out[4][6] = INK; out[4][7] = INK; out[5][7] = INK;
      }
      const c = canvas(N, N);
      const ctx = c.getContext('2d');
      out.forEach((row, y) => row.forEach((cl, x) => {
        if (!cl) return;
        ctx.fillStyle = cl;
        ctx.fillRect(x, y, 1, 1);
      }));
      drawMark(ctx, sp.mark, col);
      if (sparkle) {
        ctx.fillStyle = '#fff6b0';
        [[1, 1], [14, 2], [13, 14], [0, 13]].forEach(([x, y]) => ctx.fillRect(x, y, 1, 1));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(14, 1, 1, 1);
        ctx.fillRect(1, 0, 1, 1);
      }
      return c;
    });
  }

  // The little species detail: a leaf, crown, moon, star...
  function drawMark(ctx, mark, col) {
    const p = (x, y, c) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, y, 1, 1);
    };
    switch (mark) {
      case 'crown':
        ['#f8d030', '#f8d030', '#f8d030'].forEach((c, i) => p(2 + i * 2, 6, c));
        for (let x = 2; x <= 6; x++) p(x, 7, '#f8d030');
        p(4, 6, '#e84a4a');
        break;
      case 'leaf':
        p(1, 3, '#4c9a3c'); p(2, 3, '#6ac050'); p(1, 2, '#6ac050');
        break;
      case 'drop':
        p(11, 11, '#fff6d8'); p(11, 12, '#fff6d8');
        break;
      case 'flower':
        p(1, 3, '#ffffff'); p(0, 4, '#ffffff'); p(2, 4, '#ffffff'); p(1, 5, '#ffffff'); p(1, 4, '#f8c838');
        break;
      case 'moon':
        p(1, 1, '#fff4c0'); p(2, 1, '#fff4c0'); p(0, 2, '#fff4c0'); p(0, 3, '#fff4c0'); p(1, 4, '#fff4c0'); p(2, 4, '#fff4c0');
        break;
      case 'gem':
        p(11, 11, '#ffffff'); p(10, 10, '#ffffff'); p(12, 12, shade(col.body, 0.6));
        break;
      case 'star':
        p(1, 2, '#fff6a0'); p(0, 3, '#fff6a0'); p(1, 3, '#ffffff'); p(2, 3, '#fff6a0'); p(1, 4, '#fff6a0');
        p(14, 13, '#fff6a0');
        break;
      case 'band':
        for (let y = 8; y <= 12; y++) p(3, y, '#3a5a8a');
        break;
      case 'cross':
        p(11, 9, '#ffffff'); p(10, 10, '#ffffff'); p(11, 10, '#ffffff'); p(12, 10, '#ffffff'); p(11, 11, '#ffffff');
        break;
    }
  }

  // ---------------------------------------------------------------------------
  // PRODUCT ICONS (8×8). Letters: k outline, F fill colour, L lid colour,
  // x/w highlights, o/y candle flame.
  // ---------------------------------------------------------------------------
  const ICONS = {
    jar: ['..kkkk..', '..kLLk..', '.kkkkkk.', 'kxFFFFxk', 'kxFwwFFk', 'kFFwwFFk', 'kFFFFFFk', '.kkkkkk.'],
    candle: ['...o....', '...y....', '..kkk...', '..kFk...', '..kFk...', '..kFk...', '.kkkkk..', '.kLLLk..'],
    pot: ['........', '.kkkkkk.', 'kLLLLLLk', 'kkkkkkkk', 'kFFwFFFk', 'kFFFFFFk', '.kFFFFk.', '..kkkk..'],
    vial: ['...kk...', '...LL...', '..kkkk..', '..kxFk..', '.kxFFFk.', '.kFFFFk.', '.kFFFFk.', '..kkkk..'],
    comb: ['..kkkk..', '.kxxFFk.', 'kxFFkFFk', 'kFFkkkFk', 'kFkFFkFk', 'kFFkkFFk', '.kFFFFk.', '..kkkk..'],
    block: ['........', '..kkkkk.', '.kwwwwLk', 'kwFFFFLk', 'kFFxFFLk', 'kFFFFFLk', 'kLLLLLk.', 'kkkkkk..'],
  };

  function goodIcon(goodId) {
    return cached('good|' + goodId, () => {
      const g = D.good[goodId];
      const pal = { k: INK, F: g.fill, L: g.lid, x: shade(g.fill, 0.55), w: shade(g.fill, 0.7), o: '#f06a20', y: '#ffd850' };
      return gridCanvas(ICONS[g.kind], pal);
    });
  }

  // Other small icons used in menus and the status bar.
  const MISC = {
    coin: ['..kkkk..', '.kywyyk.', 'kywyyyok', 'kyyoyyok', 'kyyoyyok', 'kyyyyyok', '.kyyook.', '..kkkk..'],
    gem: ['..kkkk..', '.kbwbbk.', 'kbwbbbBk', 'kbbbbBBk', '.kbbBBk.', '..kbBk..', '...kk...', '........'],
    star: ['...kk...', '...yk...', 'kkkyykkk', 'kyyyyyok', '.kyyyok.', '.kyokyk.', 'kyok.kok', 'kkk...kk'],
    starEmpty: ['...kk...', '...gk...', 'kkkggkkk', 'kgggggGk', '.kgggGk.', '.kgGkgk.', 'kgGk.kGk', 'kkk...kk'],
    heart: ['........', '.kk.kk..', 'kppkppk.', 'kpwppp k', 'kppppp k', '.kpppk..', '..kpk...', '...k....'],
    sun: ['...y....', '.y.y.y..', '..yyy...', 'yyyyyyy.', '..yyy...', '.y.y.y..', '...y....', '........'],
    moon: ['..kkk...', '.kmmk...', 'kmmk....', 'kmmk....', 'kmmk....', 'kmmmk...', '.kmmmkk.', '..kkk...'],
    egg: ['..kkk...', '.kwwwk..', 'kwwwwwk.', 'kwpwwwk.', 'kwwwpwk.', 'kwwwwwk.', '.kwwwk..', '..kkk...'],
    ribbon: ['.kkkkk..', 'krrrrrk.', 'krryrrk.', 'krrrrrk.', '.krrrk..', '.krkrk..', 'krk.krk.', 'kk...kk.'],
    hammer: ['.kkkk...', 'kggggk..', 'kggggk..', '.kkbk...', '...kbk..', '....kbk.', '.....kbk', '......k.'],
    note: ['kkkkkk..', 'kwwwwk..', 'kwkkwk..', 'kwwwwk..', 'kwkkwk..', 'kwwwwk..', 'kkkkkk..', '........'],
  };
  const MISC_PAL = { k: INK, y: '#f8c838', o: '#d8861e', w: '#fff4c0', g: '#d8c8a8', G: '#b8a888', p: '#e8506a', m: '#e8e0ff', r: '#d84a4a', b: '#6ad0f0', B: '#3a90c0' };

  function misc(name) {
    return cached('misc|' + name, () => gridCanvas(MISC[name].map((r) => r.replace(/ /g, '.')), MISC_PAL));
  }

  // ---------------------------------------------------------------------------
  // HIVES. They grow as you upgrade them:
  //   level 1: one box        level 2: two boxes
  //   level 3: two boxes + peaked roof
  //   level 4: three boxes + roof       level 5: + flower box
  //   level 6: + a little gold flag on top
  // The hive style from the Store changes the colours (and the Straw Skep
  // is a dome that gets taller instead of stacked boxes).
  // The picture is 18 wide × 32 tall; its bottom edge sits on the hive spot.
  // ---------------------------------------------------------------------------
  const HIVE_W = 18, HIVE_H = 32;
  const STYLES = {
    'hive-classic': { a: '#e8c888', b: '#c89858', roof: ['#c8642a', '#d8902a', '#b84a5a', '#8a5ab8', '#3a8a8a', '#e8b830'], legs: '#7a4a22' },
    'hive-painted': { a: '#f6f2e6', b: '#8ab8e0', roof: ['#3a6aa8', '#3a6aa8', '#2a5a98', '#2a5a98', '#c84a5a', '#c84a5a'], legs: '#5a6a7a' },
    'hive-royal': { a: '#fff0c8', b: '#e0b848', roof: ['#6a3a9a', '#6a3a9a', '#5a2a8a', '#5a2a8a', '#4a1a7a', '#4a1a7a'], legs: '#8a6a2a', trim: '#ffd23a' },
  };

  function hive(level, style = 'hive-classic') {
    return cached('hive|' + level + '|' + style, () => {
      const c = canvas(HIVE_W, HIVE_H);
      const g = c.getContext('2d');
      const r = (x, y, w, h, col) => {
        g.fillStyle = col;
        g.fillRect(x, y, w, h);
      };
      const bottom = HIVE_H;
      if (style === 'hive-skep') {
        // A woven straw dome: taller with each level.
        const rings = 3 + level;
        const top = bottom - 3 - rings * 3;
        for (let k = 0; k < rings; k++) {
          const y = bottom - 3 - (k + 1) * 3;
          const half = Math.round(8 - Math.max(0, k - rings + 3) * 2);
          r(9 - half - 1, y, half * 2 + 2, 3, INK);
          r(9 - half, y + 1, half * 2, 2, k % 2 ? '#e8c060' : '#d0a040');
        }
        r(6, top - 2, 6, 2, INK);
        r(7, top - 1, 4, 1, '#d0a040');
        r(2, bottom - 3, 14, 3, INK); // base
        r(3, bottom - 3, 12, 2, '#8a6a3a');
        r(7, bottom - 6, 4, 3, '#3a2a1a'); // doorway
        if (level >= 5) {
          r(8, top - 7, 1, 5, INK);
          r(9, top - 7, 4, 3, '#ffd23a');
        }
        return c;
      }
      const st = STYLES[style] || STYLES['hive-classic'];
      const boxes = [1, 2, 2, 3, 3, 3][level] || 1;
      // legs
      r(3, bottom - 3, 3, 3, INK); r(4, bottom - 3, 1, 2, st.legs);
      r(12, bottom - 3, 3, 3, INK); r(13, bottom - 3, 1, 2, st.legs);
      // boxes, stacked upward
      let y = bottom - 3;
      for (let k = 0; k < boxes; k++) {
        y -= 6;
        r(1, y, 16, 7, INK);
        r(2, y + 1, 14, 2, st.a);
        r(2, y + 3, 14, 1, st.b);
        r(2, y + 4, 14, 2, st.a);
        if (st.trim) r(2, y + 1, 14, 1, st.trim);
        if (k === 0) r(7, y + 4, 4, 2, INK); // entrance slit on the bottom box
      }
      // roof: a flat lid at first, a peaked roof from level 3
      const roof = st.roof[Math.min(level, st.roof.length - 1)];
      if (level < 2) {
        r(0, y - 2, 18, 3, INK);
        r(1, y - 1, 16, 1, roof);
        y -= 2;
      } else {
        r(0, y - 2, 18, 3, INK);
        r(1, y - 1, 16, 1, shade(roof, -0.2));
        r(2, y - 4, 14, 2, INK);
        r(3, y - 3, 12, 1, roof);
        r(5, y - 5, 8, 1, INK);
        y -= 5;
      }
      // level 5+: a little window box of flowers on the front
      if (level >= 4) {
        const fy = bottom - 3 - 6 * boxes + 3;
        r(1, fy + 5, 16, 2, INK);
        ['#f07898', '#ffffff', '#f8d030', '#b890e8', '#f07898'].forEach((col, i) => r(2 + i * 3, fy + 4, 2, 1, col));
      }
      // level 6: a gold pennant on top
      if (level >= 5) {
        r(8, y - 6, 1, 6, INK);
        r(9, y - 6, 4, 3, '#ffd23a');
        r(9, y - 6, 4, 1, INK);
      }
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // TINY 3×5 FONT for numbers drawn inside the game picture (+45, !, ...).
  // Each character is 15 on/off pixels, read left-to-right, top-to-bottom.
  // ---------------------------------------------------------------------------
  const GLYPHS = {
    0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111',
    4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001010010010',
    8: '111101111101111', 9: '111101111001111', '+': '000010111010000', '-': '000000111000000',
    '.': '000000000000010', K: '101101110101101', M: '101111111101101', B: '110101110101110',
    T: '111010010010010', '!': '010010010000010', '?': '111001010000010', ' ': '000000000000000',
    Z: '111001010100111', z: '000111001010111', '/': '001001010100100',
  };

  // Write `str` centred at (x, y) with a dark outline so it reads on any background.
  function drawText(ctx, str, x, y, color = '#fff8e0', outline = INK) {
    const width = str.length * 4 - 1;
    const ox = Math.round(x - width / 2);
    const oy = Math.round(y);
    const pass = (c, dx, dy) => {
      ctx.fillStyle = c;
      for (let i = 0; i < str.length; i++) {
        const g = GLYPHS[str[i]];
        if (!g) continue;
        for (let p = 0; p < 15; p++) {
          if (g[p] === '1') ctx.fillRect(ox + i * 4 + (p % 3) + dx, oy + Math.floor(p / 3) + dy, 1, 1);
        }
      }
    };
    if (outline) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) pass(outline, dx, dy);
    pass(color, 0, 0);
  }

  // Turn any of the pictures above into an image link the menus can use.
  const urlCache = new Map();
  function url(key, make) {
    if (!urlCache.has(key)) urlCache.set(key, make().toDataURL());
    return urlCache.get(key);
  }

  HC.spr = {
    INK, canvas, shade, mix, character, keeperLook, beePortrait, goodIcon, misc, hive, drawText, drawGrid, gridCanvas,
    HIVE_W, HIVE_H,
    beeURL: (sp, sparkle) => url('b' + sp + sparkle, () => beePortrait(sp, sparkle)),
    goodURL: (g) => url('g' + g, () => goodIcon(g)),
    miscURL: (n) => url('m' + n, () => misc(n)),
    hiveURL: (lv, style) => url('h' + lv + style, () => hive(lv, style)),
    // A big front-facing picture of a person, for the Store's wardrobe preview.
    personURL: (look) => url('p' + JSON.stringify(look), () => character(look, 'down', 0)),
    sparklePalette,
  };
})();

</script>
<script>
// =============================================================================
// render.js: DRAWING THE GAME PICTURE
// -----------------------------------------------------------------------------
// About 60 times a second, `draw(s, t)` paints the whole scene onto a
// 240×160 canvas, and the web page stretches it up with crisp square pixels.
// `t` is a running clock in seconds, used for animation (bees flapping,
// flowers swaying...).
//
// Drawing happens in layers, back to front:
//   1. the background (grass, walls, floor, street), drawn once and reused
//   2. flower beds, flowers, garden decorations, hives
//   3. shelves, crates, the Candle Machine, the request board
//   4. people and furniture, sorted so whoever is lower on screen is drawn
//      on top ("y-sorting"), which makes people walk behind the counter
//      and in front of the shelves naturally
//   5. flying bees, weather, night-time darkness and lamp glow
//   6. golden drips and floating "+45" numbers (kept bright at night)
//
// At the bottom, `hitTest` works out what you tapped on the picture.
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data: D, spr, layout: L } = HC;
  const INK = spr.INK;
  const f = () => HC.sim.f;

  let ctx, flowers;
  const staticLayers = {}; // background pictures, one per season/wallpaper/floor combo
  const MERCHANT_LOOK = { hair: ['#d8d0c8', '#a8a098'], skin: ['#e0a878', '#b87c50'], shirt: ['#6a4a9a', '#4a3070'], hat: 'tophat' };
  const FLOWER_COLS = ['#f07898', '#ffffff', '#b890e8', '#f8d030', '#f06a4a', '#80c8f0'];
  const AUTUMN_COLS = ['#e8702a', '#d84a2a', '#f0a830', '#b85a2a'];

  // Flower Beds: each upgrade level plants one more bed at these spots
  // (x, y of the bed's top-left corner). They avoid the hives and the path.
  const BED_SPOTS = [[20, 44], [58, 44], [20, 92], [58, 92], [1, 4], [1, 52], [1, 100], [84, 124]];

  function init(canvasEl) {
    ctx = canvasEl.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    flowers = buildFlowers();
  }

  // A tiny helper: fill a rectangle with a colour.
  const rect = (g, x, y, w, h, col) => {
    g.fillStyle = col;
    g.fillRect(x, y, w, h);
  };

  // ---------------------------------------------------------------------------
  // 1. BACKGROUND (rebuilt only when the season, wallpaper or floor changes)
  // ---------------------------------------------------------------------------
  function staticFor(s) {
    const season = f().season(s);
    const wall = s.cos.equip.wall || 'wall-planks';
    const floor = s.cos.equip.floor || 'floor-checker';
    const key = season.id + '|' + wall + '|' + floor;
    if (!staticLayers[key]) staticLayers[key] = buildStatic(season, wall, floor);
    return staticLayers[key];
  }

  function buildStatic(season, wall, floor) {
    const [grass, grassDark, grassLight, tuft] = season.grass;
    const winter = season.id === 'winter';
    const c = spr.canvas(L.W, L.H);
    const g = c.getContext('2d');
    const rnd = util.seeded(7); // same speckles every time
    const r = (x, y, w, h, col) => rect(g, x, y, w, h, col);

    // Garden grass with speckles and tufts
    r(0, 0, 112, 144, grass);
    for (let i = 0; i < 520; i++) r(Math.floor(rnd() * 112), Math.floor(rnd() * 144), 1, 1, rnd() < 0.5 ? grassDark : grassLight);
    for (let i = 0; i < 40; i++) {
      const x = Math.floor(rnd() * 104) + 2, y = Math.floor(rnd() * 136) + 4;
      r(x, y, 1, 2, tuft); r(x + 2, y, 1, 2, tuft); r(x + 1, y + 1, 1, 1, tuft);
    }
    if (season.id === 'autumn') {
      for (let i = 0; i < 90; i++) r(Math.floor(rnd() * 100), Math.floor(rnd() * 140), 2, 1, ['#d8702a', '#c84a2a', '#e8a030'][i % 3]);
    }
    // The garden path the shopkeeper walks to reach the hives
    const path = winter ? '#dfe4ec' : '#c8b07a';
    r(45, 34, 7, 118, path);
    for (const y of [34, 82, 130]) r(20, y, 56, 5, path);
    // Worn patches under each hive
    for (const [cx, cy] of L.hiveSlots) r(cx * 16 - 1, cy * 16 + 11, 18, 6, season.pad);
    // Picket fence between garden and shop
    for (let y = 2; y < 140; y += 4) {
      r(102, y, 3, 3, '#f4ecd8');
      r(102, y + 3, 3, 1, '#c8b898');
    }
    r(101, 4, 1, 136, '#b8a888');
    if (winter) for (let y = 2; y < 140; y += 4) r(102, y - 1, 3, 1, '#ffffff');
    // Street lamp
    r(106, 116, 2, 26, '#3a3040');
    r(104, 112, 6, 5, '#3a3040');
    r(105, 113, 4, 3, '#ffe08a');
    // Street
    r(0, 144, 240, 16, '#d8b878');
    r(0, 144, 240, 1, '#b89858');
    for (let i = 0; i < 90; i++) r(Math.floor(rnd() * 240), 146 + Math.floor(rnd() * 13), 2, 1, rnd() < 0.5 ? '#c4a466' : '#e6caa0');
    if (winter) for (let i = 0; i < 26; i++) r(Math.floor(rnd() * 236), rnd() < 0.5 ? 145 : 157, 4 + Math.floor(rnd() * 6), 2, '#f4f8fc');

    // Shop floor (style from the Store)
    for (let y = 16; y < 128; y += 8) {
      for (let x = 112; x < 240; x += 8) {
        const odd = ((x + y) / 8) % 2;
        if (floor === 'floor-wood') {
          r(x, y, 8, 8, (y / 8) % 2 ? '#c8945a' : '#bc8850');
          r(x, y + 7, 8, 1, '#a0703e');
          if ((x / 8 + (y / 8) * 3) % 5 === 0) r(x + 3, y, 1, 7, '#a0703e');
        } else if (floor === 'floor-tiles') {
          r(x, y, 8, 8, odd ? '#cfe4f0' : '#f4f8fb');
          r(x, y, 8, 1, '#b0c8d8'); r(x, y, 1, 8, '#b0c8d8');
        } else r(x, y, 8, 8, odd ? '#f2dfb4' : '#e6cc98');
      }
    }
    // Back wall (style from the Store)
    if (wall === 'wall-honeycomb') {
      r(112, 0, 128, 16, '#f2c050');
      for (let y = 2; y < 16; y += 4) for (let x = 112 + ((y / 4) % 2) * 3; x < 240; x += 6) r(x, y, 3, 2, '#e0a838');
    } else if (wall === 'wall-stripes') {
      r(112, 0, 128, 16, '#e4f4e8');
      for (let x = 112; x < 240; x += 6) r(x, 0, 3, 16, '#a8dcc0');
    } else if (wall === 'wall-rose') {
      r(112, 0, 128, 16, '#f4d4dc');
      for (let y = 3; y < 16; y += 5) for (let x = 114 + (y % 2) * 4; x < 240; x += 8) { r(x, y, 2, 2, '#d890a4'); r(x + 1, y - 1, 1, 1, '#d890a4'); }
    } else {
      r(112, 0, 128, 16, '#b86a32');
      for (let x = 112; x < 240; x += 6) r(x, 2, 1, 14, '#9a5626');
    }
    r(112, 0, 128, 2, '#6a3418');
    r(112, 15, 128, 1, '#7a3e1a');
    // Side walls
    r(112, 0, 3, 144, '#7a3e1a');
    r(237, 0, 3, 144, '#7a3e1a');
    // Front wall with the doorway
    r(112, 128, 128, 16, '#a85a2a');
    for (let x = 112; x < 240; x += 8) r(x, 128, 1, 16, '#8a4420');
    r(112, 128, 128, 2, winter ? '#f4f8fc' : '#6a3418');
    r(144, 128, 16, 16, '#6a3418');
    r(145, 130, 14, 14, '#d84a3a'); // doormat seen through the door
    r(147, 132, 10, 10, '#e8704a');
    for (const wx of [120, 212]) { // windows
      r(wx, 131, 16, 9, '#4a2a18');
      r(wx + 1, 132, 14, 7, '#a8d8e8');
      r(wx + 2, 133, 4, 2, '#e0f4fa');
      r(wx + 7, 132, 1, 7, '#4a2a18');
    }
    // The counter (its front edge is redrawn later over anyone behind it)
    drawCounter(g);
    // Wall clock
    r(226, 4, 7, 7, INK);
    r(227, 5, 5, 5, '#fff4d8');
    r(229, 6, 1, 2, INK);
    r(229, 7, 2, 1, INK);
    return c;
  }

  function drawCounter(g) {
    const c = L.counter;
    rect(g, c.x, c.y + 2, c.w, 14, '#8a5a2a');
    rect(g, c.x, c.y, c.w, 5, '#c88a4a');
    rect(g, c.x, c.y, c.w, 1, '#e8b070');
    rect(g, c.x, c.y + 15, c.w, 1, INK);
    for (let x = c.x + 4; x < c.x + c.w; x += 10) rect(g, x, c.y + 6, 6, 7, '#7a4a22');
  }

  // Scattered wild flowers (positions fixed forever; more appear with upgrades).
  function buildFlowers() {
    const rnd = util.seeded(42);
    const out = [];
    const blocked = (x, y) => {
      if (x > 96) return true;
      if (x > 42 && x < 54) return true; // the path
      for (const [cx, cy] of L.hiveSlots) {
        if (x > cx * 16 - 4 && x < cx * 16 + 20 && y > cy * 16 - 14 && y < cy * 16 + 24) return true;
      }
      return false;
    };
    let tries = 0;
    while (out.length < 110 && tries < 6000) {
      tries++;
      const x = 3 + Math.floor(rnd() * 92), y = 4 + Math.floor(rnd() * 134);
      if (blocked(x, y)) continue;
      if (out.some((fl) => Math.abs(fl.x - x) < 5 && Math.abs(fl.y - y) < 5)) continue;
      out.push({ x, y, col: FLOWER_COLS[Math.floor(rnd() * FLOWER_COLS.length)], ph: rnd() * 6 });
    }
    return out;
  }
  function visibleFlowers(s) {
    const se = f().season(s);
    let n = 14 + 3 * s.up.flowers + (se.id === 'spring' ? 10 : 0);
    if (se.id === 'winter') n = Math.min(n, 6 + s.up.flowers); // a few hardy winter blooms
    return flowers.slice(0, Math.min(flowers.length, n));
  }

  // ---------------------------------------------------------------------------
  // 2. GARDEN
  // ---------------------------------------------------------------------------
  function drawFlowerBeds(s, t) {
    const beds = Math.min(BED_SPOTS.length, s.up.flowers);
    const se = f().season(s).id;
    for (let i = 0; i < beds; i++) {
      const [x, y] = BED_SPOTS[i];
      rect(ctx, x, y, 14, 7, INK); // wooden edging
      rect(ctx, x + 1, y + 1, 12, 5, se === 'winter' ? '#e8eef4' : '#7a5230'); // soil
      if (se === 'winter') continue;
      for (let k = 0; k < 4; k++) {
        const col = se === 'autumn' ? AUTUMN_COLS[(i + k) % 4] : FLOWER_COLS[(i * 3 + k) % FLOWER_COLS.length];
        const fx = x + 2 + k * 3, sway = Math.sin(t * 1.5 + i + k) > 0.7 ? 1 : 0;
        rect(ctx, fx + 1, y + 1, 1, 3, '#3e8a34');
        rect(ctx, fx + sway, y, 3, 1, col);
        rect(ctx, fx + 1 + sway, y - 1, 1, 3, col);
        rect(ctx, fx + 1 + sway, y, 1, 1, '#f8d030');
      }
    }
  }

  function drawFlowers(s, t) {
    const autumn = f().season(s).id === 'autumn';
    for (const fl of visibleFlowers(s)) {
      const sway = Math.sin(t * 1.6 + fl.ph) > 0.6 ? 1 : 0;
      rect(ctx, fl.x, fl.y + 1, 1, 3, '#3e8a34');
      const x = fl.x + sway, y = fl.y;
      ctx.fillStyle = autumn ? AUTUMN_COLS[Math.floor(fl.ph * 10) % 4] : fl.col;
      ctx.fillRect(x - 1, y, 3, 1);
      ctx.fillRect(x, y - 1, 1, 3);
      rect(ctx, x, y, 1, 1, fl.col === '#f8d030' ? '#e86a20' : '#f8d030');
    }
  }

  // Garden decorations that sit flat (the pond); the upright ones (gnome,
  // fountain, bench, lanterns) are added as y-sorted props so people walk
  // in front of / behind them correctly.
  function drawGardenFlat(s, t) {
    if (s.cos.placed['deco-pond']) {
      rect(ctx, 82, 48, 18, 12, INK);
      rect(ctx, 83, 49, 16, 10, '#4aa0c8');
      rect(ctx, 85, 50, 6, 2, '#8ad0f0');
      rect(ctx, 91, 54, 4, 3, '#4a9a3c'); // lily pad
      rect(ctx, 92, 54, 1, 1, '#f8b8d0');
      if (Math.floor(t * 1.5) % 3 === 0) rect(ctx, 87, 56, 1, 1, '#c8ecf8'); // ripple
    }
  }

  // Flat shop decorations people walk over (the rug by the door).
  function drawShopFlat(s) {
    if (s.cos.placed['deco-rug']) drawRug();
  }
  function drawRug() {
    rect(ctx, 140, 118, 24, 9, '#b8483a');
    rect(ctx, 142, 119, 20, 7, '#d86a4a');
    rect(ctx, 144, 121, 16, 3, '#f2b230');
  }

  function drawHives(s, t) {
    const winterNow = f().season(s).id === 'winter';
    const style = s.cos.equip.hiveStyle || 'hive-classic';
    L.hiveSlots.forEach(([cx, cy], i) => {
      const x = cx * 16, y = cy * 16;
      const h = s.hives[i];
      const build = HC.builds.find(s, 'hive', i);
      if (h) {
        const img = spr.hive(h.level, style);
        const top = y + 17 - spr.HIVE_H;
        ctx.drawImage(img, x - 1, top);
        if (winterNow) rect(ctx, x + 1, top + findRoofTop(h.level, style), 14, 1, '#f8fbff'); // snow on the roof
        // Honey meter under the hive: how full it is.
        const fill = f().honeyIn(h) / f().honeyCap(h);
        rect(ctx, x + 1, y + 18, 14, 3, INK);
        rect(ctx, x + 2, y + 19, Math.round(12 * fill), 1, fill >= 1 ? '#ff9a2a' : '#f8c838');
        if (fill >= 1 && Math.floor(t * 2) % 2 === 0) spr.drawText(ctx, '!', x + 8, top - 6, '#ff9a2a');
        // Upgrade under way: hammer + progress bar
        const up = HC.builds.find(s, 'hiveUp', i);
        if (up) drawBuildBar(s, up, x + 1, top - 4, 14);
      } else if (build) {
        drawScaffold(s, build, x, y, t);
      } else if (i === s.hives.length) {
        // Next free spot: a dashed outline that pulses when you can afford it.
        const can = s.coins >= f().hiveCost(s) && HC.builds.freeBuilder(s);
        const on = !can || Math.floor(t * 2) % 2 === 0;
        ctx.fillStyle = can ? '#fff4c0' : 'rgba(43,29,20,0.45)';
        if (on) {
          for (let k = 0; k < 16; k += 3) {
            ctx.fillRect(x + k, y + 2, 2, 1);
            ctx.fillRect(x + k, y + 15, 2, 1);
            ctx.fillRect(x, y + 2 + k * 0.8, 1, 2);
            ctx.fillRect(x + 15, y + 2 + k * 0.8, 1, 2);
          }
          ctx.fillRect(x + 7, y + 6, 2, 6);
          ctx.fillRect(x + 5, y + 8, 6, 2);
        }
      }
    });
  }
  // Roughly where the top of the roof is in a hive picture (for snow).
  function findRoofTop(level, style) {
    if (style === 'hive-skep') return spr.HIVE_H - 3 - (3 + level) * 3 - 1;
    const boxes = [1, 2, 2, 3, 3, 3][level] || 1;
    return spr.HIVE_H - 3 - 6 * boxes - (level < 2 ? 2 : 5);
  }

  // A thin progress bar with a hammer, for anything under construction.
  function drawBuildBar(s, b, x, y, w) {
    const k = 1 - HC.builds.left(s, b) / b.dur;
    rect(ctx, x, y, w, 3, INK);
    rect(ctx, x + 1, y + 1, Math.round((w - 2) * k), 1, '#8cd06a');
    ctx.drawImage(spr.misc('hammer'), x + w - 3, y - 8);
  }
  // Wooden scaffolding where a new hive is being built.
  function drawScaffold(s, b, x, y, t) {
    rect(ctx, x + 1, y + 2, 1, 15, '#8a5a2a');
    rect(ctx, x + 14, y + 2, 1, 15, '#8a5a2a');
    rect(ctx, x, y + 4, 16, 1, '#a86a32');
    rect(ctx, x, y + 11, 16, 1, '#a86a32');
    rect(ctx, x + 3, y + 12, 10, 5, '#e8c888'); // the first box, half built
    rect(ctx, x + 3, y + 12, 10, 1, INK);
    drawBuildBar(s, b, x + 1, y - 4, 14);
  }

  // Bees flying between their hive and the flowers. Each bee follows its own
  // steady loop worked out from its id, so no position needs saving.
  function drawBees(s, t) {
    const fl = visibleFlowers(s);
    if (!fl.length) return;
    const busy = f().busyBees(s);
    s.hives.forEach((h, hi) => {
      const [cx, cy] = L.hiveSlots[hi];
      const hx = cx * 16 + 8, hy = cy * 16 + 11;
      const full = f().hiveFull(h);
      h.bees.slice(0, 8).forEach((id) => {
        const bee = s.bees[id];
        if (!bee || busy.has(id)) return; // resting in the nursery
        const seed = util.hash(id);
        let x, y;
        if (full) {
          // Full hive: bees idle in a lazy circle around it.
          x = hx + Math.cos(t * 1.2 + seed) * 9;
          y = hy - 6 + Math.sin(t * 1.7 + seed) * 4;
        } else {
          const period = 5 + (seed % 300) / 100;
          const off = (seed % 1000) / 100;
          const trip = Math.floor((t + off) / period);
          const u = ((t + off) % period) / period;
          const fw = fl[util.hash(id + trip) % fl.length];
          if (u < 0.4) {
            const k = u / 0.4;
            x = util.lerp(hx, fw.x, k);
            y = util.lerp(hy, fw.y - 2, k) - Math.sin(Math.PI * k) * 10;
          } else if (u < 0.6) {
            x = fw.x + Math.sin(t * 9 + seed) * 1.5;
            y = fw.y - 3 + Math.cos(t * 7 + seed) * 1;
          } else {
            const k = (u - 0.6) / 0.4;
            x = util.lerp(fw.x, hx, k);
            y = util.lerp(fw.y - 2, hy, k) - Math.sin(Math.PI * k) * 8;
          }
        }
        x = Math.round(x);
        y = Math.round(y);
        const sp = D.species[bee.sp];
        const col = bee.sparkle ? spr.sparklePalette(sp) : sp;
        const flap = Math.floor(t * 14 + seed) % 2;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(x - 1, y - 2 + flap, 1, 1);
        ctx.fillRect(x + 1, y - 2 + flap, 1, 1);
        rect(ctx, x - 1, y - 1, 4, 2, col.body);
        rect(ctx, x + 1, y - 1, 1, 2, col.stripe);
        rect(ctx, x - 2, y - 1, 1, 2, INK);
        if (bee.sparkle && Math.floor(t * 4 + seed) % 3 === 0) rect(ctx, x + 2, y - 3, 1, 1, '#fff6b0');
      });
    });
  }

  // ---------------------------------------------------------------------------
  // 3. SHOP FIXTURES
  // ---------------------------------------------------------------------------
  function drawShelves(s, t) {
    const cap = f().shelfCap(s);
    for (let i = 0; i < 8; i++) {
      const x = 112 + i * 16, y = 8;
      const sh = s.shelves[i];
      if (!sh) {
        // Not bought yet: a framed honeycomb picture hangs there instead.
        if (i % 2 === 0) {
          rect(ctx, x + 4, 4, 8, 8, '#6a3418');
          rect(ctx, x + 5, 5, 6, 6, '#f2c050');
          rect(ctx, x + 6, 6, 2, 2, '#d8962a');
          rect(ctx, x + 9, 8, 1, 2, '#d8962a');
        }
        continue;
      }
      rect(ctx, x + 1, y, 14, 23, INK);
      rect(ctx, x + 2, y + 1, 12, 21, '#9a5a2a');
      rect(ctx, x + 3, y + 2, 10, 8, '#6a3a1a');
      rect(ctx, x + 3, y + 12, 10, 8, '#6a3a1a');
      rect(ctx, x + 2, y + 10, 12, 2, '#c88a4a');
      rect(ctx, x + 2, y + 20, 12, 2, '#c88a4a');
      if (sh.good) {
        const g = D.good[sh.good];
        const n = Math.ceil((sh.qty / cap) * 6); // jars shown = how full it is
        for (let k = 0; k < n; k++) {
          const row = k < 3 ? 1 : 0;
          const jx = x + 3 + (k % 3) * 3 + (row ? 0 : 1);
          const jy = y + (row ? 14 : 4);
          rect(ctx, jx, jy, 3, 6, INK);
          rect(ctx, jx, jy + 2, 3, 4, g.fill);
          rect(ctx, jx, jy + 1, 3, 1, g.lid);
        }
        rect(ctx, x + 6, y + 21, 4, 2, g.fill); // price tag
        // Empty shelf: a flashing "!" (red if the storehouse is out too).
        if (sh.qty === 0 && Math.floor(t * 2) % 2 === 0) spr.drawText(ctx, '!', x + 8, y - 6, s.store[sh.good] > 0 ? '#fff08a' : '#ff6a4a');
      }
    }
    // String Lights along the top of the wall
    if (s.cos.placed['deco-lights']) {
      const night = lightLevels(s).night;
      for (let x = 114; x < 238; x += 6) {
        const sag = Math.round(Math.sin(((x - 114) / 124) * Math.PI * 4) * 1.5) + 3;
        rect(ctx, x, sag, 6, 1, '#4a3a2a');
        const on = night > 0.3 || Math.floor(t * 2 + x) % 5 !== 0;
        rect(ctx, x + 2, sag + 1, 2, 2, on ? ['#ffd23a', '#f07898', '#8ad0f0', '#8cd06a'][(x / 6) % 4 | 0] : '#8a7a6a');
      }
    }
  }

  // The storeroom crates. Jars peek out the top the fuller the storehouse is.
  function drawCrates(s) {
    const c = L.crates;
    const cap = f().storageCap(s);
    let fill = 0, kinds = 0;
    for (const g in s.store) if (s.store[g] > 0) { fill += s.store[g] / cap; kinds++; }
    fill = kinds ? fill / Math.max(kinds, 1) : 0;
    const crate = (x, y) => {
      rect(ctx, x, y, 12, 10, INK);
      rect(ctx, x + 1, y + 1, 10, 8, '#c8904a');
      rect(ctx, x + 1, y + 4, 10, 1, '#9a6a32');
      rect(ctx, x + 5, y + 1, 1, 8, '#9a6a32');
    };
    crate(c.x, c.y + 12);
    crate(c.x + 13, c.y + 12);
    crate(c.x + 6, c.y + 3);
    // Jars in the top crate, more when fuller
    const goods = Object.keys(s.store).filter((g) => s.store[g] > 0);
    const jars = Math.min(4, Math.ceil(fill * 4));
    for (let k = 0; k < jars; k++) {
      const g = D.good[goods[k % goods.length]];
      rect(ctx, c.x + 7 + k * 2.5, c.y, 2, 4, INK);
      rect(ctx, c.x + 7 + k * 2.5, c.y + 1, 2, 3, g.fill);
    }
  }

  // The Candle Machine (or its scaffolding while being built).
  function drawMachine(s, t) {
    const m = L.machine;
    const b = HC.builds.find(s, 'machine', 0);
    if (!s.machine) {
      if (b) {
        rect(ctx, m.x + 2, m.y + 4, 1, 16, '#8a5a2a');
        rect(ctx, m.x + 26, m.y + 4, 1, 16, '#8a5a2a');
        rect(ctx, m.x, m.y + 8, 30, 1, '#a86a32');
        rect(ctx, m.x + 6, m.y + 12, 18, 8, '#8a8a9a');
        drawBuildBar(s, b, m.x + 4, m.y, 22);
      }
      return;
    }
    const mc = s.machine;
    const working = mc.wax > 0 && mc.candles < f().machineCap(s);
    // body
    rect(ctx, m.x, m.y + 4, m.w, 16, INK);
    rect(ctx, m.x + 1, m.y + 5, m.w - 2, 14, '#9a8a7a');
    rect(ctx, m.x + 1, m.y + 5, m.w - 2, 2, '#b8a898');
    // wax hopper on the left
    rect(ctx, m.x + 2, m.y, 9, 6, INK);
    rect(ctx, m.x + 3, m.y + 1, 7, 4, '#6a5a4a');
    const waxH = Math.round(4 * Math.min(1, mc.wax / f().machineCap(s)));
    if (waxH) rect(ctx, m.x + 3, m.y + 5 - waxH, 7, waxH, D.good.wax.fill);
    // smoke puffs while working
    if (working) {
      const k = (t * 1.5) % 1;
      ctx.globalAlpha = 1 - k;
      rect(ctx, m.x + 22, m.y - 2 - Math.round(k * 6), 3, 2, '#e8e0d8');
      ctx.globalAlpha = 1;
    }
    // output tray: candles lined up
    rect(ctx, m.x + 13, m.y + 9, 15, 7, '#4a3a2a');
    const n = Math.min(6, Math.ceil((mc.candles / f().machineCap(s)) * 6));
    for (let k = 0; k < n; k++) {
      rect(ctx, m.x + 14 + k * 2, m.y + 11, 1, 5, '#f6e6b2');
      rect(ctx, m.x + 14 + k * 2, m.y + 10, 1, 1, '#f06a20');
    }
    // light: green = working, amber = needs wax, flashing = full of candles
    const full = mc.candles >= f().machineCap(s);
    rect(ctx, m.x + 4, m.y + 12, 3, 3, full ? (Math.floor(t * 3) % 2 ? '#ff6a4a' : '#6a2a2a') : working ? '#8cf06a' : '#f0b030');
    const up = HC.builds.find(s, 'machineUp', 0);
    if (up) drawBuildBar(s, up, m.x + 4, m.y - 4, 22);
  }

  // The request board outside, with a note for each pinned request.
  function drawBoard(s) {
    const b = L.board;
    rect(ctx, b.x - 9, b.y - 12, 18, 11, INK);
    rect(ctx, b.x - 8, b.y - 11, 16, 9, '#c8904a');
    rect(ctx, b.x - 7, b.y - 1, 1, 5, INK);
    rect(ctx, b.x + 6, b.y - 1, 1, 5, INK);
    s.orders.slice(0, 3).forEach((o, k) => {
      rect(ctx, b.x - 7 + k * 5, b.y - 10, 4, 5, '#fff8e0');
      rect(ctx, b.x - 6 + k * 5, b.y - 9, 2, 1, INK);
      rect(ctx, b.x - 6 + k * 5, b.y - 7, 2, 1, D.good[o.good].fill);
    });
  }

  // "CLOSED" sign hanging in the door at night, or the painted bee sign.
  function drawShopSigns(s) {
    const mural = s.cos.placed['deco-mural'];
    rect(ctx, 164, 130, 30, 11, '#4a2a18');
    rect(ctx, 165, 131, 28, 9, mural ? '#8ac8f0' : '#f2b230');
    if (mural) ctx.drawImage(spr.beePortrait('meadow', false), 171, 128, 16, 13);
    else ctx.drawImage(spr.goodIcon('wildflower'), 175, 131);
    if (!f().isOpen(s)) {
      rect(ctx, 146, 131, 12, 6, INK);
      rect(ctx, 147, 132, 10, 4, '#c84a4a');
      rect(ctx, 148, 133, 8, 1, '#fff8e0');
      rect(ctx, 151, 129, 2, 2, INK);
    }
  }

  // ---------------------------------------------------------------------------
  // 4. PEOPLE AND FURNITURE (y-sorted)
  // Each entry is { y, draw }: the lower something stands on screen (bigger y),
  // the later it's drawn, so it appears in front.
  // ---------------------------------------------------------------------------
  function drawActors(s, t) {
    const rt = HC.sim.rt;
    const actors = rt.customers.map((c) => ({ y: c.y, draw: () => drawPerson(c, c.look, t) }));
    for (const w of rt.workers) actors.push({ y: w.y, draw: () => drawWorker(s, w, t) });
    // The counter's front edge: anyone behind it (smaller y) has their legs hidden.
    actors.push({ y: L.counter.y + 4, draw: () => { drawCounter(ctx); drawRegister(s, t); } });
    if (s.merchant) actors.push({ y: L.wagon.y - 1, draw: () => drawWagon(s, t) });
    // Furniture and decorations
    const P = s.cos.placed;
    if (P['deco-table']) actors.push({ y: 86, draw: drawTable });
    if (P['deco-plant']) actors.push({ y: 124, draw: drawPlant });
    if (P['deco-chalk']) actors.push({ y: 152, draw: drawChalkboard });
    if (P['deco-bench']) actors.push({ y: 143, draw: drawBench });
    if (P['deco-gnome']) actors.push({ y: 40, draw: () => drawGnome(t) });
    if (P['deco-fountain']) actors.push({ y: 106, draw: () => drawFountain(t) });
    if (P['deco-lanterns']) actors.push({ y: 70, draw: () => drawLanterns(s, t) });
    actors.push({ y: L.board.y + 3, draw: () => drawBoard(s) });
    actors.sort((a, b) => a.y - b.y);
    for (const a of actors) a.draw();
  }

  function frameFor(c) {
    return c.path && c.path.length ? Math.floor(c.walk * 8) % 4 : 0;
  }

  function drawPerson(c, look, t) {
    const img = spr.character(look, c.dir, frameFor(c));
    const x = Math.round(c.x - 8), y = Math.round(c.y - 19);
    rect(ctx, x + 4, y + 18, 8, 2, 'rgba(43,29,20,0.25)'); // shadow
    ctx.drawImage(img, x, y);
    if (c.bubble) drawBubble(c.x, c.y - 33, c.bubble, t);
  }

  function drawWorker(s, w, t) {
    const look = w.role === 'keeper' ? spr.keeperLook(s) : D.staff[w.role].look;
    // Behind the register and ringing someone up: a little typing bounce.
    const paying = w.node === 'DESK' && !w.path.length && HC.sim.rt.queue[0] && HC.sim.rt.queue[0].state === 'pay';
    const fake = paying ? { x: w.x, y: w.y, dir: 'down', walk: t, path: Math.floor(t * 6) % 2 ? [1] : [] } : w;
    drawPerson(fake, look, t);
    // Carrying something: a crate held over their head with the product colour.
    const n = Object.keys(w.carry).length;
    if (n) {
      const g = D.good[Object.keys(w.carry)[0]];
      const x = Math.round(w.x - 4), y = Math.round(w.y - 25);
      rect(ctx, x, y, 9, 6, INK);
      rect(ctx, x + 1, y + 1, 7, 4, '#c8904a');
      rect(ctx, x + 2, y - 1, 2, 3, g.fill);
      rect(ctx, x + 5, y - 1, 2, 3, g.fill);
    }
    // A little name tag colour dot so staff are easy to tell apart.
    if (w.role !== 'keeper') rect(ctx, Math.round(w.x) - 1, Math.round(w.y) - 22, 2, 2, '#fff8e0');
  }

  function drawRegister(s, t) {
    const paying = HC.sim.rt.queue[0] && HC.sim.rt.queue[0].state === 'pay';
    rect(ctx, 222, 90, 12, 8, '#8a8a9a');
    rect(ctx, 223, 91, 10, 3, '#3a3a4a');
    rect(ctx, 224, 92, 3, 1, paying && Math.floor(t * 8) % 2 ? '#fff08a' : '#9af09a');
    rect(ctx, 222, 94, 12, 1, '#f2b230');
  }

  function drawBubble(x, y, bubble, t) {
    const bx = Math.round(x - 6), by = Math.round(y);
    const angry = bubble.kind === 'angry';
    rect(ctx, bx, by, 12, 11, INK);
    rect(ctx, bx + 5, by + 11, 2, 2, INK);
    rect(ctx, bx + 1, by + 1, 10, 9, angry ? '#f8c0b0' : '#fffaf0');
    rect(ctx, bx + 5, by + 10, 2, 1, angry ? '#f8c0b0' : '#fffaf0');
    if (bubble.kind === 'good') ctx.drawImage(spr.goodIcon(bubble.good), bx + 2, by + 1);
    else if (bubble.kind === 'heart') ctx.drawImage(spr.misc('heart'), bx + 2, by + 2);
    else if (bubble.kind === 'note') ctx.drawImage(spr.misc('note'), bx + 3, by + 2);
    else if (bubble.kind === 'impatient' || angry) {
      spr.drawText(ctx, '!', bx + 6, by + 3, angry ? '#c83a2a' : '#e8962a', null);
      if (angry) spr.drawText(ctx, '!', bx + 3, by + 3, '#c83a2a', null);
    } else if (bubble.kind === 'dots') {
      ctx.fillStyle = INK;
      const n = 1 + (Math.floor(t * 4) % 3);
      for (let i = 0; i < n; i++) ctx.fillRect(bx + 3 + i * 2, by + 6, 1, 1);
    }
  }

  function drawWagon(s, t) {
    const x = L.wagon.x - 20, y = L.wagon.y - 22;
    rect(ctx, x + 4, y + 16, 7, 7, INK);
    rect(ctx, x + 27, y + 16, 7, 7, INK);
    rect(ctx, x + 5, y + 17, 5, 5, '#c8a060');
    rect(ctx, x + 28, y + 17, 5, 5, '#c8a060');
    rect(ctx, x, y + 6, 38, 12, INK);
    rect(ctx, x + 1, y + 7, 36, 10, '#4a7a9a');
    rect(ctx, x + 1, y + 7, 36, 2, '#6a9aba');
    for (let i = 0; i < 38; i += 4) rect(ctx, x + i, y, 4, 5, (i / 4) % 2 ? '#fff4d8' : '#d84a4a');
    rect(ctx, x, y + 5, 38, 1, INK);
    ctx.drawImage(spr.beePortrait(s.merchant.offer.sp, s.merchant.offer.sparkle), x + 11, y + 4);
    ctx.drawImage(spr.character(MERCHANT_LOOK, 'down', 0), x + 38, y + 3);
    if (Math.floor(t * 2) % 2 === 0) spr.drawText(ctx, '!', x + 46, y - 4, '#fff08a');
  }

  // --- Decorations ---------------------------------------------------------------
  function drawTable() {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(118, 84, 26, 3, 'rgba(43,29,20,0.25)');
    r(117, 70, 28, 13, INK);
    r(118, 71, 26, 9, '#c88a4a');
    r(118, 71, 26, 1, '#e8b070');
    r(118, 80, 26, 2, '#8a5a2a');
    r(119, 82, 2, 4, '#6a3a1a');
    r(141, 82, 2, 4, '#6a3a1a');
    const jar = (x, y) => { r(x, y, 5, 6, INK); r(x + 1, y + 2, 3, 3, '#f8c838'); r(x + 1, y + 1, 3, 1, '#c8642a'); r(x + 1, y + 2, 1, 1, '#fde8a0'); };
    jar(121, 70); jar(126, 70); jar(131, 70); jar(136, 70);
    jar(123, 65); jar(128, 65); jar(133, 65);
    jar(126, 60); jar(131, 60);
    r(138, 76, 5, 2, '#fff4d8');
    r(139, 75, 3, 1, '#f8c838');
  }
  function drawPlant() {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(228, 116, 8, 8, INK); r(229, 117, 6, 6, '#b86a32');
    r(226, 108, 4, 4, '#4a9a3c'); r(231, 104, 4, 7, '#5aae48'); r(228, 102, 3, 5, '#6cc054'); r(233, 110, 3, 3, '#4a9a3c');
  }
  function drawChalkboard() {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(125, 139, 14, 12, INK); r(126, 140, 12, 9, '#2e4a3a');
    r(128, 142, 8, 1, '#f4f4ec'); r(128, 145, 5, 1, '#f8c838'); r(128, 147, 6, 1, '#f4f4ec');
    r(126, 150, 1, 3, INK); r(137, 150, 1, 3, INK);
  }
  function drawBench() {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(58, 135, 16, 3, INK); r(59, 136, 14, 1, '#b8783a');
    r(58, 139, 16, 3, INK); r(59, 140, 14, 1, '#c8884a');
    r(59, 142, 2, 2, INK); r(71, 142, 2, 2, INK);
  }
  function drawGnome(t) {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(88, 28, 5, 1, INK); r(87, 29, 7, 4, '#c84a4a'); r(89, 25, 3, 4, '#c84a4a'); r(90, 23, 1, 2, '#c84a4a'); // hat
    r(88, 33, 5, 3, '#f8c898'); r(88, 35, 5, 3, '#f4f4f0'); // face + beard
    r(87, 38, 7, 3, '#4a6a9a'); r(88, 41, 2, 1, INK); r(91, 41, 2, 1, INK);
    // a tiny bee buzzing around it
    rect(ctx, Math.round(90 + Math.cos(t * 3) * 5), Math.round(30 + Math.sin(t * 4) * 3), 2, 1, '#f8c838');
  }
  function drawFountain(t) {
    const r = (x, y, w, h, c) => rect(ctx, x, y, w, h, c);
    r(83, 96, 16, 9, INK); r(84, 97, 14, 7, '#b8b8c0'); r(85, 98, 12, 3, '#6ab8e0');
    r(90, 90, 2, 8, '#a8a8b0'); r(88, 89, 6, 2, '#a8a8b0');
    const k = (t * 2) % 1;
    r(89, 86 - Math.round(k * 2), 1, 2, '#c8ecf8'); r(92, 86 - Math.round((1 - k) * 2), 1, 2, '#c8ecf8');
  }
  function drawLanterns(s, t) {
    const night = lightLevels(s).night;
    for (const [x, y] of [[40, 60], [56, 60], [40, 108], [56, 108]]) {
      rect(ctx, x, y - 8, 1, 10, INK);
      rect(ctx, x - 1, y - 11, 3, 4, INK);
      rect(ctx, x, y - 10, 1, 2, night > 0.3 ? '#ffe08a' : '#c8b070');
    }
  }

  // ---------------------------------------------------------------------------
  // 5. WEATHER AND LIGHT
  // ---------------------------------------------------------------------------
  function drawWeather(s, t) {
    const id = f().season(s).id;
    const insideShop = (x, y) => x >= 112 && y < 128;
    if (id === 'winter') {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 46; i++) {
        const sp = 10 + (i % 5) * 3;
        const x = Math.floor((i * 53 + Math.sin(t * 0.8 + i) * 6 + 400) % 240);
        const y = Math.floor((i * 37 + t * sp) % 160);
        if (!insideShop(x, y)) ctx.fillRect(x, y, i % 4 === 0 ? 2 : 1, 1);
      }
    } else if (id === 'autumn') {
      for (let i = 0; i < 9; i++) {
        const x = Math.floor((i * 29 + Math.sin(t * 1.3 + i) * 10 + 200) % 104);
        const y = Math.floor((i * 41 + t * (8 + i)) % 150);
        rect(ctx, x, y, 2, 1, AUTUMN_COLS[i % 4]);
      }
    } else if (id === 'spring') {
      ctx.fillStyle = '#f8b8d0';
      for (let i = 0; i < 6; i++) {
        const x = Math.floor((i * 37 + t * 9 + Math.sin(t + i) * 8) % 104);
        const y = Math.floor((i * 23 + Math.cos(t * 0.7 + i) * 20 + t * 4) % 144);
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  // How dark it is: night 0 (day) to 1 (night), dusk = warm sunset glow.
  function lightLevels(s) {
    const p = f().dayPhase(s);
    let night = 0, dusk = 0;
    if (p >= 0.6 && p < 0.7) {
      const k = (p - 0.6) / 0.1;
      dusk = Math.sin(Math.PI * k);
      night = k;
    } else if (p >= 0.7 && p < 0.95) night = 1;
    else if (p >= 0.95) night = 1 - (p - 0.95) / 0.05;
    return { night, dusk };
  }

  function mixRGB(a, b, k) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * k));
  }

  // Tint everything blue at night (or orange at dusk), then add glowing
  // circles for lamps and the lit shop.
  function drawLighting(s, t) {
    const { night, dusk } = lightLevels(s);
    if (night <= 0.01 && dusk <= 0.01) return;
    let outside = [255, 255, 255];
    outside = mixRGB(outside, [255, 190, 140], dusk * 0.8);
    outside = mixRGB(outside, [78, 88, 160], night * 0.9);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgb(${outside})`;
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, a) => {
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(255,190,90,${a})`);
      gr.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    const flicker = 0.02 * Math.sin(t * 13) + 0.02 * Math.sin(t * 7.3);
    glow(176, 70, 90, (0.28 + flicker) * night);
    glow(107, 114, 22, (0.5 + flicker) * night);
    glow(128, 136, 16, 0.35 * night);
    glow(220, 136, 16, 0.35 * night);
    if (s.cos.placed['deco-lanterns']) for (const [x, y] of [[40, 50], [56, 50], [40, 98], [56, 98]]) glow(x, y, 12, 0.45 * night);
    if (s.cos.placed['deco-lights']) glow(176, 6, 60, 0.2 * night);
    ctx.globalCompositeOperation = 'source-over';
    if (night > 0.5) {
      ctx.fillStyle = `rgba(255,250,220,${(night - 0.5) * 1.4})`;
      const rnd = util.seeded(99);
      for (let i = 0; i < 14; i++) {
        const x = Math.floor(rnd() * 96), y = Math.floor(rnd() * 30);
        if (Math.sin(t * 2 + i) > -0.3) ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // 6. OVERLAYS
  // ---------------------------------------------------------------------------
  function drawDrip(t) {
    const d = HC.sim.rt.drip;
    if (!d) return;
    const [cx, cy] = L.hiveSlots[d.hive];
    const x = cx * 16 + 8, y = cy * 16 - 14 + Math.round(Math.sin(t * 5) * 2);
    if (d.left < 3 && Math.floor(t * 8) % 2) return; // blinking: about to vanish
    ctx.fillStyle = '#fff6b0';
    for (let i = 0; i < 4; i++) {
      const a = t * 3 + (i * Math.PI) / 2;
      ctx.fillRect(Math.round(x + Math.cos(a) * 8), Math.round(y + Math.sin(a) * 6), 1, 1);
    }
    rect(ctx, x - 3, y - 2, 7, 6, INK);
    rect(ctx, x - 2, y - 4, 5, 2, INK);
    rect(ctx, x - 1, y - 6, 3, 2, INK);
    rect(ctx, x - 2, y - 2, 5, 5, '#ffd23a');
    rect(ctx, x - 1, y - 4, 3, 2, '#ffd23a');
    rect(ctx, x, y - 5, 1, 1, '#ffd23a');
    rect(ctx, x - 1, y - 1, 1, 2, '#fff4c0');
  }

  function drawFx() {
    for (const e of HC.sim.rt.fx) {
      if (e.kind !== 'text') continue;
      const k = e.t / e.life;
      ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      spr.drawText(ctx, e.text, e.x, e.y - k * 14, '#fff08a');
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------------
  // Draw one complete frame.
  // ---------------------------------------------------------------------------
  function draw(s, t) {
    ctx.drawImage(staticFor(s), 0, 0);
    drawFlowerBeds(s, t);
    drawFlowers(s, t);
    drawGardenFlat(s, t);
    drawHives(s, t);
    drawShelves(s, t);
    drawShopFlat(s);
    drawCrates(s);
    drawMachine(s, t);
    drawShopSigns(s);
    drawActors(s, t);
    drawBees(s, t);
    drawWeather(s, t);
    drawLighting(s, t);
    drawDrip(t);
    drawFx();
  }

  // ---------------------------------------------------------------------------
  // What did the player tap? x/y are in game pixels (0-240, 0-160).
  // ---------------------------------------------------------------------------
  function hitTest(s, x, y) {
    const d = HC.sim.rt.drip;
    if (d) {
      const [cx, cy] = L.hiveSlots[d.hive];
      if (Math.abs(x - (cx * 16 + 8)) < 12 && y > cy * 16 - 26 && y < cy * 16 - 2) return { kind: 'drip' };
    }
    for (let i = 0; i < L.hiveSlots.length; i++) {
      const [cx, cy] = L.hiveSlots[i];
      if (x >= cx * 16 - 2 && x < cx * 16 + 18 && y >= cy * 16 - 14 && y < cy * 16 + 22) {
        if (s.hives[i]) return { kind: 'hive', index: i };
        if (i === s.hives.length) return { kind: 'buildHive' };
      }
    }
    if (y >= 6 && y < 34 && x >= 112 && x < 240) {
      const i = Math.floor((x - 112) / 16);
      if (s.shelves[i]) return { kind: 'shelf', index: i };
      return { kind: 'buyShelf' };
    }
    const m = L.machine;
    if (x >= m.x && x < m.x + m.w && y >= m.y - 4 && y < m.y + m.h) return { kind: 'machine' };
    const c = L.crates;
    if (x >= c.x && x < c.x + c.w && y >= c.y - 4 && y < c.y + c.h) return { kind: 'crates' };
    if (Math.abs(x - L.board.x) < 11 && y >= L.board.y - 14 && y < L.board.y + 5) return { kind: 'board' };
    if (s.merchant && x >= L.wagon.x - 22 && x < L.wagon.x + 34 && y >= L.wagon.y - 26 && y < L.wagon.y + 4) return { kind: 'merchant' };
    // Tapping a worker (within a person-sized box around their feet)
    for (const w of HC.sim.rt.workers) {
      if (Math.abs(x - w.x) < 7 && y > w.y - 20 && y < w.y + 2) return { kind: 'worker', role: w.role };
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // Store previews: draw one decoration on a blank canvas using the same code
  // as the scene, then cut out the area around it.
  // ---------------------------------------------------------------------------
  const THUMB_BOX = {
    'deco-table': [114, 56, 34, 32, drawTable],
    'deco-plant': [222, 100, 16, 26, drawPlant],
    'deco-rug': [138, 115, 28, 14, drawRug],
    'deco-chalk': [122, 136, 20, 19, drawChalkboard],
    'deco-lights': [112, 0, 44, 9, () => drawLightsOnly()],
    'deco-mural': [162, 126, 34, 17, () => drawShopSigns({ cos: { placed: { 'deco-mural': true } }, time: 0 })],
    'deco-bench': [55, 132, 22, 14, drawBench],
    'deco-gnome': [84, 20, 12, 24, () => drawGnome(0)],
    'deco-lanterns': [36, 46, 24, 66, () => drawLanterns(HC.game, 0)],
    'deco-pond': [80, 46, 22, 16, () => drawGardenFlat({ cos: { placed: { 'deco-pond': true } } }, 0)],
    'deco-fountain': [81, 83, 20, 24, () => drawFountain(0)],
  };
  function drawLightsOnly() {
    for (let x = 114; x < 158; x += 6) {
      const sag = Math.round(Math.sin(((x - 114) / 124) * Math.PI * 4) * 1.5) + 3;
      rect(ctx, x, sag, 6, 1, '#4a3a2a');
      rect(ctx, x + 2, sag + 1, 2, 2, ['#ffd23a', '#f07898', '#8ad0f0', '#8cd06a'][(x / 6) % 4 | 0]);
    }
  }
  const thumbCache = {};
  function decorThumb(id) {
    if (thumbCache[id]) return thumbCache[id];
    const box = THUMB_BOX[id];
    if (!box) return null;
    const [x, y, w, h, fn] = box;
    const full = spr.canvas(L.W, L.H);
    const saved = ctx;
    ctx = full.getContext('2d');
    // A patch of grass or floor behind it, so it reads like the scene.
    rect(ctx, x, y, w, h, x < 110 ? '#6cbc54' : '#f2dfb4');
    try { fn(); } finally { ctx = saved; }
    const out = spr.canvas(w, h);
    out.getContext('2d').drawImage(full, x, y, w, h, 0, 0, w, h);
    thumbCache[id] = { url: out.toDataURL(), w, h };
    return thumbCache[id];
  }

  HC.render = { init, draw, hitTest, lightLevels, decorThumb };
})();

</script>
<script>
// Chiptune sound: square/triangle blips for effects and a small looping tune.
// Audio starts only after the first tap, as browsers require.
(function () {
  const HC = window.HC;
  let ac = null, master = null, musicGain = null, sfxGain = null;
  let musicTimer = null, nextNote = 0, step = 0;

  function ensure() {
    if (ac) return ac;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    ac = new Ctx();
    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(ac.destination);
    sfxGain = ac.createGain();
    sfxGain.gain.value = 0.35;
    sfxGain.connect(master);
    musicGain = ac.createGain();
    musicGain.gain.value = 0.16;
    musicGain.connect(master);
    return ac;
  }

  function tone(freq, start, dur, type = 'square', vol = 0.5, dest = sfxGain, slide = 0) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g);
    g.connect(dest);
    o.start(start);
    o.stop(start + dur + 0.02);
  }

  const N = (n) => 440 * Math.pow(2, (n - 69) / 12); // MIDI note -> Hz

  const SFX = {
    coin: (t) => { tone(N(83), t, 0.05, 'square', 0.25); tone(N(88), t + 0.05, 0.12, 'square', 0.25); },
    buy: (t) => [72, 76, 79].forEach((n, i) => tone(N(n), t + i * 0.06, 0.09, 'square', 0.22)),
    click: (t) => tone(N(84), t, 0.03, 'square', 0.15),
    fail: (t) => { tone(N(55), t, 0.09, 'square', 0.25); tone(N(50), t + 0.09, 0.14, 'square', 0.25); },
    hatch: (t) => [72, 76, 79, 84, 79, 84].forEach((n, i) => tone(N(n), t + i * 0.08, 0.12, i % 2 ? 'triangle' : 'square', 0.25)),
    order: (t) => [79, 83, 86, 91].forEach((n, i) => tone(N(n), t + i * 0.07, 0.1, 'square', 0.22)),
    discover: (t) => [67, 72, 76, 79, 84, 88, 91].forEach((n, i) => tone(N(n), t + i * 0.07, 0.14, 'square', 0.22)),
    bell: (t) => { tone(N(96), t, 0.25, 'triangle', 0.3); tone(N(91), t + 0.12, 0.3, 'triangle', 0.2); },
    text: (t) => tone(N(79), t, 0.02, 'square', 0.08),
  };

  // A gentle 32-step loop in F major: melody over a walking triangle bass.
  const MELODY = [77, 0, 81, 0, 84, 0, 81, 79, 77, 0, 74, 0, 72, 0, 0, 0, 74, 0, 77, 0, 79, 0, 81, 79, 77, 0, 76, 0, 77, 0, 0, 0];
  const BASS = [53, 0, 0, 0, 60, 0, 0, 0, 50, 0, 0, 0, 57, 0, 0, 0, 46, 0, 0, 0, 53, 0, 0, 0, 48, 0, 0, 0, 53, 0, 55, 0];
  const STEP = 0.19;

  function scheduleMusic() {
    while (nextNote < ac.currentTime + 0.3) {
      const m = MELODY[step % 32], b = BASS[step % 32];
      if (m) tone(N(m), nextNote, STEP * 1.6, 'square', 0.18, musicGain);
      if (b) tone(N(b), nextNote, STEP * 3.5, 'triangle', 0.35, musicGain);
      if (step % 4 === 2) tone(2000, nextNote, 0.02, 'square', 0.03, musicGain, -1500);
      nextNote += STEP;
      step++;
    }
  }

  HC.audio = {
    unlock() {
      if (!ensure()) return;
      if (ac.state === 'suspended') ac.resume();
      HC.audio.syncMusic();
    },
    play(name) {
      const s = HC.game;
      if (!s || !s.settings.sfx || !ac || ac.state !== 'running' || !SFX[name]) return;
      SFX[name](ac.currentTime + 0.01);
    },
    syncMusic() {
      const on = HC.game && HC.game.settings.music && ac && ac.state === 'running';
      if (on && !musicTimer) {
        nextNote = ac.currentTime + 0.05;
        musicTimer = setInterval(scheduleMusic, 100);
      } else if (!on && musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    },
  };
})();

</script>
<script>
// =============================================================================
// ui.js: THE MENUS, BUTTONS AND MESSAGES AROUND THE GAME PICTURE
// -----------------------------------------------------------------------------
// Everything that isn't the pixel scene is built here as ordinary web page
// content (HTML): the status bar, the goal/work strip, the tabs (Apiary,
// Shop, Nursery, Town, Store, Guide), pop-up windows ("modals"), the little
// messages that slide in ("toasts") and the tutorial text box.
//
// HOW THE SCREEN STAYS UP TO DATE
// Rebuilding a whole tab 20 times a second would be slow and would swallow
// clicks (a button replaced mid-tap never receives the tap). So there are
// two kinds of updates:
//   1. Full redraws, only when something structural changes: you bought a
//      bee, a build finished, a request appeared... Game code signals this
//      by announcing 'dirty' on the message bus.
//   2. "Live" values: numbers that tick constantly (coins, timers, honey
//      meters). These are marked in the HTML with data-live="..." (text),
//      data-width="..." (progress bars), data-afford="..." (buttons that
//      grey out when you can't pay) or data-html="..." (small chunks).
//      Four times a second, refreshLive() updates only those.
//
// HOW BUTTONS WORK
// Every button has data-act="something" (plus optional data-* details).
// One click listener for the whole page reads data-act and calls
// handleAct(), which calls the matching function in actions.js.
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data: D, spr, bus } = HC;
  const { fmt, esc } = util;
  const f = () => HC.sim.f;
  const S = () => HC.game;

  const $ = (sel, root = document) => root.querySelector(sel);
  const el = {}; // handy references to page elements, filled in init()
  let tab = 'apiary'; // which tab is open
  let dirty = true; // does the open tab need a full redraw?
  let modal = null; // the open pop-up: { render, onAct?, onSubmit? }
  const live = new Map(); // live-value functions, looked up by id
  let liveSeq = 0;

  // Register a live value; returns an id to put in a data-live attribute.
  function L(fn) {
    const id = 'l' + liveSeq++;
    live.set(id, fn);
    return id;
  }

  // ---------------------------------------------------------------------------
  // Little HTML building blocks
  // ---------------------------------------------------------------------------
  const icon = (name, size = 16) => `<img class="px ico" src="${spr.miscURL(name)}" alt="" width="${size}" height="${size}">`;
  const coin = () => icon('coin');
  const gem = () => icon('gem');
  const goodImg = (g, size = 16) => `<img class="px ico" src="${spr.goodURL(g)}" alt="" width="${size}" height="${size}">`;
  const beeImg = (sp, sparkle, size = 32, cls = '') => `<img class="px bee-img ${cls}" src="${spr.beeURL(sp, sparkle)}" alt="" width="${size}" height="${size}">`;
  const price = (n) => `${coin()}<span>${fmt(n)}</span>`;
  const gemPrice = (n) => `${gem()}<span>${n}</span>`;
  const rarityChip = (r) => `<span class="chip chip-${r.toLowerCase()}">${r}</span>`;
  const bar = (fn, cls = '') => `<span class="bar ${cls}"><i data-width="${L(fn)}"></i></span>`;

  // A button. opts.cost greys it out while you can't afford it;
  // opts.gems does the same for gems; opts.need is the message shown if
  // tapped while greyed out.
  function btn(label, act, args = {}, opts = {}) {
    const data = Object.entries(args).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
    let afford = '';
    if (opts.cost != null) afford = `data-afford="${L(() => S().coins >= opts.cost && (!opts.build || HC.builds.freeBuilder(S())))}"`;
    else if (opts.gems != null) afford = `data-afford="${L(() => S().gems >= opts.gems)}"`;
    const need = opts.need ? `data-need="${esc(opts.need)}"` : '';

  // A "build this" button showing cost and how long it takes. If that exact
  // thing is already under construction, shows its progress and a gem skip.

    return btn(`${label} ${price(cost)} <span class="time">${util.fmtTime(f().buildTime(cost))}</span>`, act, args, { cost, build: true, need: busy || 'Not enough coins.', cls: 'btn-sm' });

  function buildingChip(b) {
    return `<span class="building">${icon('hammer', 12)}<span data-live="${L(() => util.fmtTime(HC.builds.left(S(), b)))}"></span>

      <button class="btn btn-sm btn-gem" data-act="skipBuild" data-id="${b.id}" data-afford="${L(() => S().gems >= f().gemsToSkip(HC.builds.left(S(), b)))}" data-need="Not enough gems.">Finish ${gem()}<span data-live="${L(() => f().gemsToSkip(HC.builds.left(S(), b)))}"></span></button></span>`;

  // ---------------------------------------------------------------------------
  // Toasts (sliding messages) and the tutorial text box
  // ---------------------------------------------------------------------------
  function toast(msg, kind = '') {
    if (!msg) return;
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    el.toasts.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
    while (el.toasts.children.length > 4) el.toasts.firstChild.remove();
  }
  // Same, but at most once every `secs` seconds per `key` (avoids spam).
  const lastToast = {};
  function toastOnce(key, secs, msg, kind) {
    const now = Date.now();
    if (lastToast[key] && now - lastToast[key] < secs * 1000) return;
    lastToast[key] = now;
    toast(msg, kind);
  }

  // The text box types out lines one letter at a time. Each line can carry a
  // `valid` check: if it's no longer true (you already did the thing), the
  // line is skipped or dismissed.
  const textQueue = [];
  let typing = null;
  let shown = null;
  function say(lines, valid) {
    textQueue.push(...lines.map((text) => ({ text, valid })));
    if (!typing && el.textbox.hidden) nextLine();
  }
  function nextLine() {
    if (typing) {
      // Tapped while typing: finish the line instantly.
      clearInterval(typing.timer);
      el.textboxText.textContent = typing.line;
      typing = null;
      el.textbox.classList.add('done');
      return;
    }
    let item = textQueue.shift();
    while (item && item.valid && !item.valid()) item = textQueue.shift();
    shown = item || null;
    const line = item && item.text;
    if (line == null) {
      el.textbox.hidden = true;
      return;
    }
    el.textbox.hidden = false;
    el.textbox.classList.remove('done');
    el.textboxText.textContent = '';
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      el.textboxText.textContent = line;
      el.textbox.classList.add('done');
      return;
    }
    let i = 0;
    typing = {
      line,
      timer: setInterval(() => {
        i++;
        el.textboxText.textContent = line.slice(0, i);
        if (i % 3 === 0) HC.audio.play('text');
        if (i >= line.length) {
          clearInterval(typing.timer);
          typing = null;
          el.textbox.classList.add('done');
        }
      }, 24),
    };
  }

  function goalHtml() {
    const s = S();
    const g = HC.goals.current(s);
    if (!g) return '<span class="goal-text">Every goal complete. The town is proud of you.</span>';
    const ok = g.check(s);
    const reward = price(g.reward) + (g.gems ? ' ' + gemPrice(g.gems) : '');
    return `<span class="goal-label">Goal ${(s.goal || 0) + 1}</span><button class="goal-text" data-act="goalHint" title="Show a hint">${g.text}</button>` +
      (ok ? `<button class="btn btn-sm btn-go" data-act="claimGoal">Claim ${reward}</button>` : `<span class="goal-reward">${reward}</span>`);
  }
  function seasonHtml() {
    const s = S();
    const se = f().season(s);
    return `<span class="season-dot season-${se.id}"></span><b>${se.name}</b><span class="lbl">day ${f().day(s)}</span>`;
  }
  function starsHtml() {
    const r = S().rep;
    let h = '';
    for (let i = 0; i < 5; i++) h += icon(r >= i + 0.5 ? 'star' : 'starEmpty', 12);
    return h + `<span class="sr-only">${r.toFixed(1)} of 5</span>`;
  }
  function timeHtml() {
    const p = f().dayPhase(S());
    const mins = Math.floor(((p * 24 + 6) % 24) * 60); // day starts at 6am
    const hh = Math.floor(mins / 60), mm = mins % 60;
    const night = f().isNight(S());
    const label = `${((hh + 11) % 12) + 1}:${String(mm - (mm % 10)).padStart(2, '0')} ${hh < 12 ? 'am' : 'pm'}`;
    return `${icon(night ? 'moon' : 'sun', 14)}<b>${label}</b>`;
  }

      const items = D.CATALOG.filter((it) => it.cat === sec.cat).map((it) => storeCard(s, it, sec)).join('');

    return `
      <section class="win">
        <div class="win-head"><h2>Store</h2><span class="muted">${gem()} ${fmt(s.gems)} gems</span></div>

          <img class="px keeper-preview" src="${spr.personURL(look)}" alt="Your shopkeeper" width="64" height="80">
          <div class="grow">
            <p>Dress up your shopkeeper, decorate the shop and garden, and restyle your hives. Many decorations come with a small bonus.</p>
            <p class="muted small">Gems come from goals, requests, new species, festivals, season changes and golden drips.</p>
          </div>
        </div>

          <div class="grow"><b>Extra builder</b><p class="muted">Build ${s.builders + 1} things at the same time. You have ${s.builders}.</p></div>

        </div>
      </section>
      <section class="win store">${sections}</section>`;

  // One item card in the Store.
  function storeCard(s, it, sec) {
    const owned = !!s.cos.owned[it.id];
    const inUse = sec.pick ? s.cos.equip[it.cat] === it.id : !!s.cos.placed[it.id];
    let action;
    if (!owned) {
      const c = it.cost || {};
      action = c.gems ? btn(`Buy ${gemPrice(c.gems)}`, 'buyItem', { id: it.id }, { gems: c.gems, cls: 'btn-sm btn-gem', need: 'Not enough gems.' })
        : btn(`Buy ${price(c.coins || 0)}`, 'buyItem', { id: it.id }, { cost: c.coins || 0, cls: 'btn-sm' });
    } else if (sec.pick) {
      action = inUse ? '<span class="chip chip-on">Using</span>' : btn('Use', 'useItem', { id: it.id }, { cls: 'btn-sm btn-ghost' });
    } else {
      action = btn(inUse ? 'Put away' : 'Place', 'useItem', { id: it.id }, { cls: 'btn-sm btn-ghost' });
    }
    const bonus = it.bonus ? Object.entries(it.bonus).map(([k, v]) => '+' + Math.round(v * 100) + '% ' + { customers: 'customers', prod: 'honey', rep: 'reputation gain' }[k]).join(', ') : '';
    return `<div class="store-card ${inUse ? 'in-use' : ''}">
      <div class="store-thumb">${storeThumb(s, it)}</div>
      <b>${it.name}</b>
      ${bonus ? `<span class="muted small">${bonus}</span>` : ''}
      ${action}
    </div>`;
  }
  // A little preview picture for each kind of Store item.
  function storeThumb(s, it) {
    const look = spr.keeperLook(s);
    if (it.cat === 'hat') return `<img class="px" src="${spr.personURL(Object.assign({}, look, { hat: it.value }))}" alt="" width="32" height="40">`;
    if (it.cat === 'hair') return `<img class="px" src="${spr.personURL(Object.assign({}, look, { hair: it.colors, hat: null }))}" alt="" width="32" height="40">`;
    if (it.cat === 'shirt') return `<img class="px" src="${spr.personURL(Object.assign({}, look, { shirt: it.colors }))}" alt="" width="32" height="40">`;
    if (it.cat === 'apron') return `<img class="px" src="${spr.personURL(Object.assign({}, look, { apron: it.colors[0] }))}" alt="" width="32" height="40">`;
    if (it.cat === 'hiveStyle') return `<img class="px" src="${spr.hiveURL(3, it.id)}" alt="" width="27" height="48">`;
    const sw = {
      'wall-planks': ['#b86a32', '#9a5626'], 'wall-honeycomb': ['#f2c050', '#e0a838'], 'wall-stripes': ['#e4f4e8', '#a8dcc0'], 'wall-rose': ['#f4d4dc', '#d890a4'],
      'floor-checker': ['#f2dfb4', '#e6cc98'], 'floor-wood': ['#c8945a', '#a0703e'], 'floor-tiles': ['#cfe4f0', '#f4f8fb'],
    }[it.id];
    if (sw) return `<span class="swatch" style="background: repeating-linear-gradient(90deg, ${sw[0]} 0 6px, ${sw[1]} 6px 12px)"></span>`;
    const th = HC.render.decorThumb(it.id);
    if (!th) return '';
    const scale = Math.min(2, 44 / Math.max(th.w, th.h));
    return `<img class="px" src="${th.url}" alt="" width="${Math.round(th.w * scale)}" height="${Math.round(th.h * scale)}">`;
  }

  // ---- GUIDE ----------------------------------------------------------------
  panels.guide = function () {
    const s = S();
    const found = D.SPECIES.filter((x) => s.discovered[x.id]).length;
