<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honeycomb Corner</title>
<meta name="description" content="A cozy pixel-art idle game: keep bees, breed new species, and run a honey shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
/* Layout: a handheld "screen" (scene + HUD + tabs) beside parchment menu
   windows; on phones the screen sits on top and the menus scroll beneath. */
:root {
  --night: #221a24;       /* page ground, dusk-aubergine */
  --night-2: #2f2431;     /* honeycomb pattern lines */
  --bezel: #3d2e36;       /* handheld shell */
  --bezel-hi: #56414b;
  --parch: #fff3d4;       /* menu window paper */
  --parch-2: #f5e0b0;     /* inset rows */
  --ink: #2b1d14;         /* outlines + text */
  --ink-soft: #6e5644;
  --honey: #f2b230;       /* accent */
  --amber: #d9771f;
  --leaf: #4f9a3f;
  --berry: #c8445a;
  --cream-text: #f8ead0;
  --gem: #7ad8f8;         /* gems: the rare speed-up currency */
  --focus: #7ad0f0;

  --font-display: 'Silkscreen', ui-monospace, 'Courier New', monospace;
  --font-body: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;

  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  /* Faint honeycomb: two offset hex-ish dot grids */
  background-image:
    radial-gradient(circle at 50% 50%, var(--night-2) 1.5px, transparent 2px),
    radial-gradient(circle at 50% 50%, var(--night-2) 1.5px, transparent 2px);
  background-size: 28px 48px;
  background-position: 0 0, 14px 24px;
  color: var(--cream-text);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.4;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.ico { vertical-align: -3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 40px;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}

/* ---- Masthead -------------------------------------------------------- */
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.masthead .logo { min-width: 0; }
.logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.95rem, 4.2vw, 1.9rem);
  letter-spacing: 0.02em;
  margin: 0;
  color: var(--honey);
  text-shadow: 3px 3px 0 var(--ink), 0 0 0 var(--ink);
  display: flex; align-items: center; gap: 10px;
  text-wrap: balance;
}
.logo-mark {
  width: 22px; height: 24px; flex: none;
  background: var(--honey);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  box-shadow: inset 0 -6px 0 var(--amber);
}
.tagline { margin: 0; font-family: var(--font-display); font-size: var(--step--1); color: #b89c86; letter-spacing: 0.06em; text-transform: uppercase; }

/* ---- Stage: bezel, screen, HUD, tabs ------------------------------------ */
.stage { display: grid; gap: 10px; align-content: start; min-width: 0; }
.bezel {
  background: var(--bezel);
  border: 3px solid var(--ink);
  border-radius: 14px 14px 28px 14px;
  padding: 12px 12px 10px;
  box-shadow: inset 0 2px 0 var(--bezel-hi), 0 6px 0 rgba(0, 0, 0, 0.35);
}
.screen {
  position: relative;
  border: 3px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
  background: #000;
  line-height: 0;
}
#scene {
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  max-width: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
  touch-action: manipulation;
}

.textbox {
  position: absolute;
  left: 3%; right: 3%; bottom: 4%;
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch);
  padding: 10px 28px 10px 14px;
  line-height: 1.35;
  font-size: clamp(0.8rem, 2.4vw, 1.05rem);
  min-height: 3.4em;
  cursor: pointer;
}
.textbox p { margin: 0; }
.textbox .more {
  position: absolute; right: 12px; bottom: 9px;
  width: 0; height: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--amber);
  opacity: 0;
}
.textbox.done .more { opacity: 1; animation: bob 0.7s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

.hud {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 8px 4px 0;
  font-family: var(--font-display);
  font-size: var(--step--1);
  color: var(--cream-text);
  font-variant-numeric: tabular-nums;
}
.hud b { font-weight: 700; }
.hud-coins { font-size: var(--step-1); display: flex; align-items: center; gap: 6px; color: var(--honey); }
.hud-gems { font-size: var(--step-0); display: flex; align-items: center; gap: 5px; color: var(--gem); margin-right: auto; }
.mast-right { display: flex; align-items: center; gap: 12px; }
.hud-gear {
  background: none; border: 2px solid var(--bezel-hi); border-radius: 6px; color: var(--cream-text);
  width: 30px; height: 28px; cursor: pointer; font-size: 1rem; line-height: 1;
}
.hud-gear:hover { border-color: var(--honey); color: var(--honey); }
.hud-coins .ico { width: 20px; height: 20px; }
.hud-item { display: flex; align-items: center; gap: 5px; }
.hud .lbl { color: #b89c86; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
.stars { display: inline-flex; gap: 1px; }
.season-chip { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.season-chip:hover b { text-decoration: underline; }
.season-dot { width: 10px; height: 10px; border: 2px solid var(--ink); display: inline-block; }
.season-spring { background: #f8b8d0; }
.season-summer { background: #f8d030; }
.season-autumn { background: #e8702a; }
.season-winter { background: #e8eef4; }

.goalbar { margin-top: 8px; display: grid; gap: 6px; }
.goal-inner {
  display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
  background: rgba(0, 0, 0, 0.22);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 6px 8px 6px 10px;
  min-height: 40px;
}
.goal-label { font-family: var(--font-display); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--honey); white-space: nowrap; }
.goal-text { flex: 1; min-width: 10em; font-size: var(--step--1); background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: help; }
.goal-text:hover { text-decoration: underline dotted; }
.goal-reward { display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); color: #b89c86; font-variant-numeric: tabular-nums; }
.goal-reward .ico { width: 14px; height: 14px; vertical-align: 0; }

.tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 4px;
}
.tabs button {
  position: relative;
  background: var(--bezel);
  border: 2px solid var(--ink);
  border-radius: 6px 6px 3px 3px;
  padding: 8px 2px;
  font-family: var(--font-display);
  font-size: clamp(0.62rem, 2.2vw, 0.8rem);
  color: #d8c4ae;
  cursor: pointer;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tabs button:hover { color: var(--parch); }
.tabs button.on { background: var(--honey); color: var(--ink); box-shadow: inset 0 -3px 0 var(--amber); }
.tabs button.badge::after {
  content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
  background: var(--berry); border: 1px solid var(--ink);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* ---- Panel windows --------------------------------------------------- */
.panel { display: grid; gap: 14px; align-content: start; min-width: 0; }
.win {
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch), 0 5px 0 rgba(0, 0, 0, 0.35);
  padding: 14px 16px 16px;
  min-width: 0;
}
.win > * + * { margin-top: 10px; }
.win p { margin: 0; }
.win-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.win h2, .modal h2 {
  font-family: var(--font-display);
  font-size: var(--step-1);
  margin: 0;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
h3 { font-size: var(--step-0); margin: 0; font-weight: 600; }
.muted { color: var(--ink-soft); }
.small { font-size: var(--step--1); }
.grow { flex: 1; min-width: 0; }
.empty-note { padding: 6px 0; }
.stack { display: grid; gap: 10px; }
.list { display: grid; gap: 2px; }

.card {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 10px 12px;
}
.card-head { display: flex; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap; }
.card-head img { width: 32px; height: 32px; }
.hive-card { display: grid; gap: 10px; }
.hive-card.flash { animation: flash 0.3s steps(2) 3; }
@keyframes flash { 50% { background: var(--honey); } }

.row-item {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 4px;
  border-bottom: 2px dashed rgba(43, 29, 20, 0.2);
}
.row-item:last-child { border-bottom: 0; }
.row-item.locked { opacity: 0.6; }
.row-item p { font-size: var(--step--1); }

/* ---- Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  background: var(--honey);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 5px;
  padding: 7px 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  transition: transform 60ms;
}
.btn:hover { background: #f8c450; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .ico { width: 14px; height: 14px; vertical-align: 0; }
.btn-sm { padding: 5px 9px; font-size: var(--step--1); }
.btn-go { background: #8cd06a; }
.btn-go:hover { background: #a2dc82; }
.btn-ghost { background: var(--parch); }
.btn-ghost:hover { background: #fff; }
.btn-danger { background: #f09080; }
.btn.cant, .btn:disabled { background: #d8ccb4; color: #8a7a6a; box-shadow: 0 3px 0 #8a7a6a; border-color: #8a7a6a; cursor: not-allowed; }
.btn.cant .ico { opacity: 0.55; }
.btn.shake { animation: shake 0.25s steps(4); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.center { justify-content: center; }
.link { background: none; border: 0; padding: 2px 4px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: var(--step--1); }

.chip {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.66rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 1px 6px;
  border: 2px solid var(--ink);
  border-radius: 3px;
  background: var(--parch);
  vertical-align: 1px;
  white-space: nowrap;
}
.chip-common { background: #e8e0cc; }
.chip-uncommon { background: #b8e0a0; }
.chip-rare { background: #a8d0f0; }
.chip-epic { background: #d0b0f0; }
.chip-legendary { background: #f8d060; }
.chip-sparkle { background: #f8b8d0; }

.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 4px;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 12px;
  font-size: var(--step--1);
  font-variant-numeric: tabular-nums;
}

.bar { display: block; height: 8px; background: #e0cda0; border: 2px solid var(--ink); border-radius: 2px; overflow: hidden; min-width: 40px; }
.bar.big { height: 12px; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--honey); box-shadow: inset 0 -2px 0 var(--amber); transition: width 0.25s steps(6); }

/* ---- Bees ------------------------------------------------------------ */
.bee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.bee-grid > p { grid-column: 1 / -1; }
.bee-grid.pick { max-height: 46vh; overflow-y: auto; padding: 4px; }
.bee-tile {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--parch);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 8px 4px 6px;
  cursor: pointer;
  min-width: 0;
  box-shadow: 0 2px 0 rgba(43, 29, 20, 0.35);
}
.bee-tile:hover { background: #fffaf0; }
.bee-tile .bee-img { width: 40px; height: 40px; }
.bee-name { font-weight: 600; font-size: var(--step--1); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bee-sub { font-size: 0.72rem; color: var(--ink-soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bee-tile.empty { border-style: dashed; background: transparent; box-shadow: none; justify-content: center; min-height: 86px; }
.bee-tile.empty .plus { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; color: var(--ink-soft); }
.bee-tile.selected { background: #fff4b0; outline: 3px solid var(--amber); outline-offset: -1px; }
.bee-tile.is-sparkle { background: linear-gradient(160deg, #fff4fa, #fde6c8); }
.sel-badge {
  position: absolute; top: -8px; left: -6px;
  background: var(--amber); color: var(--ink);
  font-family: var(--font-display); font-size: 0.7rem;
  border: 2px solid var(--ink); border-radius: 3px; padding: 0 5px;
}
.mystery { filter: brightness(0) opacity(0.45); }

.merchant-card {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(90deg, #dbe8f4, #efe2f7);
  border: 2px solid var(--ink); border-radius: 6px; padding: 10px 12px;
}
.merchant-card img { width: 48px; height: 48px; }

/* ---- Shop ------------------------------------------------------------ */
.shelf-tile {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  text-align: left;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.shelf-tile:hover { background: #fbe9c0; }
.shelf-tile img { width: 28px; height: 28px; }
.shelf-num { font-family: var(--font-display); font-size: var(--step--1); color: var(--ink-soft); width: 1.2em; }
.shelf-empty { width: 28px; font-size: 0.7rem; color: var(--ink-soft); text-align: center; }
.shelf-info { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.shelf-info .muted { font-size: var(--step--1); }

.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.store-item {
  display: grid; justify-items: center; gap: 3px;
  background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 6px;
  font-variant-numeric: tabular-nums;
}
.store-item img { width: 28px; height: 28px; }
.store-item .bar { width: 100%; }
.store-qty { font-weight: 600; font-size: var(--step--1); }

/* ---- Nursery --------------------------------------------------------- */
.cradle .egg { width: 40px; height: 40px; }
.cradle.ready { background: #fff2b8; animation: glow 1.2s steps(2) infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--honey); } }
.parents { display: flex; align-items: center; gap: 2px; }
.parents img { width: 36px; height: 36px; }
.heart { font-family: var(--font-display); color: var(--berry); padding: 0 2px; }
.recipes { display: grid; gap: 6px; }
.recipe { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--step--1); }
.recipe img { width: 28px; height: 28px; }
.breed-preview { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 10px; }
.breed-preview img { width: 44px; height: 44px; }

/* ---- Town ------------------------------------------------------------ */
.order img { width: 36px; height: 36px; }
.order-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---- Guide ----------------------------------------------------------- */
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.guide-cell {
  position: relative;
  display: grid; justify-items: center; gap: 4px;
  background: linear-gradient(#fbecc4, var(--parch-2));
  border: 2px solid var(--ink); border-radius: 6px;
  padding: 10px 6px 8px;
  cursor: pointer;
  min-width: 0;
}
.guide-cell.unknown { background: #e6d6b0; }
.guide-cell .bee-img { width: 56px; height: 56px; }
.guide-no { position: absolute; top: 4px; left: 6px; font-family: var(--font-display); font-size: 0.62rem; color: var(--ink-soft); }
.sparkle-dot { position: absolute; top: 3px; right: 6px; color: #d0508a; }
.stats { display: grid; gap: 0; }
.stat-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 2px; border-bottom: 2px dotted rgba(43, 29, 20, 0.2); font-variant-numeric: tabular-nums; }
.stat-row:last-child { border-bottom: 0; }
.stat-row b { text-align: right; font-weight: 600; }

/* ---- Menu ------------------------------------------------------------ */
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--amber); }
textarea {
  width: 100%;
  margin-top: 6px;
  font-family: ui-monospace, monospace;
  font-size: 0.72rem;
  background: #fffaf0;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 6px;
  word-break: break-all;
}
#saveArea .btn { margin-top: 6px; }

/* ---- Modal ----------------------------------------------------------- */
.modal {
  position: fixed; inset: 0;
  background: rgba(20, 12, 18, 0.72);
  display: grid; place-items: center;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  z-index: 20;
}
.modal-card {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch), 0 8px 0 rgba(0, 0, 0, 0.4);
  padding: 18px 18px 16px;
  animation: pop 0.14s steps(3);
}
@keyframes pop { from { transform: scale(0.94); } }
#modalBody > * + * { margin-top: 12px; }
#modalBody p { margin: 0; }
.modal h3.sub { font-family: var(--font-display); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.eyebrow { font-family: var(--font-display); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); }
.bee-hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bee-hero .bee-img { width: 96px; height: 96px; background: var(--parch-2); border: 2px solid var(--ink); border-radius: 8px; }
.bee-hero.is-sparkle .bee-img { background: linear-gradient(160deg, #fff4fa, #fde6c8); }
.rename { display: flex; gap: 6px; }
.rename input { font: inherit; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 4px; background: #fffaf0; color: var(--ink); width: 11em; }
.pick-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; padding: 2px; }
.pick-row {
  display: flex; align-items: center; gap: 10px;
  text-align: left; width: 100%;
  background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px;
  padding: 8px 10px; cursor: pointer;
}
.pick-row:hover { background: #fbe9c0; }
.pick-row.selected { outline: 3px solid var(--amber); outline-offset: -1px; }
.pick-row .grow { display: flex; flex-direction: column; }
.pick-row .muted { font-size: var(--step--1); }
.pick-row img { width: 32px; height: 32px; }

.reveal { text-align: center; display: grid; justify-items: center; gap: 8px; }
.reveal .bee-img { width: 128px; height: 128px; }
.reveal.is-sparkle { background: radial-gradient(circle, #fff0f6 0%, transparent 70%); }
.pop { animation: hatch 0.6s steps(6); }
@keyframes hatch { 0% { transform: scale(0.2) rotate(-20deg); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* ---- Toasts ---------------------------------------------------------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 6px; justify-items: center;
  z-index: 30; pointer-events: none;
  width: min(440px, calc(100% - 32px));
}
.toast {
  background: var(--parch); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 6px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
  padding: 7px 12px;
  font-size: var(--step--1);
  text-align: center;
  animation: toastIn 0.15s steps(3);
}
.toast.good { background: #d8f0c0; }
.toast.bad { background: #f8d0c8; }
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }

/* ---- Wide screens: stage left (sticky), menus right --------------------- */
@media (min-width: 960px) {
  .app { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: 24px; }
  .masthead { grid-column: 1 / -1; }
  .stage { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); align-self: start; }
}
/* Tall phones: keep the scene in view while the menus scroll */
@media (max-width: 959px) and (min-height: 1000px) {
  .stage {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--night);
    padding-block: 6px 8px;
    margin-inline: -16px;
    padding-inline: 16px;
    box-shadow: 0 8px 12px -8px rgba(0, 0, 0, 0.6);
  }
}
@media (max-width: 560px) {
  .tabs { gap: 3px; }
  .tabs button { font-family: var(--font-body); font-weight: 600; font-size: clamp(0.68rem, 3.3vw, 0.85rem); letter-spacing: -0.01em; padding: 8px 0; text-overflow: clip; }
  .hud { gap: 4px 10px; }
}
@media (max-width: 420px) {
  .bezel { padding: 8px 8px 8px; border-radius: 10px 10px 20px 10px; }
  .win { padding: 12px 12px 14px; }
  .bee-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .tagline { display: none; }
  .logo-mark { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ---- Work / build rows under the goal ---------------------------------- */
.work-row, .build-row {
  display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
  padding: 2px 10px;
  font-size: var(--step--1);
}
.work-text { flex: 1; min-width: 8em; }
.work-queue { color: var(--honey); font-variant-numeric: tabular-nums; }
.work-row .link { color: #b89c86; }
.work-open .open { color: #8cd06a; font-family: var(--font-display); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; }
.work-open .closed { color: #f09080; font-family: var(--font-display); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* A thing under construction: hammer, time left, a bar and a gem skip. */
.building { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: var(--step--1); flex-wrap: wrap; }
.bar.mini { width: 56px; height: 8px; }
.btn .time { font-weight: 400; opacity: 0.75; font-size: 0.72rem; }
.btn-gem { background: #bfe8f8; }
.btn-gem:hover { background: #d4f0fb; }

/* ---- Hives ------------------------------------------------------------ */
.card-head .hive-ico { width: 27px; height: 48px; }
.honey-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: var(--step--1); }
.honey-row .bar { flex: 1; min-width: 80px; }
.honey-row .lbl { font-family: var(--font-display); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.bar.honey i { background: #f8c838; }
.full-flag { color: #c8601e; font-weight: 600; }
.full-flag:empty { display: none; }
.bee-tile.resting { opacity: 0.6; }
.rest-badge {
  position: absolute; top: -8px; right: -4px;

  font-family: var(--font-display); font-size: 0.56rem; padding: 0 4px; text-transform: uppercase;
}

/* ---- Staff and machine ------------------------------------------------ */
.staff-row .person { width: 32px; height: 40px; }
.machine-status { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.machine-status > span { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.machine-status .bar { width: 110px; }

/* ---- Store ------------------------------------------------------------ */
.store-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.keeper-preview { width: 64px; height: 80px; background: var(--parch-2); border: 2px solid var(--ink); border-radius: 8px; padding: 4px; }

.store-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.store-card {

<script>
// =============================================================================
// util.js: SMALL HELPER TOOLS USED EVERYWHERE
// -----------------------------------------------------------------------------
// This file loads first. It creates the shared `HC` object that every other
// file attaches itself to, and fills in:
//   HC.util - little maths/text helpers (random numbers, number formatting...)
//   HC.bus  - a "message board" that lets parts of the game tell each other
//             when something happened (e.g. "a sale happened!") without
//             needing to know about each other.
//
// How the files fit together: the game has no build step. index.html simply
// loads each .js file in order with a <script> tag. Every file is wrapped in
// `(function () { ... })();`, a pattern that keeps its private variables from
// leaking out, and shares only what it deliberately puts onto `HC`.
// =============================================================================
(function () {
  // Create HC once (or reuse it if it already exists) and put it on `window`,
  // the browser's global object, so every file can reach it.
  const HC = (window.HC = window.HC || {});

  // Letters used to shorten big numbers: 12,300 -> 12.3K, 4,500,000 -> 4.50M.
  const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];

  const util = {
    // Keep a number inside a range: clamp(15, 0, 10) gives 10.
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    // Blend between two numbers: lerp(0, 100, 0.25) gives 25.
    lerp: (a, b, t) => a + (b - a) * t,
    // A random decimal between a and b.
    rand: (a, b) => a + Math.random() * (b - a),
    // A random whole number between a and b, including both ends.
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    // A random item from a list.
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    // True with probability p: chance(0.25) is true about 1 time in 4.
    chance: (p) => Math.random() < p,

    // Pick a random item where some items are more likely than others.
    // weightFn gives each item a "weight"; an item with weight 10 is picked
    // twice as often as one with weight 5. Returns null if nothing can be picked.
    weighted(items, weightFn) {
      let total = 0;
      const ws = items.map((it) => {
        const w = Math.max(0, weightFn(it));
        total += w;
        return w;
      });
      if (total <= 0) return null;
      let r = Math.random() * total;
      for (let i = 0; i < items.length; i++) {
        r -= ws[i];
        if (r <= 0) return items[i];
      }
      return items[items.length - 1];
    },

    // A random number that is usually close to 0 and rarely far from it
    // (a "bell curve"). Used so baby bees' vigor is usually near their
    // parents' but occasionally a big jump.
    gauss() {
      let u = 0, v = 0;
      while (!u) u = Math.random();
      while (!v) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },

    // A "repeatable" random generator: given the same seed it produces the
    // same sequence every time. That keeps the grass speckles and flower
    // positions identical on every visit instead of reshuffling.
    seeded(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },

    // Turn a piece of text into a big number that's always the same for the
    // same text. Used to give each bee its own steady flight pattern.
    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    },

    // A short random id like "k3f9zq1ab", used to tell bees, orders etc. apart.
    uid() {
      return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
    },

    // Format a number for display: 1234 -> "1,234"; 12345 -> "12.3K";
    // 1500000000 -> "1.50B".
    fmt(n) {
      if (!isFinite(n)) return '∞';
      const neg = n < 0;
      n = Math.abs(n);
      let out;
      if (n < 10000) {
        out = n < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toLocaleString('en-US');
      } else {
        let i = 0;
        while (n >= 1000 && i < SUFFIXES.length - 1) {
          n /= 1000;
          i++;
        }
        out = (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + SUFFIXES[i];
      }
      return (neg ? '-' : '') + out;
    },

    // A shorter format for the tiny pixel font inside the game picture, which
    // only knows digits, '.', and the letters K, M, B and T.
    fmtShort(n) {
      n = Math.floor(n);
      if (n < 1000) return String(n);
      let i = 0;
      while (n >= 1000 && i < 4) {
        n /= 1000;
        i++;
      }
      return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' KMBT'[i];
    },

    // Seconds to friendly text: 45 -> "45s", 125 -> "2m 05s", 4000 -> "1h 06m".
    fmtTime(s) {
      s = Math.max(0, Math.ceil(s));
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return m + 'm ' + String(r).padStart(2, '0') + 's';
      const h = Math.floor(m / 60);
      return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    },

    // 1.25 -> "125%"
    pct: (v) => Math.round(v * 100) + '%',

    // Make text safe to put inside a web page. Without this, a bee renamed
    // "<b>" would be treated as page code instead of shown as letters.
    esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    // The browser's built-in save space ("localStorage"). Some browsers block
    // it (private windows, strict settings), so every use is wrapped in
    // try/catch: if saving fails, the game keeps running instead of crashing.
    store: {
      get(k) {
        try { return window.localStorage.getItem(k); } catch (e) { return null; }
      },
      set(k, v) {
        try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; }
      },
      del(k) {
        try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
      },
    },
  };

  // ---------------------------------------------------------------------------
  // THE MESSAGE BOARD ("event bus")
  // One part of the game calls HC.bus.emit('sale', details) to announce
  // something. Any other part that earlier said HC.bus.on('sale', fn) gets its
  // function `fn` called with the details. For example, a sale makes the audio
  // play a coin sound and the UI refresh, without the shop code knowing either
  // of those exist.
  // ---------------------------------------------------------------------------
  const handlers = {};
  HC.bus = {
    on(evt, fn) {
      (handlers[evt] = handlers[evt] || []).push(fn);
    },
    emit(evt, payload) {
      (handlers[evt] || []).forEach((fn) => fn(payload));
      (handlers['*'] || []).forEach((fn) => fn(evt, payload));
    },
  };

  HC.util = util;
})();

</script>

<script>
// =============================================================================
// state.js: THE SAVE FILE
// -----------------------------------------------------------------------------
// Everything the game needs to remember about *your* game lives in one object,
// usually called `s` (for "state") and stored at HC.game. This file:
//   - builds a brand-new game (newGame)
//   - creates new bees (makeBee)
//   - saves to / loads from the browser, and exports/imports save codes
//   - upgrades old saves so new features never break an existing game (migrate)
//
// Things that change every frame but don't need saving (where customers are
// walking, sparkle effects...) are NOT here; they live in HC.sim.rt
// ("runtime") in sim.js and simply restart when the page reloads.
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data } = HC;

  // ---------------------------------------------------------------------------
  // A fresh game. Each line below is one thing the game remembers.
  // ---------------------------------------------------------------------------
  function newGame() {
    const s = {
      v: 2, // save format version
      created: Date.now(),
      lastSeen: Date.now(), // when you last had the game open (for the away report)
      coins: 20,
      gems: data.GEMS.start,
      lifetime: 0, // coins earned across all festivals, ever
      runEarned: 0, // coins earned since the last festival
      ribbons: 0, // festival rewards: each is +10% sale prices forever
      festivals: 0,
      rep: 1, // reputation, 0 to 5 stars
      time: data.DAY_LENGTH * 0.12, // in-game time of day; starts in the morning
      clock: 0, // seconds the game has been running; timers count against this
      lastDay: 0, // which in-game day wages were last paid for
      playTime: 0,
      // Each hive: its upgrade level, the bees living in it, and the honey
      // waiting inside it to be collected (by product, e.g. {wildflower: 7}).
      hives: [{ level: 0, bees: [], stock: {} }],
      bees: {}, // every bee you own, looked up by its id
      box: [], // ids of spare bees not living in a hive
      store: { wildflower: 6 }, // the storehouse: product -> how many
      unlockedGoods: { wildflower: true }, // products you've made at least once
      shelves: [{ good: 'wildflower', qty: 0 }], // what each shelf sells and holds
      up: {}, // shop upgrade levels, e.g. {sign: 3}
      market: { meadow: 0, clover: 0 }, // how many bees you've bought (prices rise)
      discovered: { meadow: true }, // species in your Field Guide
      sparkleSeen: {}, // species you've had a sparkle of
      triedPairs: {}, // failed breeding attempts per pair (for the pity timer)
      nursery: [null], // breeding cradles: null = empty
      orders: [], // pinned town requests
      nextOrderAt: 90, // seconds until the next request is pinned
      merchant: null,
      nextMerchantAt: 420,
      staff: {}, // hired employees, e.g. {cashier: true}
      machine: null, // the Candle Machine once built: {level, wax, candles, prog}
      builds: [], // upgrades under construction (see builds.js)
      builders: 1, // how many things can be built at the same time
      // Cosmetics: what you own, what you're wearing/using, what's placed.
      cos: { owned: {}, equip: {}, placed: {} },
      stats: {
        sold: 0, customers: 0, disappointed: 0, walkouts: 0, bred: 0, orders: 0, best: 0,
        collected: 0, candles: 0, decor: 0, skips: 0,
      },
      hints: {}, // tutorial messages already shown
      settings: { sfx: true, music: false },
      keepsake: null,
      goal: 0, // which goal in the goal chain you're on
    };
    for (const u of data.UPGRADES) s.up[u.id] = 0;
    applyDefaultCosmetics(s);
    const a = makeBee(s, 'meadow', { vigor: 1 });
    const b = makeBee(s, 'meadow', { vigor: 0.95 });
    s.hives[0].bees.push(a.id, b.id);
    s.hives[0].stock = { wildflower: 4 }; // a little honey waiting, so the first tap does something
    return s;
  }

  // Give a game every "default" cosmetic (bandana, oak walls, display table...)
  // and equip/place them. Safe to run again on an existing save.
  function applyDefaultCosmetics(s) {
    s.cos = s.cos || { owned: {}, equip: {}, placed: {} };
    for (const item of data.CATALOG) {
      if (!item.default && !item.free) continue;
      s.cos.owned[item.id] = true;
      if (!item.default) continue;
      const section = data.STORE_SECTIONS.find((x) => x.cat === item.cat);
      if (section && section.pick) {
        if (!s.cos.equip[item.cat]) s.cos.equip[item.cat] = item.id;
      } else if (s.cos.placed[item.id] === undefined) {
        s.cos.placed[item.id] = true;
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Create a new bee of species `sp` and add it to the game.
  // `opts` can set its vigor, sparkle, trait and generation (used when an egg
  // hatches or the merchant sells one). The caller decides where it lives.
  // ---------------------------------------------------------------------------
  function makeBee(s, sp, opts = {}) {
    // Give it a name nobody else has. If all names are taken, add II, III...
    const used = new Set(Object.values(s.bees).map((b) => b.name));
    const free = data.BEE_NAMES.filter((n) => !used.has(n));
    let name = free.length ? util.pick(free) : util.pick(data.BEE_NAMES);
    for (let k = 2; used.has(name); k++) name = name.replace(/ [IVX]+$/, '') + ' ' + ['II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][Math.min(k - 2, 8)];
    const bee = {
      id: util.uid(),
      sp, // species id
      name,
      vigor: opts.vigor != null ? opts.vigor : util.rand(0.85, 1.15), // work speed; 1.0 = 100%
      sparkle: !!opts.sparkle, // rare variant: double output
      trait: opts.trait || null,
      gen: opts.gen || 1, // generation: 1 for bought bees, +1 per breeding
      prog: Math.random(), // progress towards its next unit of honey (0 to 1)
      born: Date.now(),
    };
    s.bees[bee.id] = bee;
    s.discovered[sp] = true;
    if (bee.sparkle) s.sparkleSeen[sp] = true;
    const good = data.species[sp].good;
    if (!s.unlockedGoods[good]) {
      s.unlockedGoods[good] = true;
      // A brand-new sellable product goes straight onto an empty shelf.
      const empty = s.shelves.find((sh) => !sh.good);
      if (empty && !data.good[good].raw) empty.good = good;
    }
    return bee;
  }

  // ---------------------------------------------------------------------------
  // Old saves don't have fields added by later versions (gems, staff...).
  // `migrate` starts from a fresh game and lays the old save on top of it, so
  // anything missing gets a sensible default instead of crashing the game.
  // ---------------------------------------------------------------------------
  function migrate(loaded) {
    const base = newGame();
    const s = Object.assign(base, loaded);
    s.up = Object.assign({}, newGame().up, loaded.up || {});
    s.stats = Object.assign({}, base.stats, loaded.stats || {});
    s.settings = Object.assign({ sfx: true, music: false }, loaded.settings || {});
    s.market = Object.assign({ meadow: 0, clover: 0 }, loaded.market || {});
    if (loaded.gems == null) s.gems = data.GEMS.start;
    if (loaded.clock == null) s.clock = loaded.playTime || 0;
    s.staff = loaded.staff || {};
    s.builds = loaded.builds || [];
    s.cos = loaded.cos || { owned: {}, equip: {}, placed: {} };
    applyDefaultCosmetics(s);
    // Version 1 saves: hives had no honey storage, and Waxwings made candles
    // directly. Give hives empty storage and turn old candle-making into wax.
    s.hives.forEach((h) => (h.stock = h.stock || {}));
    if ((loaded.v || 1) < 2 && s.unlockedGoods.candle && !s.machine) s.unlockedGoods.wax = true;
    s.v = 2;
    // Drop references to bees that no longer exist.
    s.hives.forEach((h) => (h.bees = h.bees.filter((id) => s.bees[id])));
    s.box = s.box.filter((id) => s.bees[id]);
    while (s.nursery.length < 1 + (s.up.nursery || 0)) s.nursery.push(null);
    while (s.shelves.length < 1 + (s.up.shelf || 0)) s.shelves.push({ good: null, qty: 0 });
    // Raw ingredients never belong on a shelf.
    s.shelves.forEach((sh) => {
      if (sh.good && data.good[sh.good] && data.good[sh.good].raw) sh.good = null;
    });
    return s;
  }

  // Turn the game into text (JSON) for saving.
  function serialize(s) {
    s.lastSeen = Date.now();
    return JSON.stringify(s);
  }

  // Turn saved text back into a game, checking it looks like one of ours.
  function deserialize(str) {
    const obj = JSON.parse(str);
    if (!obj || typeof obj !== 'object' || !obj.hives || !obj.bees) throw new Error('Not a Honeycomb Corner save');
    return migrate(obj);
  }

  // Save to this browser. Returns false if the browser refused.
  function save(s) {
    return util.store.set(data.SAVE_KEY, serialize(s));
  }

  // Load from this browser, or return null if there's no (readable) save.
  function load() {
    const raw = util.store.get(data.SAVE_KEY);
    if (!raw) return null;
    try {
      return deserialize(raw);
    } catch (e) {
      console.warn('Save could not be read, starting fresh.', e);
      return null;
    }
  }

  // A save "code" is the save text scrambled into letters and numbers
  // (base64) so it can be copied and pasted between devices.
  function exportSave(s) {
    // The extra encode step keeps accented bee names safe in the code.
    return btoa(unescape(encodeURIComponent(serialize(s))));
  }

  function importSave(code) {
    const json = decodeURIComponent(escape(atob(code.trim())));
    return deserialize(json);
  }

  HC.state = { newGame, makeBee, migrate, serialize, deserialize, save, load, exportSave, importSave, applyDefaultCosmetics };
})();

</script>
<script>
// =============================================================================
// nav.js: THE MAP OF THE SCENE, AND HOW PEOPLE WALK AROUND IT
// -----------------------------------------------------------------------------
// The game picture is 240 pixels wide and 160 tall (the Game Boy Advance's
// screen size), split into 16×16 pixel "tiles". Positions are written as
// (x, y) where x counts pixels from the left edge and y from the TOP edge
// (so a bigger y is lower down the screen).
//
// Rough layout:
//   left third  (x 0-100)   the garden with up to six hives
//   right part  (x 112-240) inside the shop: shelves along the top wall,
//                           the counter/register on the right, the storeroom
//                           crates on the left, the door at the bottom
//   bottom strip (y 144-160) the street outside
//
// The shopkeeper and staff don't wander freely. They walk between named
// spots ("nodes") joined by straight lines ("edges"), like stops on a
// train map. `route(from, to)` finds the shortest chain of stops, which
// keeps people from walking through walls, hives or the counter.
// =============================================================================
(function () {
  const HC = window.HC;

  // ---------------------------------------------------------------------------
  // Fixed positions used by the customers, the renderer and the workers.
  // ---------------------------------------------------------------------------
  const layout = {
    W: 240, H: 160, T: 16, // screen width, height, tile size

    // Customer walking lines (customers use their own simple paths):
    doorX: 152, // the door's x position
    streetY: 152, // the street customers walk along
    doorY: 136, // standing in the doorway
    insideY: 120, // just inside the door
    aisleY: 40, // the aisle in front of the shelves
    corridorX: 168, // the walkway customers use to reach the queue
    turnY: 56, // the row customers use to walk from shelves to the corridor

    // Where the register is (customers pay the person standing here).
    desk: { x: 216, y: 98 },
    // The counter itself: people standing behind it have their legs hidden.
    counter: { x: 190, y: 96, w: 47, h: 16 },
    // Shelf number i (0-7) stands along the back wall at this x.
    shelfX: (i) => (7 + i) * 16 + 8,
    // Queue spots in front of the counter. Spot 0 is first in line. The line
    // runs left along the floor, then bends upward if it gets long.
    queueSlot: (i) => (i < 3 ? { x: 216 - 16 * i, y: 120 } : { x: 184, y: 104 - 16 * (i - 3) }),
    // Hive spots in the garden, as [column, row] in 16-pixel tiles.
    hiveSlots: [[1, 1], [4, 1], [1, 4], [4, 4], [1, 7], [4, 7]],
    // The travelling merchant's wagon parks here on the street.
    wagon: { x: 40, y: 152 },
    // The request board stands outside the shop, right of the door.
    board: { x: 206, y: 150 },
    // The storeroom crates (inside, bottom-left) and Candle Machine (behind counter).
    crates: { x: 113, y: 86, w: 26, h: 22 },
    machine: { x: 204, y: 60, w: 30, h: 20 },
  };

  // ---------------------------------------------------------------------------
  // The walking network ("graph"). Each node has a position; EDGES lists
  // which pairs of nodes have a clear straight path between them.
  // ---------------------------------------------------------------------------
  const NODES = {
    DESK: { x: 216, y: 98 }, // at the register, behind the counter
    SIDE: { x: 199, y: 98 }, // behind the counter, beside the register
    BACK: { x: 182, y: 90 }, // just past the left end of the counter
    MACH: { x: 220, y: 86 }, // in front of the Candle Machine
    MID: { x: 182, y: 112 }, // open floor in the middle of the shop
    DOORIN: { x: 152, y: 112 }, // just inside the door
    STORE: { x: 134, y: 112 }, // in front of the storeroom crates
    AISLE: { x: 152, y: 40 }, // the aisle in front of the shelves
    DOOR: { x: 152, y: 136 }, // in the doorway
    STREET: { x: 152, y: 152 }, // on the street outside the door
    LANE0: { x: 48, y: 152 }, // where the garden path meets the street
    LANE3: { x: 48, y: 132 }, // garden path, level with the bottom hives
    LANE2: { x: 48, y: 84 }, // garden path, level with the middle hives
    LANE1: { x: 48, y: 36 }, // garden path, level with the top hives
  };
  const EDGES = [
    ['DESK', 'SIDE'], ['SIDE', 'BACK'], ['DESK', 'MACH'], ['MACH', 'BACK'],
    ['BACK', 'MID'], ['MID', 'DOORIN'], ['DOORIN', 'STORE'], ['DOORIN', 'AISLE'],
    ['DOORIN', 'DOOR'], ['DOOR', 'STREET'], ['STREET', 'LANE0'],
    ['LANE0', 'LANE3'], ['LANE3', 'LANE2'], ['LANE2', 'LANE1'],
  ];
  // One node in front of each shelf, reached along the aisle.
  for (let i = 0; i < 8; i++) {
    NODES['SH' + i] = { x: layout.shelfX(i), y: layout.aisleY };
    EDGES.push(['AISLE', 'SH' + i]);
  }
  // One node in front of each hive, reached from the garden path.
  const laneFor = { 36: 'LANE1', 84: 'LANE2', 132: 'LANE3' };
  layout.hiveSlots.forEach(([cx, cy], i) => {
    const front = { x: cx * 16 + 8, y: cy * 16 + 20 };
    NODES['HV' + i] = front;
    EDGES.push(['HV' + i, laneFor[front.y]]);
  });

  // Build a quick lookup: node -> list of [neighbour, distance].
  const links = {};
  for (const k of Object.keys(NODES)) links[k] = [];
  const dist = (a, b) => Math.hypot(NODES[a].x - NODES[b].x, NODES[a].y - NODES[b].y);
  for (const [a, b] of EDGES) {
    links[a].push([b, dist(a, b)]);
    links[b].push([a, dist(a, b)]);
  }

  // ---------------------------------------------------------------------------
  // route('DESK', 'HV2') returns the list of positions to walk through, not
  // including the starting spot. Uses the classic "Dijkstra" method: explore
  // outward from the start, always extending the shortest trail found so far,
  // until the destination is reached.
  // ---------------------------------------------------------------------------
  const cache = new Map();
  function route(from, to) {
    const key = from + '>' + to;
    if (cache.has(key)) return cache.get(key).map((p) => ({ x: p.x, y: p.y }));
    const best = { [from]: 0 };
    const prev = {};
    const open = new Set([from]);
    while (open.size) {
      // Pick the unexplored node with the shortest known distance.
      let cur = null;
      for (const n of open) if (cur === null || best[n] < best[cur]) cur = n;
      open.delete(cur);
      if (cur === to) break;
      for (const [nb, d] of links[cur]) {
        const nd = best[cur] + d;
        if (best[nb] === undefined || nd < best[nb]) {
          best[nb] = nd;
          prev[nb] = cur;
          open.add(nb);
        }
      }
    }
    // Walk backwards from the destination to rebuild the trail.
    const names = [];
    for (let n = to; n && n !== from; n = prev[n]) names.unshift(n);
    const pts = names.map((n) => NODES[n]);
    cache.set(key, pts);
    return pts.map((p) => ({ x: p.x, y: p.y }));
  }

  // Length in pixels of a route (used to estimate trip times).
  function routeLength(from, to) {
    let len = 0, prevPt = NODES[from];
    for (const p of route(from, to)) {
      len += Math.hypot(p.x - prevPt.x, p.y - prevPt.y);
      prevPt = p;
    }
    return len;
  }

  // Move a walker (customer or worker) along its `path` for dt seconds.
  // Returns true once it has reached the end of the path.
  function moveAlong(w, dt) {
    if (!w.path.length) return true;
    const tgt = w.path[0];
    const dx = tgt.x - w.x, dy = tgt.y - w.y;
    const d = Math.hypot(dx, dy);
    const step = w.speed * dt;
    // Face the direction of travel (used to pick the sprite).
    if (Math.abs(dx) > Math.abs(dy)) w.dir = dx > 0 ? 'right' : 'left';
    else if (d > 0.01) w.dir = dy > 0 ? 'down' : 'up';
    if (d <= step) {
      w.x = tgt.x;
      w.y = tgt.y;
      w.path.shift();
    } else {
      w.x += (dx / d) * step;
      w.y += (dy / d) * step;
    }
    w.walk += dt; // drives the walking animation
    return w.path.length === 0;
  }

  HC.layout = layout;
  HC.nav = { NODES, route, routeLength, moveAlong };
})();

</script>
<script>
// =============================================================================
// sim.js: THE HEART OF THE GAME ("simulation")
// -----------------------------------------------------------------------------
// This file decides what happens as time passes. About 20 times a second the
// game calls `update(s, dt)`, where `s` is your save (see state.js) and `dt`
// is how many seconds passed since the last call (usually 0.05). Each update:
//   1. bees add honey to their hive (until the hive is full)
//   2. the Candle Machine turns wax into candles
//   3. customers walk, shop and queue (customers.js)
//   4. the shopkeeper and staff do their jobs (workers.js)
//   5. eggs in the Nursery get closer to hatching
//   6. the town pins requests, the merchant comes and goes
//   7. timers for upgrades tick down (builds.js)
//   8. each morning, staff wages are paid
//
// It never touches the screen directly. When something noteworthy happens it
// announces it on HC.bus (see util.js) and the UI/sound react.
//
// The `f` object below holds the game's FORMULAS: small functions that
// answer questions like "how fast does this bee work?" or "how much does the
// next upgrade cost?". Other files call these, so every rule lives in one
// place.
// =============================================================================
(function () {
  const HC = window.HC;
  const { util, data, bus } = HC;
  const D = data;

  // ---------------------------------------------------------------------------
  // FORMULAS
  // ---------------------------------------------------------------------------
  const f = {
    // -- Time of day and seasons ---------------------------------------------
    // dayPhase: how far through the current day we are, 0 (dawn) to 1.
    dayPhase: (s) => (s.time % D.DAY_LENGTH) / D.DAY_LENGTH,
    // Night is the last quarter of each day (70% to 95% of the way through).
    isNight(s) {
      const p = f.dayPhase(s);
      return p >= 0.7 && p < 0.95;
    },
    // The shop only serves customers while it isn't night.
    isOpen: (s) => !f.isNight(s),
    season(s) {
      const len = D.DAY_LENGTH * D.SEASON_DAYS;
      return D.SEASONS[Math.floor(s.time / len) % 4];
    },
    seasonLeft(s) {
      const len = D.DAY_LENGTH * D.SEASON_DAYS;
      return len - (s.time % len);
    },
    day: (s) => Math.floor(s.time / D.DAY_LENGTH) + 1,

    // -- Hives ------------------------------------------------------------------
    hiveCap: (h) => 3 + h.level, // how many BEES fit in a hive
    honeyCap: (h) => 16 + 12 * h.level, // how much HONEY a hive holds before bees stop
    honeyIn(h) {
      let n = 0;
      for (const g in h.stock) n += h.stock[g];
      return n;
    },
    hiveFull: (h) => f.honeyIn(h) >= f.honeyCap(h),
    hiveCost: (s) => D.HIVE_COSTS[s.hives.length],
    hiveUpgradeCost: (s, i) => Math.ceil(100 * Math.pow(3, s.hives[i].level) * Math.pow(1 + i, 1.4)),

    // -- Shop -------------------------------------------------------------------
    upgradeCost(s, id) {
      const u = D.upgrade[id];
      return Math.ceil(u.base * Math.pow(u.growth, s.up[id] || 0));
    },
    storageCap: (s) => Math.floor(40 * (1 + 0.6 * s.up.storage)), // per product
    shelfCap: () => 6, // items per shelf
    boxCap: (s) => 10 + 4 * s.up.beebox, // spare-bee spaces
    carryCap: (s) => 12 + 8 * s.up.basket, // jars one person can carry per trip
    priceMult: (s) => (1 + 0.08 * s.up.labels) * (1 + 0.1 * s.ribbons),
    // Sale price of one item right now, including all bonuses.
    price(s, goodId, mult = 1) {
      const se = f.season(s);
      let m = mult * (1 + (se.price || 0));
      if (goodId === 'candle' && se.candle) m *= 1 + se.candle;
      return Math.max(1, Math.round(D.good[goodId].price * f.priceMult(s) * m));
    },
    // The Honey Cart sells storehouse overflow at this fraction of the price.
    cartRate: (s) => (s.up.cart ? 0.2 + 0.05 * (s.up.cart - 1) : 0),
    // Seconds for the person at the register to ring up one customer.
    checkoutTime: (s) => 1.6 * Math.pow(0.88, s.up.register),

    // -- Decorations --------------------------------------------------------------
    // Adds up one kind of bonus ('customers', 'prod' or 'rep') from every
    // placed decoration.
    decorBonus(s, key) {
      let b = 0;
      for (const id in s.cos.placed) {
        if (!s.cos.placed[id]) continue;
        const item = D.item[id];
        if (item && item.bonus && item.bonus[key]) b += item.bonus[key];
      }
      return b;
    },

    // -- Bees -------------------------------------------------------------------
    // Hive-wide multiplier: +15% per hive level, plus Nurse Bee auras.
    hiveMult(s, h) {
      let nurse = 0;
      for (const id of h.bees) {
        const sp = D.species[s.bees[id].sp];
        if (sp.aura && sp.aura.hive) nurse += sp.aura.hive;
      }
      return 1 + 0.15 * h.level + nurse;
    },
    // How many units per second one bee makes. Starts from its species' speed
    // and multiplies in vigor, sparkle, hive level, flower beds, season,
    // decorations and its trait.
    beeRate(s, bee, h, night) {
      const sp = D.species[bee.sp];
      let r = (1 / sp.secs) * bee.vigor * (bee.sparkle ? 2 : 1);
      r *= f.hiveMult(s, h) * (1 + 0.08 * s.up.flowers) * (1 + (f.season(s).prod || 0)) * (1 + f.decorBonus(s, 'prod'));
      const t = bee.trait && D.TRAITS[bee.trait];
      if (t) {
        if (t.prod) r *= 1 + t.prod;
        if (t.night && night) r *= 1 + t.night;
        if (t.day && !night) r *= 1 + t.day;
      }
      if (sp.nightBonus && night) r *= 1 + sp.nightBonus;
      return r;
    },
    // Ids of bees currently raising an egg. They rest instead of working.
    busyBees(s) {
      const busy = new Set();
      for (const n of s.nursery) if (n) busy.add(n.a).add(n.b);
      return busy;
    },
    // Units per second of each product across all hives (resting bees excluded).
    goodRates(s) {
      const night = f.isNight(s);
      const busy = f.busyBees(s);
      const out = {};
      for (const h of s.hives) {
        for (const id of h.bees) {
          if (busy.has(id)) continue;
          const bee = s.bees[id];
          const g = D.species[bee.sp].good;
          out[g] = (out[g] || 0) + f.beeRate(s, bee, h, night);
        }
      }
      return out;
    },

    // -- Customers ----------------------------------------------------------------
    // Total bonus to customer visits from the sign, season, bees and decor.
    customerBoost(s) {
      let b = 0.15 * s.up.sign + (f.season(s).customers || 0) + f.decorBonus(s, 'customers');
      for (const h of s.hives) {
        for (const id of h.bees) {
          const bee = s.bees[id];
          const sp = D.species[bee.sp];
          if (sp.aura && sp.aura.customers) b += sp.aura.customers;
          if (bee.trait === 'charming') b += D.TRAITS.charming.customers;
        }
      }
      return b;
    },
    // Average seconds between customers arriving (smaller = busier shop).
    spawnInterval: (s) => Math.max(0.8, 9 / (1 + 0.2 * s.rep) / (1 + f.customerBoost(s))),

    // -- Buying bees ------------------------------------------------------------
    marketUnlocked(s, sp) {
      if (sp === 'meadow') return true;
      if (sp === 'clover') return s.lifetime >= 150 || !!s.discovered.clover;
      return false;
    },
    marketPrice(s, sp) {
      const n = s.market[sp] || 0;
      return sp === 'meadow' ? Math.ceil(25 * Math.pow(1.2, n)) : Math.ceil(150 * Math.pow(1.22, n));
    },
    beeValue: (bee) => 20 * Math.pow(3, D.species[bee.sp].tier) * bee.vigor * (bee.sparkle ? 5 : 1),
    sellPrice: (bee) => Math.ceil(f.beeValue(bee) * 0.4),

    // -- Breeding ---------------------------------------------------------------
    maxTier: (a, b) => Math.max(D.species[a.sp].tier, D.species[b.sp].tier),
    breedCost: (a, b) => Math.ceil(40 * Math.pow(3.4, f.maxTier(a, b))),
    breedTime: (a, b) => Math.round(30 * Math.pow(1 + f.maxTier(a, b), 1.6)),

    // -- Timers and gems --------------------------------------------------------
    // How long something that costs `cost` coins takes to build, in seconds.
    // About 40s for cheap things, a few minutes mid-game, up to 4 hours for
    // the priciest late-game upgrades.
    buildTime: (cost) => util.clamp(Math.round(8 * Math.pow(Math.max(1, cost), 0.36)), 20, 4 * 3600),
    // Gems needed to finish a timer right now: 1 gem per 2 minutes left.
    gemsToSkip: (secsLeft) => Math.max(1, Math.ceil(secsLeft / D.GEMS.secsPerGem)),

    // -- Candle Machine -----------------------------------------------------------
    machineCap: (s) => D.MACHINE.capacity(s.machine ? s.machine.level : 0),
    machineUpgradeCost: (s) => Math.ceil(D.MACHINE.upgradeBase * Math.pow(D.MACHINE.upgradeGrowth, s.machine ? s.machine.level : 0)),

    // -- Staff --------------------------------------------------------------------
    wagesPerDay(s) {
      let w = 0;
      for (const id in s.staff) if (s.staff[id]) w += D.staff[id].wage;
      return w;
    },

    // -- Misc ---------------------------------------------------------------------
    beeCount: (s) => Object.keys(s.bees).length,
    hiveOf(s, beeId) {
      return s.hives.findIndex((h) => h.bees.includes(beeId));
    },
    festivalRibbons: (s) => (s.runEarned >= D.FESTIVAL_AT ? Math.floor(2 * Math.sqrt(s.runEarned / D.FESTIVAL_AT)) : 0),
    // The most valuable product currently sitting on a shelf (by tier).
    bestStockedTier(s) {
      let best = -1;
      for (const sh of s.shelves) if (sh.good && sh.qty > 0) best = Math.max(best, D.good[sh.good].tier);
      return best;
    },
  };

  // ---------------------------------------------------------------------------
  // RUNTIME: things that change constantly but aren't saved. Reloading the
  // page simply starts these fresh.
  // ---------------------------------------------------------------------------
  const rt = {
    customers: [], // everyone currently walking around (see customers.js)
    queue: [], // customers lined up at the counter, first in line first
    workers: [], // the shopkeeper and staff (see workers.js)
    fx: [], // floating "+45" numbers and similar effects
    spawnT: 4, // seconds until the next customer walks in
    income: [], // recent earnings [time, amount], for the "per min" display
    clock: 0, // seconds since the page opened
    drip: null, // a golden drop waiting to be tapped: { hive, left }
    dripT: 60,
    silent: false, // true while fast-forwarding, so we don't spam notifications
    offlineAcc: 0,
  };

  // Add coins. If x/y are given, a floating "+amount" appears there.
  function earn(s, amt, x, y) {
    if (amt <= 0) return;
    s.coins += amt;
    s.lifetime += amt;
    s.runEarned += amt;
    rt.income.push([rt.clock, amt]);
    if (x != null) rt.fx.push({ kind: 'text', x, y, text: '+' + util.fmtShort(amt), t: 0, life: 1.4 });
  }

  // Add gems and announce it (the UI shows a toast unless we're fast-forwarding).
  function gainGems(s, n, why) {
    if (n <= 0) return;
    s.gems += n;
    if (!rt.silent) bus.emit('gems', { n, why });
  }

  // Coins earned in the last minute (shown as "per min" in the status bar).
  function incomePerMin() {
    const cutoff = rt.clock - 60;
    while (rt.income.length && rt.income[0][0] < cutoff) rt.income.shift();
    let sum = 0;
    for (const [, a] of rt.income) sum += a;
    const span = Math.min(60, Math.max(10, rt.clock - (rt.income[0] ? rt.income[0][0] : rt.clock)));
    return (sum / span) * 60;
  }

  // Put `n` of product `g` into the storehouse. Anything that doesn't fit is
  // sold off cheaply by the Honey Cart if you own one, otherwise lost.
  // Returns how many actually fit.
  function addToStore(s, g, n) {
    if (n <= 0) return 0;
    s.unlockedGoods[g] = true;
    const cap = f.storageCap(s);
    const have = s.store[g] || 0;
    const put = Math.min(n, Math.max(0, cap - have));
    s.store[g] = have + put;
    const over = n - put;
    if (over > 0 && s.up.cart) earn(s, over * f.price(s, g) * f.cartRate(s));
    return put;
  }

  // Take up to `max` jars out of hive number i. Returns what was taken, e.g.
  // { wildflower: 10, clover: 2 }.
  function takeFromHive(s, i, max) {
    const h = s.hives[i];
    const got = {};
    let left = max;
    for (const g of Object.keys(h.stock)) {
      if (left <= 0) break;
      const n = Math.min(h.stock[g], left);
      if (n > 0) {
        got[g] = n;
        h.stock[g] -= n;
        left -= n;
        s.stats.collected += n;
      }
      if (h.stock[g] <= 0) delete h.stock[g];
    }
    return got;
  }

  // Move goods from the storehouse straight onto shelves. Used when
  // fast-forwarding (while you're away the shopkeeper tidies the shelves).
  function restockInstant(s) {
    const cap = f.shelfCap(s);
    for (const sh of s.shelves) {
      if (!sh.good) continue;
      const take = Math.min(cap - sh.qty, s.store[sh.good] || 0);
      if (take > 0) {
        sh.qty += take;
        s.store[sh.good] -= take;
      }
    }
  }

  // ---------------------------------------------------------------------------
  // 1. BEES MAKE HONEY
  // Each bee fills a progress bar at its own speed. When the bar fills, one
  // unit goes into its hive. A full hive stops everyone in it until someone
  // collects. Bees raising an egg in the Nursery rest.
  // ---------------------------------------------------------------------------
  function produce(s, dt) {
    const night = f.isNight(s);
    const busy = f.busyBees(s);
    for (const h of s.hives) {
      const cap = f.honeyCap(h);
      let total = f.honeyIn(h);
      for (const id of h.bees) {
        if (busy.has(id)) continue;
        const bee = s.bees[id];
        if (total >= cap) {
          bee.prog = Math.min(bee.prog, 0.999); // waiting for space
          continue;
        }
        bee.prog += f.beeRate(s, bee, h, night) * dt;
        if (bee.prog >= 1) {
          const n = Math.min(Math.floor(bee.prog), cap - total);
          bee.prog -= Math.floor(bee.prog);
          const g = D.species[bee.sp].good;
          h.stock[g] = (h.stock[g] || 0) + n;
          total += n;
          s.unlockedGoods[g] = true;
          if (total >= cap && !rt.silent) bus.emit('hiveFull', s.hives.indexOf(h));
        }
      }
    }
  }

  // ---------------------------------------------------------------------------
  // 2. THE CANDLE MACHINE
  // While it has wax inside and room for candles, it turns one wax into one
  // candle every few seconds. Candles wait inside until someone unloads them.
  // ---------------------------------------------------------------------------
  function updateMachine(s, dt) {
    const m = s.machine;
    if (!m || m.wax <= 0 || m.candles >= f.machineCap(s)) return;
    m.prog += dt / D.MACHINE.secsPerCandle(m.level);
    while (m.prog >= 1 && m.wax > 0 && m.candles < f.machineCap(s)) {
      m.prog -= 1;
      m.wax--;
      m.candles++;
      s.stats.candles++;
      s.unlockedGoods.candle = true;
    }
    if (m.wax <= 0) m.prog = 0;
  }

  // ---------------------------------------------------------------------------
  // 5. THE NURSERY
  // ---------------------------------------------------------------------------
  function updateNursery(s, dt) {
    s.nursery.forEach((slot, i) => {
      if (!slot || slot.ready) return;
      slot.t += dt * (1 + (f.season(s).breed || 0)); // autumn hatches faster
      if (slot.t >= slot.dur) {
        slot.ready = true;
        if (!rt.silent) bus.emit('eggReady', i);
        bus.emit('dirty');
      }
    });
  }

  // Decide what hatches from parents a and b. Returns the new bee's details.
  function decideEgg(s, a, b) {
    let sp;
    const key = [a.sp, b.sp].sort().join('+');
    const recipe = D.recipeFor(a.sp, b.sp);
    if (a.sp === b.sp) sp = a.sp;
    else if (recipe) {
      const fails = s.triedPairs[key] || 0;
      // "Pity timer": after 4 misses in a row the new species is guaranteed.
      if (fails >= 4 || Math.random() < recipe.p) {
        sp = recipe.out;
        s.triedPairs[key] = 0;
      } else {
        sp = Math.random() < 0.5 ? a.sp : b.sp;
        s.triedPairs[key] = fails + 1;
      }
    } else sp = Math.random() < 0.5 ? a.sp : b.sp;

    // Vigor: the parents' average, nudged randomly, with a small upward bias
    // (a bigger one when both parents are the same species).
    let vigor = (a.vigor + b.vigor) / 2 + util.gauss() * 0.07 + 0.015 + (a.sp === b.sp ? 0.03 : 0);
    vigor = util.clamp(vigor, 0.5, 2.5);

    // Sparkle chance: 1 in 80, tripled by a Lucky parent, doubled by a sparkle parent.
    let sparkleP = 1 / 80;
    if (a.trait === 'lucky' || b.trait === 'lucky') sparkleP *= D.TRAITS.lucky.lucky;
    if (a.sparkle || b.sparkle) sparkleP *= 2;

    // Traits are sometimes inherited, sometimes rolled fresh.
    let trait = null;
    if (a.trait && Math.random() < 0.35) trait = a.trait;
    else if (b.trait && Math.random() < 0.35) trait = b.trait;
    else if (Math.random() < 0.25) trait = util.pick(Object.keys(D.TRAITS));

    return { sp, vigor, sparkle: Math.random() < sparkleP, trait, gen: Math.max(a.gen, b.gen) + 1 };
  }

  // ---------------------------------------------------------------------------
  // 6. THE TOWN: requests and the travelling merchant
  // ---------------------------------------------------------------------------
  // Create a request for something you actually make, sized to roughly two
  // or three minutes of your production of it.
  function makeOrder(s) {
    const rates = f.goodRates(s);
    const goods = D.GOODS.filter((g) => s.unlockedGoods[g.id] && !g.raw);
    if (!goods.length) return null;
    const g = util.weighted(goods, (x) => (rates[x.id] || x.id === 'candle' ? 3 + x.tier : 0.5));
    const rate = Math.max(rates[g.id] || (g.id === 'candle' ? rates.wax : 0) || 0, 0.04);
    const qty = util.clamp(Math.round(rate * util.rand(100, 200)), 4, 999);
    return {
      id: util.uid(),
      who: util.pick(D.REQUESTERS),
      good: g.id,
      qty,
      reward: Math.ceil(qty * f.price(s, g.id) * 2.5),
      gems: Math.random() < D.GEMS.orderChance ? util.randInt(D.GEMS.orderMin, D.GEMS.orderMax) : 0,
      left: util.rand(480, 900), // seconds until it expires
    };
  }

  function makeMerchantOffer(s) {
    const pool = D.SPECIES.filter((sp) => s.discovered[sp.id] && sp.id !== 'meadow').map((sp) => sp.id);
    // Sometimes the merchant carries the next species you haven't found yet.
    const next = D.RECIPES.filter((r) => s.discovered[r.a] && s.discovered[r.b] && !s.discovered[r.out]).map((r) => r.out);
    let sp;
    if (next.length && Math.random() < 0.2) sp = util.pick(next);
    else sp = pool.length ? util.pick(pool) : 'clover';
    const offer = {
      sp,
      vigor: util.rand(1.1, 1.35),
      sparkle: Math.random() < 0.08,
      trait: Math.random() < 0.5 ? util.pick(Object.keys(D.TRAITS)) : null,
    };
    offer.price = Math.ceil(f.beeValue(offer) * 6);
    return offer;
  }

  // Pin a request on the board. Normally a townsperson walks up and pins it
  // (customers.js); while fast-forwarding it just appears.
  function pinOrder(s, o) {
    s.orders.push(o);
    if (!rt.silent) bus.emit('order', o);
    bus.emit('dirty');
  }

  function updateTown(s, dt) {
    s.nextOrderAt -= dt;
    if (s.nextOrderAt <= 0) {
      s.nextOrderAt = util.rand(90, 160);
      const pending = rt.customers.filter((c) => c.kind === 'requester').length;
      if (s.orders.length + pending < 3) {
        const o = makeOrder(s);
        if (o) {
          if (rt.silent || !HC.customers) pinOrder(s, o);
          else HC.customers.spawnRequester(s, o);
        }
      }
    }
    for (const o of s.orders) o.left -= dt;
    const before = s.orders.length;
    s.orders = s.orders.filter((o) => o.left > 0);
    if (s.orders.length !== before) bus.emit('dirty');

    if (s.merchant) {
      s.merchant.left -= dt;
      if (s.merchant.left <= 0) {
        s.merchant = null;
        bus.emit('merchantLeft');
        bus.emit('dirty');
      }
    } else {
      s.nextMerchantAt -= dt;
      if (s.nextMerchantAt <= 0 && s.lifetime > 150) {
        s.nextMerchantAt = util.rand(360, 720);
        s.merchant = { left: 90, offer: makeMerchantOffer(s) };
        if (!rt.silent) bus.emit('merchant', s.merchant);
        bus.emit('dirty');
      }
    }
  }

  // Golden drips: a bonus that appears on a random hive every minute or two.
  function updateDrip(s, dt) {
    if (rt.drip) {
      rt.drip.left -= dt;
      if (rt.drip.left <= 0) rt.drip = null;
      return;
    }
    rt.dripT -= dt;
    if (rt.dripT <= 0) {
      rt.dripT = util.rand(70, 140);
      rt.drip = { hive: util.randInt(0, s.hives.length - 1), left: 12 };
      bus.emit('drip');
    }
  }

  // Tapping a drip pays about half a minute of recent income (at least 25),
  // with a small chance of a gem too.
  function claimDrip(s) {
    if (!rt.drip) return 0;
    const [cx, cy] = HC.layout.hiveSlots[rt.drip.hive];
    const amt = Math.max(25, Math.round(incomePerMin() * 0.5));
    rt.drip = null;
    earn(s, amt, cx * 16 + 8, cy * 16 - 2);
    if (Math.random() < D.GEMS.dripChance) gainGems(s, 1, 'a golden drip');
    return amt;
  }

  // A new season brings a few gems.
  let lastSeason = null;
  function updateSeason(s) {
    const se = f.season(s);
    if (lastSeason && lastSeason !== se.id) {
      gainGems(s, D.GEMS.seasonChange, se.name + ' arriving');
      if (!rt.silent) bus.emit('season', se);
    }
    lastSeason = se.id;
  }

  // ---------------------------------------------------------------------------
  // 8. WAGES: paid once each new in-game day. If you can't afford everyone,
  // the most expensive employees quit until the rest can be paid.
  // ---------------------------------------------------------------------------
  function updateWages(s) {
    const day = Math.floor(s.time / D.DAY_LENGTH);
    if (day <= s.lastDay) return;
    s.lastDay = day;
    const hired = Object.keys(s.staff).filter((id) => s.staff[id]).sort((a, b) => D.staff[b].wage - D.staff[a].wage);
    let owed = hired.reduce((t, id) => t + D.staff[id].wage, 0);
    for (const id of hired) {
      if (s.coins >= owed) break;
      s.staff[id] = false;
      owed -= D.staff[id].wage;
      if (HC.workers) HC.workers.sync(s);
      if (!rt.silent) bus.emit('staffQuit', D.staff[id]);
      bus.emit('dirty');
    }
    if (owed > 0) {
      s.coins -= owed;
      if (!rt.silent) bus.emit('wagesPaid', owed);
    }
  }

  function updateFx(dt) {
    for (const e of rt.fx) e.t += dt;
    rt.fx = rt.fx.filter((e) => e.t < e.life);
  }

  // ---------------------------------------------------------------------------
  // THE MAIN UPDATE: called about 20 times a second while the game is open.
  // ---------------------------------------------------------------------------
  function update(s, dt) {
    rt.clock += dt;
    s.time += dt;
    s.clock += dt;
    s.playTime += dt;
    produce(s, dt);
    updateMachine(s, dt);
    if (HC.customers) HC.customers.update(s, dt);
    if (HC.workers) HC.workers.update(s, dt);
    updateNursery(s, dt);
    updateTown(s, dt);
    updateDrip(s, dt);
    updateSeason(s);
    updateWages(s);
    if (HC.builds) HC.builds.update(s);
    updateFx(dt);
  }

  // ---------------------------------------------------------------------------
  // FAST-FORWARD for time spent away (tab closed, phone locked).
  // Walking every step would be slow, so this uses shortcuts:
  //   - bees fill their hives as normal (so hives cap out if nobody collects)
  //   - a hired Honey Collector moves honey at about one basket per 30s
  //   - the shopkeeper keeps the shelves stocked from the storehouse
  //   - while the shop is open, customers buy at 60% of the live rate
  //   - a hired Candle Maker keeps the machine running
  //   - timers, eggs, requests and wages all progress
  // Production and sales stop after OFFLINE_CAP (8 hours); timers keep going.
  // Returns a summary for the "While you were away" report.
  // ---------------------------------------------------------------------------
  function catchUp(s, seconds) {
    const active = Math.min(seconds, D.OFFLINE_CAP);
    const start = {
      coins: s.coins, sold: s.stats.sold, collected: s.stats.collected,
      store: Object.assign({}, s.store), orders: new Set(s.orders.map((o) => o.id)),
      season: f.season(s).id, gems: s.gems,
    };
    rt.silent = true;
    const step = 2;
    let left = active;
    while (left > 0) {
      const dt = Math.min(step, left);
      left -= dt;
      s.time += dt;
      s.clock += dt;
      produce(s, dt);
      updateMachine(s, dt);
      if (s.staff.collector) offlineCollect(s, dt);
      if (s.staff.candler && s.machine) offlineTend(s);
      restockInstant(s);
      if (f.isOpen(s)) instantCustomers(s, dt, 0.6);
      updateNursery(s, dt);
      updateTown(s, dt);
      updateSeason(s);
      updateWages(s);
      if (HC.builds) HC.builds.update(s);
    }
    // Any time beyond the 8-hour cap still counts for timers.
    if (seconds > active) {
      s.time += seconds - active;
      s.clock += seconds - active;
      updateWages(s);
      if (HC.builds) HC.builds.update(s);
    }
    rt.silent = false;
    lastSeason = f.season(s).id;
    const made = {};
    for (const g of Object.keys(s.store)) {
      const d = (s.store[g] || 0) - (start.store[g] || 0);
      if (d) made[g] = d;
    }
    return {
      seconds, made,
      coins: s.coins - start.coins,
      sold: s.stats.sold - start.sold,
      collected: s.stats.collected - start.collected,
      gems: s.gems - start.gems,
      fullHives: s.hives.map((h, i) => (f.hiveFull(h) ? i : -1)).filter((i) => i >= 0),
      newOrders: s.orders.filter((o) => !start.orders.has(o.id)).length,
      eggs: s.nursery.filter((n) => n && n.ready).length,
      merchant: !!s.merchant,
      season: f.season(s).id !== start.season ? f.season(s) : null,
    };
  }

  // While away: the collector moves roughly one basket every 30 seconds,
  // always from the fullest hive.
  function offlineCollect(s, dt) {
    rt.offlineCarry = (rt.offlineCarry || 0) + (f.carryCap(s) / 30) * dt;
    while (rt.offlineCarry >= 1) {
      const i = s.hives.reduce((bi, h, k) => (f.honeyIn(h) > f.honeyIn(s.hives[bi]) ? k : bi), 0);
      if (f.honeyIn(s.hives[i]) <= 0) {
        rt.offlineCarry = 0;
        break;
      }
      const want = Math.floor(rt.offlineCarry);
      const got = takeFromHive(s, i, want);
      let n = 0;
      for (const g in got) {
        addToStore(s, g, got[g]);
        n += got[g];
      }
      rt.offlineCarry -= Math.max(n, 1);
    }
  }

  // While away: the Candle Maker keeps wax going in and candles coming out.
  function offlineTend(s) {
    const m = s.machine;
    // Move only as many candles as the storehouse has room for; the rest wait.
    const space = Math.max(0, f.storageCap(s) - (s.store.candle || 0));
    const move = Math.min(m.candles, space);
    if (move > 0) {
      addToStore(s, 'candle', move);
      m.candles -= move;
    }
    const room = f.machineCap(s) - m.wax - m.candles;
    const wax = Math.min(room, s.store.wax || 0);
    if (wax > 0) {
      m.wax += wax;
      s.store.wax -= wax;
    }
  }

  // Offline customers skip walking and buy instantly.
  function instantCustomers(s, dt, efficiency) {
    rt.offlineAcc += (dt / f.spawnInterval(s)) * efficiency;
    while (rt.offlineAcc >= 1) {
      rt.offlineAcc -= 1;
      if (HC.customers) HC.customers.instantSale(s);
    }
  }

  // Clear everything that isn't saved (after fast-forwarding or a festival).
  // Anything a worker was carrying is put in the storehouse first.
  function resetRuntime() {
    if (HC.workers && HC.game) HC.workers.dropAll(HC.game);
    rt.customers = [];
    rt.queue = [];
    rt.fx = [];
    rt.spawnT = 3;
    rt.income = [];
    rt.drip = null;
    rt.dripT = 60;
    rt.workers = [];
    if (HC.workers && HC.game) HC.workers.sync(HC.game);
  }

  HC.sim = {
    f, rt, update, catchUp, resetRuntime, earn, gainGems, addToStore, takeFromHive, restockInstant,
    decideEgg, makeOrder, makeMerchantOffer, pinOrder, incomePerMin, claimDrip, produce,
  };
})();
