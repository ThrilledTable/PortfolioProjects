<script>
// Pixel art. Everything is drawn from code or tiny character grids: no image
// files, no third-party art. Sprites are cached as offscreen canvases.
(function () {
  const HC = window.HC;
  const D = HC.data;
  const cache = new Map();

  const INK = '#2b1d14';

  function canvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  function cached(key, build) {
    if (!cache.has(key)) cache.set(key, build());
    return cache.get(key);
  }

  // Draw a character grid: each char maps to a palette colour, '.' is clear.
  function drawGrid(ctx, rows, pal, ox = 0, oy = 0, flip = false) {
    const w = rows[0].length;
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const col = pal[row[x]];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(ox + (flip ? w - 1 - x : x), oy + y, 1, 1);
      }
    });
  }

  function gridCanvas(rows, pal, flip) {
    const c = canvas(rows[0].length, rows.length);
    drawGrid(c.getContext('2d'), rows, pal, 0, 0, flip);
    return c;
  }

  // ---- Characters (16 wide, 20 tall with headroom for hats) --------------
  const HEAD_FRONT = [
    '................',
    '....kkkkkkkk....',
    '...khhhhhhhhk...',
    '..khhhhhhhhhhk..',
    '..khHhhhhhhHhk..',
    '..kHssssssssHk..',
    '..kssksssskssk..',
    '..kssksssskssk..',
    '...kssssssssk...',
    '....kkSSSSkk....',
  ];
  const HEAD_BACK = [
    '................',
    '....kkkkkkkk....',
    '...khhhhhhhhk...',
    '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..',
    '..khhhhhhhhhhk..',
    '..kHhhhhhhhhHk..',
    '..kHHhhhhhhHHk..',
    '...kHHHHHHHHk...',
    '....kkSSSSkk....',
  ];
  const HEAD_SIDE = [
    '................',
    '.....kkkkkkk....',
    '....khhhhhhhk...',
    '...khhhhhhhhhk..',
    '...khhhhhhHHhk..',
    '...kssshhhhHHk..',
    '...ksksshhhHHk..',
    '..ksssssshhhk...',
    '...kssssssHk....',
    '....kkSSSkk.....',
  ];
  const BODY_FRONT = [
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksuUUUUUUusk..', '...kkeeeeeekk...', '....kek..kek....', '....kk....kk....'],
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksuUUUUUUusk..', '...kkeeeeeekk...', '....kek..kkk....', '....kk..........'],
  ];
  const BODY_BACK = [
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksUUUUUUUUsk..', '...kkeeeeeekk...', '....kek..kek....', '....kk....kk....'],
    ['...kuuuuuuuuk...', '..ksuuuuuuuusk..', '..ksUUUUUUUUsk..', '...kkeeeeeekk...', '....kek..kkk....', '....kk..........'],
  ];
  const BODY_SIDE = [
    ['....kuuuuuk.....', '....kuuuusk.....', '....kUUUUsk.....', '....kkeeekk.....', '....kek.kek.....', '....kk..kk......'],
    ['....kuuuuuk.....', '....kuuuusk.....', '....kUUUUsk.....', '....kkeeek......', '.....keeek......', '.....kkkk.......'],
  ];

  function charPalette(look) {
    return {
      k: INK, h: look.hair[0], H: look.hair[1], s: look.skin[0], S: look.skin[1],
      u: look.shirt[0], U: look.shirt[1], e: '#4a3a5a', w: '#fff8e8',
    };
  }

  function drawHat(ctx, hat, dir) {
    const side = dir === 'left' || dir === 'right';
    const px = (x, y, w, h, c) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, y, w, h);
    };
    if (hat === 'cap') {
      px(4, 5, 8, 2, '#3a6a2a');
      px(3, 5, 1, 2, INK); px(12, 5, 1, 2, INK); px(4, 4, 8, 1, INK);
      if (dir === 'down') px(3, 7, 10, 1, '#2a4a1e');
      if (side) px(1, 7, 5, 1, '#2a4a1e');
    } else if (hat === 'chef') {
      px(4, 0, 8, 6, '#fbf8f0');
      px(3, 1, 1, 4, INK); px(12, 1, 1, 4, INK); px(4, 0, 8, 1, INK);
      px(4, 5, 8, 1, '#d8d0c0');
    } else if (hat === 'tophat') {
      px(5, 0, 6, 5, '#2a2232');
      px(5, 3, 6, 1, '#8a2a3a');
      px(3, 5, 10, 1, '#2a2232');
      px(4, 0, 1, 5, INK); px(11, 0, 1, 5, INK);
    } else if (hat === 'beret') {
      px(3, 4, 9, 2, '#b03a78');
      px(4, 3, 7, 1, '#b03a78');
      px(10, 2, 1, 1, INK);
      px(3, 3, 1, 1, INK); px(12, 4, 1, 1, INK);
    } else if (hat === 'bandana') {
      px(3, 5, 10, 2, '#e8a020');
      px(3, 6, 10, 1, '#b87818');
    }
  }

  // dir: down/up/left/right; frame 0..3 walk cycle
  function character(look, dir, frame) {
    const key = ['ch', look.hair, look.skin, look.shirt, look.hat, dir, frame].join('|');
    return cached(key, () => {
      const c = canvas(16, 20);
      const ctx = c.getContext('2d');
      const pal = charPalette(look);
      const step = frame === 1 ? 1 : 0; // frames 1 and 3 use the stepping legs
      const flip = frame === 3;
      let head, body, hflip = false;
      if (dir === 'down') { head = HEAD_FRONT; body = BODY_FRONT[step]; }
      else if (dir === 'up') { head = HEAD_BACK; body = BODY_BACK[step]; }
      else { head = HEAD_SIDE; body = BODY_SIDE[frame === 1 || frame === 3 ? 1 : 0]; hflip = dir === 'right'; }
      const rows = head.concat(body);
      const tmp = gridCanvas(rows, pal, hflip !== (flip && (dir === 'down' || dir === 'up')));
      const bob = frame === 1 || frame === 3 ? 1 : 0;
      ctx.drawImage(tmp, 0, 4 + bob);
      if (look.hat) {
        ctx.save();
        ctx.translate(0, bob);
        if (hflip) {
          ctx.translate(16, 0);
          ctx.scale(-1, 1);
        }
        drawHat(ctx, look.hat, dir);
        ctx.restore();
      }
      if (look.apron && dir !== 'up') {
        ctx.fillStyle = look.apron;
        ctx.fillRect(dir === 'down' ? 5 : 5, 15 + bob, dir === 'down' ? 6 : 4, 2);
      }
      return c;
    });
  }

  // ---- Bees -----------------------------------------------------------------
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((t - r) * p + r);
    g = Math.round((t - g) * p + g);
    b = Math.round((t - b) * p + b);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  function mix(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (n, sh) => (n >> sh) & 255;
    const m = (sh) => Math.round(ch(pa, sh) + (ch(pb, sh) - ch(pa, sh)) * k);
    return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
  }

  // Sparkle variants keep the species' colours with a rose-gold sheen, so a
  // sparkle Moonmoth still reads as a Moonmoth.
  function sparklePalette(sp) {
    return { body: mix(sp.body, '#ffc8dc', 0.45), stripe: mix(sp.stripe, '#b0306a', 0.35), wing: '#ffe6f2' };
  }

  function beePortrait(spId, sparkle) {
    return cached('bee|' + spId + '|' + !!sparkle, () => {
      const sp = D.species[spId];
      const col = sparkle ? sparklePalette(sp) : { body: sp.body, stripe: sp.stripe, wing: sp.wing };
      const N = 16;
      const px = Array.from({ length: N }, () => Array(N).fill(null));
      const set = (x, y, c) => {
        if (x >= 0 && y >= 0 && x < N && y < N) px[y][x] = c;
      };
      const shp = Object.assign({ rx: 4.7, ry: 3.3, wing: 'round', stripes: 'double' }, sp.shape || {});
      // Wings (behind the body); each style gives a distinct silhouette
      const inWing = (x, y) => {
        const e = (cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
        const d = (cx, cy, a, b) => Math.abs(x - cx) / a + Math.abs(y - cy) / b <= 1;
        switch (shp.wing) {
          case 'small': return e(7.5, 5.5, 2.1, 2.4) || e(10.5, 6, 1.8, 2.1);
          case 'long': return e(9, 4.2, 4.3, 2.1) || e(12, 5.6, 3.2, 1.8);
          case 'moth': return e(7, 4.6, 3.5, 4) || e(11.6, 5.4, 3.1, 3.4);
          case 'angular': return d(7.5, 4, 2.8, 3.8) || d(11.5, 4.8, 2.4, 3.2);
          default: return e(7.5, 4.5, 2.6, 3.3) || e(11, 5, 2.2, 2.8);
        }
      };
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (inWing(x, y)) set(x, y, col.wing);
      // Wing detail
      const vein = shade(col.wing, -0.18);
      if (shp.wing === 'moth') {
        set(6, 4, col.stripe); set(11, 5, col.stripe); set(7, 3, vein); set(12, 4, vein);
      } else if (shp.wing === 'angular') {
        set(7, 3, '#ffffff'); set(8, 4, vein); set(11, 4, '#ffffff');
      } else {
        set(8, 4, vein); set(11, 5, vein);
      }
      // Abdomen with a species stripe pattern
      const bands = {
        double: (x) => x === 8 || x === 9 || x === 12 || x === 13,
        triple: (x) => x === 7 || x === 10 || x === 13,
        single: (x) => x === 10 || x === 11,
        spots: (x, y) => (x + y) % 4 === 0,
      }[shp.stripes];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (((x - (5.1 + shp.rx)) / shp.rx) ** 2 + ((y - 10.2) / shp.ry) ** 2 <= 1) {
          set(x, y, bands(x, y) ? col.stripe : col.body);
        }
      }
      // Highlight on the abdomen
      set(7, 11 - Math.round(shp.ry), shade(col.body, 0.5)); set(10, 11 - Math.round(shp.ry), shade(col.body, 0.5));
      // Head
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (((x - 4) / 2.7) ** 2 + ((y - 10.3) / 2.6) ** 2 <= 1) set(x, y, shade(col.stripe, 0.12));
      }
      // Stinger
      set(15, 10, INK);
      // Legs
      set(7, 14, INK); set(10, 14, INK);
      // Outline pass
      const out = px.map((r) => r.slice());
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (px[y][x]) continue;
        const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => px[y + dy] && px[y + dy][x + dx] && px[y + dy][x + dx] !== INK);
        if (nb) out[y][x] = INK;
      }
      // Eye and antennae go on top of the outline
      out[9][3] = '#fffdf4';
      out[10][3] = INK;
      out[9][2] = '#fffdf4';
      out[7][3] = INK; out[6][2] = INK; out[5][2] = INK; out[4][1] = INK;
      out[7][5] = INK; out[6][5] = INK; out[5][6] = INK;
      if (sp.shape && sp.shape.feathery) {
        out[4][0] = INK; out[5][1] = INK; out[4][6] = INK; out[4][7] = INK; out[5][7] = INK;
      }

      const c = canvas(N, N);
      const ctx = c.getContext('2d');
      out.forEach((row, y) => row.forEach((cl, x) => {
        if (!cl) return;
        ctx.fillStyle = cl;
        ctx.fillRect(x, y, 1, 1);
      }));
      drawMark(ctx, sp.mark, col);
      if (sparkle) {
        ctx.fillStyle = '#fff6b0';
        [[1, 1], [14, 2], [13, 14], [0, 13]].forEach(([x, y]) => {
          ctx.fillRect(x, y, 1, 1);
        });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(14, 1, 1, 1);
        ctx.fillRect(1, 0, 1, 1);
      }
      return c;
    });
  }

  function drawMark(ctx, mark, col) {
    const p = (x, y, c) => {
      ctx.fillStyle = c;
      ctx.fillRect(x, y, 1, 1);
    };
    switch (mark) {
      case 'crown':
        ['#f8d030', '#f8d030', '#f8d030'].forEach((c, i) => p(2 + i * 2, 6, c));
        for (let x = 2; x <= 6; x++) p(x, 7, '#f8d030');
        p(4, 6, '#e84a4a');
        break;
      case 'leaf':
        p(1, 3, '#4c9a3c'); p(2, 3, '#6ac050'); p(1, 2, '#6ac050');
        break;
      case 'drop':
        p(11, 11, '#fff6d8'); p(11, 12, '#fff6d8');
        break;
      case 'flower':
        p(1, 3, '#ffffff'); p(0, 4, '#ffffff'); p(2, 4, '#ffffff'); p(1, 5, '#ffffff'); p(1, 4, '#f8c838');
        break;
      case 'moon':
        p(1, 1, '#fff4c0'); p(2, 1, '#fff4c0'); p(0, 2, '#fff4c0'); p(0, 3, '#fff4c0'); p(1, 4, '#fff4c0'); p(2, 4, '#fff4c0');
        break;
      case 'gem':
        p(11, 11, '#ffffff'); p(10, 10, '#ffffff'); p(12, 12, shade(col.body, 0.6));
        break;
      case 'star':
        p(1, 2, '#fff6a0'); p(0, 3, '#fff6a0'); p(1, 3, '#ffffff'); p(2, 3, '#fff6a0'); p(1, 4, '#fff6a0');
        p(14, 13, '#fff6a0');
        break;
      case 'band':
        for (let y = 8; y <= 12; y++) p(3, y, '#3a5a8a');
        break;
      case 'cross':
        p(11, 9, '#ffffff'); p(10, 10, '#ffffff'); p(11, 10, '#ffffff'); p(12, 10, '#ffffff'); p(11, 11, '#ffffff');
        break;
    }
  }

  // ---- Product icons (8x8) -----------------------------------------------
  const ICONS = {
    jar: ['..kkkk..', '..kLLk..', '.kkkkkk.', 'kxFFFFxk', 'kxFwwFFk', 'kFFwwFFk', 'kFFFFFFk', '.kkkkkk.'],
    candle: ['...o....', '...y....', '..kkk...', '..kFk...', '..kFk...', '..kFk...', '.kkkkk..', '.kLLLk..'],
    pot: ['........', '.kkkkkk.', 'kLLLLLLk', 'kkkkkkkk', 'kFFwFFFk', 'kFFFFFFk', '.kFFFFk.', '..kkkk..'],
    vial: ['...kk...', '...LL...', '..kkkk..', '..kxFk..', '.kxFFFk.', '.kFFFFk.', '.kFFFFk.', '..kkkk..'],
    comb: ['..kkkk..', '.kxxFFk.', 'kxFFkFFk', 'kFFkkkFk', 'kFkFFkFk', 'kFFkkFFk', '.kFFFFk.', '..kkkk..'],
  };

  function goodIcon(goodId) {
    return cached('good|' + goodId, () => {
      const g = D.good[goodId];
      const pal = { k: INK, F: g.fill, L: g.lid, x: shade(g.fill, 0.55), w: shade(g.fill, 0.7), o: '#f06a20', y: '#ffd850' };
      return gridCanvas(ICONS[g.kind], pal);
    });
  }

  const MISC = {
    coin: ['..kkkk..', '.kywyyk.', 'kywyyyok', 'kyyoyyok', 'kyyoyyok', 'kyyyyyok', '.kyyook.', '..kkkk..'],
    star: ['...kk...', '...yk...', 'kkkyykkk', 'kyyyyyok', '.kyyyok.', '.kyokyk.', 'kyok.kok', 'kkk...kk'],
    starEmpty: ['...kk...', '...gk...', 'kkkggkkk', 'kgggggGk', '.kgggGk.', '.kgGkgk.', 'kgGk.kGk', 'kkk...kk'],
    heart: ['........', '.kk.kk..', 'kppkppk.', 'kpwppp k', 'kppppp k', '.kpppk..', '..kpk...', '...k....'],
    sun: ['...y....', '.y.y.y..', '..yyy...', 'yyyyyyy.', '..yyy...', '.y.y.y..', '...y....', '........'],
    moon: ['..kkk...', '.kmmk...', 'kmmk....', 'kmmk....', 'kmmk....', 'kmmmk...', '.kmmmkk.', '..kkk...'],
    egg: ['..kkk...', '.kwwwk..', 'kwwwwwk.', 'kwpwwwk.', 'kwwwpwk.', 'kwwwwwk.', '.kwwwk..', '..kkk...'],
    ribbon: ['.kkkkk..', 'krrrrrk.', 'krryrrk.', 'krrrrrk.', '.krrrk..', '.krkrk..', 'krk.krk.', 'kk...kk.'],
  };
  const MISC_PAL = { k: INK, y: '#f8c838', o: '#d8861e', w: '#fff4c0', g: '#d8c8a8', G: '#b8a888', p: '#e8506a', m: '#e8e0ff', r: '#d84a4a' };

  function misc(name) {
    return cached('misc|' + name, () => gridCanvas(MISC[name].map((r) => r.replace(/ /g, '.')), MISC_PAL));
  }

  // ---- Hive (16x16) ------------------------------------------------------
  const HIVE = [
    '................',
    '..kkkkkkkkkkkk..',
    '.krrrrrrrrrrrrk.',
    'kRRRRRRRRRRRRRRk',
    '.kkkkkkkkkkkkkk.',
    '.kttttttttttttk.',
    '.knnnnnnnnnnnnk.',
    '.kttttttttttttk.',
    '.kkkkkkkkkkkkkk.',
    '.kttttttttttttk.',
    '.knnnnnnnnnnnnk.',
    '.ktttttkktttttk.',
    '.kkkkkkkkkkkkkk.',
    '..kbk......kbk..',
    '..kbk......kbk..',
    '..kkk......kkk..',
  ];
  const ROOFS = ['#c8642a', '#d8902a', '#b84a5a', '#8a5ab8', '#3a8a8a', '#e8b830'];

  function hive(level) {
    return cached('hive|' + level, () => {
      const r = ROOFS[level] || ROOFS[0];
      return gridCanvas(HIVE, { k: INK, r, R: shade(r, -0.25), t: '#e8c888', n: '#c89858', b: '#7a4a22' });
    });
  }

  // ---- 3x5 bitmap font for in-scene numbers ------------------------------
  const GLYPHS = {
    0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111',
    4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001010010010',
    8: '111101111101111', 9: '111101111001111', '+': '000010111010000', '-': '000000111000000',
    '.': '000000000000010', K: '101101110101101', M: '101111111101101', B: '110101110101110',
    T: '111010010010010', '!': '010010010000010', '?': '111001010000010', ' ': '000000000000000',
    Z: '111001010100111', z: '000111001010111',
  };

  function drawText(ctx, str, x, y, color = '#fff8e0', outline = INK) {
    const width = str.length * 4 - 1;
    const ox = Math.round(x - width / 2);
    const oy = Math.round(y);
    const pass = (c, dx, dy) => {
      ctx.fillStyle = c;
      for (let i = 0; i < str.length; i++) {
        const g = GLYPHS[str[i]];
        if (!g) continue;
        for (let p = 0; p < 15; p++) {
          if (g[p] === '1') ctx.fillRect(ox + i * 4 + (p % 3) + dx, oy + Math.floor(p / 3) + dy, 1, 1);
        }
      }
    };
    if (outline) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) pass(outline, dx, dy);
    pass(color, 0, 0);
  }

  // DOM helpers: data URLs so the same pixel art appears in menus.
  const urlCache = new Map();
  function url(key, make) {
    if (!urlCache.has(key)) urlCache.set(key, make().toDataURL());
    return urlCache.get(key);
  }

  HC.spr = {
    INK, canvas, shade, character, beePortrait, goodIcon, misc, hive, drawText, drawGrid, gridCanvas,
    beeURL: (sp, sparkle) => url('b' + sp + sparkle, () => beePortrait(sp, sparkle)),
    goodURL: (g) => url('g' + g, () => goodIcon(g)),
    miscURL: (n) => url('m' + n, () => misc(n)),
    hiveURL: (lv) => url('h' + lv, () => hive(lv)),
    sparklePalette,
  };
})();

<script>
// Scene renderer: draws the garden, shop, customers and effects to a 240x160
// canvas that CSS scales up with crisp pixels.
(function () {
  const HC = window.HC;
  const { util, data: D, spr, layout: L } = HC;
  const INK = spr.INK;

  let ctx, cvs, flowers;
  const staticLayers = {};
  const KEEPER_LOOK = { hair: ['#6a3e1e', '#4a2a12'], skin: ['#f8c898', '#d89868'], shirt: ['#f4f0e0', '#d0c8b0'], hat: 'bandana', apron: '#e8a020' };
  const MERCHANT_LOOK = { hair: ['#d8d0c8', '#a8a098'], skin: ['#e0a878', '#b87c50'], shirt: ['#6a4a9a', '#4a3070'], hat: 'tophat' };
  const FLOWER_COLS = ['#f07898', '#ffffff', '#b890e8', '#f8d030', '#f06a4a', '#80c8f0'];

  function init(canvasEl) {
    cvs = canvasEl;
    ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    flowers = buildFlowers();
  }

  // ---- Static background ---------------------------------------------------
  function staticFor(season) {
    if (!staticLayers[season.id]) staticLayers[season.id] = buildStatic(season);
    return staticLayers[season.id];
  }

  function buildStatic(season) {
    const [grass, grassDark, grassLight, tuft] = season.grass;
    const winter = season.id === 'winter';
    const c = spr.canvas(L.W, L.H);
    const g = c.getContext('2d');
    const rnd = util.seeded(7);
    const rect = (x, y, w, h, col) => {
      g.fillStyle = col;
      g.fillRect(x, y, w, h);
    };

    // Garden grass
    rect(0, 0, 112, 144, grass);
    for (let i = 0; i < 520; i++) {
      const x = Math.floor(rnd() * 112), y = Math.floor(rnd() * 144);
      rect(x, y, 1, 1, rnd() < 0.5 ? grassDark : grassLight);
    }
    for (let i = 0; i < 40; i++) {
      // grass tufts
      const x = Math.floor(rnd() * 104) + 2, y = Math.floor(rnd() * 136) + 4;
      rect(x, y, 1, 2, tuft);
      rect(x + 2, y, 1, 2, tuft);
      rect(x + 1, y + 1, 1, 1, tuft);
    }
    if (season.id === 'autumn') {
      // leaf litter
      for (let i = 0; i < 90; i++) {
        rect(Math.floor(rnd() * 100), Math.floor(rnd() * 140), 2, 1, ['#d8702a', '#c84a2a', '#e8a030'][i % 3]);
      }
    }
    // Hive pads: trodden dirt under each slot
    for (const [cx, cy] of L.hiveSlots) {
      rect(cx * 16 - 1, cy * 16 + 11, 18, 6, season.pad);
    }
    // Picket fence between garden and shop
    for (let y = 2; y < 140; y += 4) {
      rect(102, y, 3, 3, '#f4ecd8');
      rect(102, y + 3, 3, 1, '#c8b898');
    }
    rect(101, 4, 1, 136, '#b8a888');
    if (winter) for (let y = 2; y < 140; y += 4) rect(102, y - 1, 3, 1, '#ffffff');
    // Lamp post
    rect(106, 116, 2, 26, '#3a3040');
    rect(104, 112, 6, 5, '#3a3040');
    rect(105, 113, 4, 3, '#ffe08a');

    // Street
    rect(0, 144, 240, 16, '#d8b878');
    rect(0, 144, 240, 1, '#b89858');
    for (let i = 0; i < 90; i++) {
      rect(Math.floor(rnd() * 240), 146 + Math.floor(rnd() * 13), 2, 1, rnd() < 0.5 ? '#c4a466' : '#e6caa0');
    }
    if (winter) {
      // snow drifts on the street edges and the front wall ledge
      for (let i = 0; i < 26; i++) rect(Math.floor(rnd() * 236), rnd() < 0.5 ? 145 : 157, 4 + Math.floor(rnd() * 6), 2, '#f4f8fc');
    }

    // Shop floor: warm checkerboard
    for (let y = 16; y < 128; y += 8) {
      for (let x = 112; x < 240; x += 8) {
        rect(x, y, 8, 8, ((x + y) / 8) % 2 ? '#f2dfb4' : '#e6cc98');
      }
    }
    // Back wall
    rect(112, 0, 128, 16, '#b86a32');
    for (let x = 112; x < 240; x += 6) rect(x, 2, 1, 14, '#9a5626');
    rect(112, 0, 128, 2, '#6a3418');
    rect(112, 15, 128, 1, '#7a3e1a');
    // Side walls
    rect(112, 0, 3, 144, '#7a3e1a');
    rect(237, 0, 3, 144, '#7a3e1a');
    // Front wall with door gap
    rect(112, 128, 128, 16, '#a85a2a');
    for (let x = 112; x < 240; x += 8) rect(x, 128, 1, 16, '#8a4420');
    rect(112, 128, 128, 2, winter ? '#f4f8fc' : '#6a3418');
    rect(144, 128, 16, 16, '#6a3418');
    rect(145, 130, 14, 14, '#d84a3a'); // doormat seen through the door
    rect(147, 132, 10, 10, '#e8704a');
    // Front windows
    for (const wx of [120, 212]) {
      rect(wx, 131, 16, 9, '#4a2a18');
      rect(wx + 1, 132, 14, 7, '#a8d8e8');
      rect(wx + 2, 133, 4, 2, '#e0f4fa');
      rect(wx + 7, 132, 1, 7, '#4a2a18');
    }
    // Hanging sign by the door: a honey pot on a board
    rect(164, 130, 30, 11, '#4a2a18');
    rect(165, 131, 28, 9, '#f2b230');
    g.drawImage(spr.goodIcon('wildflower'), 175, 131);
    // Welcome rug inside the door
    rect(140, 118, 24, 9, '#b8483a');
    rect(142, 119, 20, 7, '#d86a4a');
    rect(144, 121, 16, 3, '#f2b230');
    // Counter
    rect(190, 98, 47, 14, '#8a5a2a');
    rect(190, 96, 47, 5, '#c88a4a');
    rect(190, 96, 47, 1, '#e8b070');
    rect(190, 111, 47, 1, INK);
    for (let x = 194; x < 237; x += 10) rect(x, 102, 6, 7, '#7a4a22');
    // Register
    rect(222, 90, 12, 8, '#8a8a9a');
    rect(223, 91, 10, 3, '#3a3a4a');
    rect(224, 92, 3, 1, '#9af09a');
    rect(222, 94, 12, 1, '#f2b230');
    // Potted plant
    rect(118, 112, 8, 7, '#b86a32');
    rect(117, 111, 10, 2, '#8a4a22');
    rect(116, 104, 4, 4, '#4a9a3c');
    rect(121, 102, 4, 6, '#5aae48');
    rect(119, 100, 3, 4, '#6cc054');
    // Display table with a jar pyramid (kept clear of the customer paths)
    rect(118, 84, 26, 3, 'rgba(43,29,20,0.25)');
    rect(117, 70, 28, 13, INK);
    rect(118, 71, 26, 9, '#c88a4a');
    rect(118, 71, 26, 1, '#e8b070');
    rect(118, 80, 26, 2, '#8a5a2a');
    rect(119, 82, 2, 4, '#6a3a1a');
    rect(141, 82, 2, 4, '#6a3a1a');
    const jar = (x, y) => {
      rect(x, y, 5, 6, INK);
      rect(x + 1, y + 2, 3, 3, '#f8c838');
      rect(x + 1, y + 1, 3, 1, '#c8642a');
      rect(x + 1, y + 2, 1, 1, '#fde8a0');
    };
    jar(121, 70); jar(126, 70); jar(131, 70); jar(136, 70);
    jar(123, 65); jar(128, 65); jar(133, 65);
    jar(126, 60); jar(131, 60);
    // "Try me" sample dish
    rect(138, 76, 5, 2, '#fff4d8');
    rect(139, 75, 3, 1, '#f8c838');
    // Wall clock
    rect(226, 4, 7, 7, INK);
    rect(227, 5, 5, 5, '#fff4d8');
    rect(229, 6, 1, 2, INK);
    rect(229, 7, 2, 1, INK);
    return c;
  }

  function buildFlowers() {
    const rnd = util.seeded(42);
    const out = [];
    const blocked = (x, y) => {
      if (x > 96) return true;
      for (const [cx, cy] of L.hiveSlots) {
        if (x > cx * 16 - 4 && x < cx * 16 + 20 && y > cy * 16 - 3 && y < cy * 16 + 20) return true;
      }
      return false;
    };
    let tries = 0;
    while (out.length < 110 && tries < 5000) {
      tries++;
      const x = 3 + Math.floor(rnd() * 92), y = 4 + Math.floor(rnd() * 134);
      if (blocked(x, y)) continue;
      if (out.some((f) => Math.abs(f.x - x) < 5 && Math.abs(f.y - y) < 5)) continue;
      out.push({ x, y, col: FLOWER_COLS[Math.floor(rnd() * FLOWER_COLS.length)], ph: rnd() * 6 });
    }
    return out;
  }

  const AUTUMN_COLS = ['#e8702a', '#d84a2a', '#f0a830', '#b85a2a'];
  function visibleFlowers(s) {
    const se = HC.sim.f.season(s);
    let n = 14 + 5 * s.up.flowers + (se.id === 'spring' ? 10 : 0);
    // Bees still need somewhere to fly in winter: keep a few hardy blooms.
    if (se.id === 'winter') n = Math.min(n, 6 + s.up.flowers);
    return flowers.slice(0, Math.min(flowers.length, n));
  }

  // ---- Dynamic pieces -------------------------------------------------------
  function drawFlowers(s, t) {
    const autumn = HC.sim.f.season(s).id === 'autumn';
    for (const f of visibleFlowers(s)) {
      const sway = Math.sin(t * 1.6 + f.ph) > 0.6 ? 1 : 0;
      ctx.fillStyle = '#3e8a34';
      ctx.fillRect(f.x, f.y + 1, 1, 3);
      const x = f.x + sway, y = f.y;
      ctx.fillStyle = autumn ? AUTUMN_COLS[Math.floor(f.ph * 10) % 4] : f.col;
      ctx.fillRect(x - 1, y, 3, 1);
      ctx.fillRect(x, y - 1, 1, 3);
      ctx.fillStyle = f.col === '#f8d030' ? '#e86a20' : '#f8d030';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  function drawHives(s, t) {
    const winterNow = HC.sim.f.season(s).id === 'winter';
    L.hiveSlots.forEach(([cx, cy], i) => {
      const x = cx * 16, y = cy * 16;
      const h = s.hives[i];
      if (h) {
        ctx.drawImage(spr.hive(h.level), x, y);
        if (winterNow) {
          ctx.fillStyle = '#f8fbff';
          ctx.fillRect(x + 2, y + 1, 12, 1);
          ctx.fillRect(x + 1, y + 2, 5, 1);
          ctx.fillRect(x + 9, y + 2, 4, 1);
        }
        // level pips
        for (let l = 0; l < h.level; l++) {
          ctx.fillStyle = '#fff4c0';
          ctx.fillRect(x + 3 + l * 2, y + 6, 1, 1);
        }
      } else if (i === s.hives.length) {
        // Next buildable slot: dashed outline, pulses when affordable
        const can = s.coins >= HC.sim.f.hiveCost(s);
        const on = !can || Math.floor(t * 2) % 2 === 0;
        ctx.fillStyle = can ? '#fff4c0' : 'rgba(43,29,20,0.45)';
        if (on) {
          for (let k = 0; k < 16; k += 3) {
            ctx.fillRect(x + k, y + 2, 2, 1);
            ctx.fillRect(x + k, y + 15, 2, 1);
            ctx.fillRect(x, y + 2 + k * 0.8, 1, 2);
            ctx.fillRect(x + 15, y + 2 + k * 0.8, 1, 2);
          }
          ctx.fillRect(x + 7, y + 6, 2, 6);
          ctx.fillRect(x + 5, y + 8, 6, 2);
        }
      }
    });
  }

  function beeColors(s, bee) {
    const sp = D.species[bee.sp];
    return bee.sparkle ? spr.sparklePalette(sp) : sp;
  }

  function drawBees(s, t) {
    const fl = visibleFlowers(s);
    if (!fl.length) return;
    s.hives.forEach((h, hi) => {
      const [cx, cy] = L.hiveSlots[hi];
      const hx = cx * 16 + 8, hy = cy * 16 + 11;
      h.bees.slice(0, 8).forEach((id) => {
        const bee = s.bees[id];
        if (!bee) return;
        const seed = util.hash(id);
        const period = 5 + (seed % 300) / 100;
        const off = (seed % 1000) / 100;
        const trip = Math.floor((t + off) / period);
        const u = ((t + off) % period) / period;
        const f = fl[util.hash(id + trip) % fl.length];
        let x, y;
        if (u < 0.4) {
          const k = u / 0.4;
          x = util.lerp(hx, f.x, k);
          y = util.lerp(hy, f.y - 2, k) - Math.sin(Math.PI * k) * 10;
        } else if (u < 0.6) {
          x = f.x + Math.sin(t * 9 + seed) * 1.5;
          y = f.y - 3 + Math.cos(t * 7 + seed) * 1;
        } else {
          const k = (u - 0.6) / 0.4;
          x = util.lerp(f.x, hx, k);
          y = util.lerp(f.y - 2, hy, k) - Math.sin(Math.PI * k) * 8;
        }
        x = Math.round(x);
        y = Math.round(y);
        const col = beeColors(s, bee);
        const flap = Math.floor(t * 14 + seed) % 2;
        // wings
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(x - 1, y - 2 + flap, 1, 1);
        ctx.fillRect(x + 1, y - 2 + flap, 1, 1);
        // body: bright colour with a dark stripe and head
        ctx.fillStyle = col.body;
        ctx.fillRect(x - 1, y - 1, 4, 2);
        ctx.fillStyle = col.stripe;
        ctx.fillRect(x + 1, y - 1, 1, 2);
        ctx.fillStyle = INK;
        ctx.fillRect(x - 2, y - 1, 1, 2);
        if (bee.sparkle && Math.floor(t * 4 + seed) % 3 === 0) {
          ctx.fillStyle = '#fff6b0';
          ctx.fillRect(x + 2, y - 3, 1, 1);
        }
      });
    });
  }

  function drawShelves(s, t) {
    const cap = HC.sim.f.shelfCap(s);
    for (let i = 0; i < 8; i++) {
      const x = 112 + i * 16, y = 8;
      const sh = s.shelves[i];
      if (!sh) {
        // Unbought slot: a framed honeycomb picture on the wall
        if (i % 2 === 0) {
          ctx.fillStyle = '#6a3418';
          ctx.fillRect(x + 4, 4, 8, 8);
          ctx.fillStyle = '#f2c050';
          ctx.fillRect(x + 5, 5, 6, 6);
          ctx.fillStyle = '#d8962a';
          ctx.fillRect(x + 6, 6, 2, 2);
          ctx.fillRect(x + 9, 8, 1, 2);
        }
        continue;
      }
      // Frame
      ctx.fillStyle = INK;
      ctx.fillRect(x + 1, y, 14, 23);
      ctx.fillStyle = '#9a5a2a';
      ctx.fillRect(x + 2, y + 1, 12, 21);
      ctx.fillStyle = '#6a3a1a';
      ctx.fillRect(x + 3, y + 2, 10, 8);
      ctx.fillRect(x + 3, y + 12, 10, 8);
      ctx.fillStyle = '#c88a4a';
      ctx.fillRect(x + 2, y + 10, 12, 2);
      ctx.fillRect(x + 2, y + 20, 12, 2);
      if (sh.good) {
        const g = D.good[sh.good];
        const n = Math.ceil((sh.qty / cap) * 6);
        for (let k = 0; k < n; k++) {
          const row = k < 3 ? 1 : 0;
          const jx = x + 3 + (k % 3) * 3 + (row ? 0 : 1);
          const jy = y + (row ? 14 : 4);
          ctx.fillStyle = INK;
          ctx.fillRect(jx, jy, 3, 6);
          ctx.fillStyle = g.fill;
          ctx.fillRect(jx, jy + 2, 3, 4);
          ctx.fillStyle = g.lid;
          ctx.fillRect(jx, jy + 1, 3, 1);
        }
        // Price tag in the product colour
        ctx.fillStyle = g.fill;
        ctx.fillRect(x + 6, y + 21, 4, 2);
        if (sh.qty === 0 && !(s.store[sh.good] > 0) && Math.floor(t * 2) % 2 === 0) {
          spr.drawText(ctx, '!', x + 8, y - 6, '#ff6a4a');
        }
      }
    }
  }

  function drawBubble(x, y, bubble, t) {
    const bx = Math.round(x - 6), by = Math.round(y);
    ctx.fillStyle = INK;
    ctx.fillRect(bx, by, 12, 11);
    ctx.fillRect(bx + 5, by + 11, 2, 2);
    ctx.fillStyle = '#fffaf0';
    ctx.fillRect(bx + 1, by + 1, 10, 9);
    ctx.fillRect(bx + 5, by + 10, 2, 1);
    if (bubble.kind === 'good') ctx.drawImage(spr.goodIcon(bubble.good), bx + 2, by + 1);
    else if (bubble.kind === 'heart') ctx.drawImage(spr.misc('heart'), bx + 2, by + 2);
    else if (bubble.kind === 'dots') {
      ctx.fillStyle = INK;
      const n = 1 + (Math.floor(t * 4) % 3);
      for (let i = 0; i < n; i++) ctx.fillRect(bx + 3 + i * 2, by + 6, 1, 1);
    }
  }

  function frameFor(c) {
    return c.path && c.path.length ? Math.floor(c.walk * 8) % 4 : 0;
  }

  function drawActors(s, t) {
    const rt = HC.sim.rt;
    const actors = rt.customers.map((c) => ({ y: c.y, draw: () => drawCustomer(c, t) }));
    // The keeper stands behind the counter; drawKeeper repaints the counter
    // top over her legs.
    actors.push({ y: L.keeper.y, draw: () => drawKeeper(s, t) });
    if (s.merchant) actors.push({ y: L.wagon.y - 1, draw: () => drawWagon(s, t) });
    actors.sort((a, b) => a.y - b.y);
    for (const a of actors) a.draw();
  }

  function drawCustomer(c, t) {
    const img = spr.character(c.look, c.dir, frameFor(c));
    const x = Math.round(c.x - 8), y = Math.round(c.y - 19);
    // shadow
    ctx.fillStyle = 'rgba(43,29,20,0.25)';
    ctx.fillRect(x + 4, y + 18, 8, 2);
    ctx.drawImage(img, x, y);
    if (c.bubble) drawBubble(c.x, c.y - 33, c.bubble, t);
  }

  function drawKeeper(s, t) {
    const paying = HC.sim.rt.queue[0] && HC.sim.rt.queue[0].state === 'pay';
    const frame = paying && Math.floor(t * 6) % 2 ? 1 : 0;
    const img = spr.character(KEEPER_LOOK, 'down', frame);
    const x = L.keeper.x - 8, y = L.keeper.y - 19;
    ctx.drawImage(img, x, y);
    // Redraw the counter top edge over her legs so she reads as behind it.
    ctx.fillStyle = '#c88a4a';
    ctx.fillRect(190, 96, 47, 5);
    ctx.fillStyle = '#e8b070';
    ctx.fillRect(190, 96, 47, 1);
    ctx.fillStyle = '#8a8a9a';
    ctx.fillRect(222, 90, 12, 8);
    ctx.fillStyle = '#3a3a4a';
    ctx.fillRect(223, 91, 10, 3);
    ctx.fillStyle = paying && Math.floor(t * 8) % 2 ? '#fff08a' : '#9af09a';
    ctx.fillRect(224, 92, 3, 1);
    ctx.fillStyle = '#f2b230';
    ctx.fillRect(222, 94, 12, 1);
  }

  function drawWagon(s, t) {
    const x = L.wagon.x - 20, y = L.wagon.y - 22;
    // wheels
    ctx.fillStyle = INK;
    ctx.fillRect(x + 4, y + 16, 7, 7);
    ctx.fillRect(x + 27, y + 16, 7, 7);
    ctx.fillStyle = '#c8a060';
    ctx.fillRect(x + 5, y + 17, 5, 5);
    ctx.fillRect(x + 28, y + 17, 5, 5);
    // body
    ctx.fillStyle = INK;
    ctx.fillRect(x, y + 6, 38, 12);
    ctx.fillStyle = '#4a7a9a';
    ctx.fillRect(x + 1, y + 7, 36, 10);
    ctx.fillStyle = '#6a9aba';
    ctx.fillRect(x + 1, y + 7, 36, 2);
    // striped awning
    for (let i = 0; i < 38; i += 4) {
      ctx.fillStyle = (i / 4) % 2 ? '#fff4d8' : '#d84a4a';
      ctx.fillRect(x + i, y, 4, 5);
    }
    ctx.fillStyle = INK;
    ctx.fillRect(x, y + 5, 38, 1);
    // jars in the window
    ctx.drawImage(spr.beePortrait(s.merchant.offer.sp, s.merchant.offer.sparkle), x + 11, y + 4);
    // merchant
    const img = spr.character(MERCHANT_LOOK, 'down', 0);
    ctx.drawImage(img, x + 38, y + 3);
    if (Math.floor(t * 2) % 2 === 0) spr.drawText(ctx, '!', x + 46, y - 4, '#fff08a');
  }

  function drawDrip(t) {
    const d = HC.sim.rt.drip;
    if (!d) return;
    const [cx, cy] = L.hiveSlots[d.hive];
    const x = cx * 16 + 8, y = cy * 16 - 4 + Math.round(Math.sin(t * 5) * 2);
    const blink = d.left < 3 && Math.floor(t * 8) % 2;
    if (blink) return;
    // sparkle ring
    ctx.fillStyle = '#fff6b0';
    for (let i = 0; i < 4; i++) {
      const a = t * 3 + (i * Math.PI) / 2;
      ctx.fillRect(Math.round(x + Math.cos(a) * 8), Math.round(y + Math.sin(a) * 6), 1, 1);
    }
    // the drop
    ctx.fillStyle = INK;
    ctx.fillRect(x - 3, y - 2, 7, 6);
    ctx.fillRect(x - 2, y - 4, 5, 2);
    ctx.fillRect(x - 1, y - 6, 3, 2);
    ctx.fillStyle = '#ffd23a';
    ctx.fillRect(x - 2, y - 2, 5, 5);
    ctx.fillRect(x - 1, y - 4, 3, 2);
    ctx.fillRect(x, y - 5, 1, 1);
    ctx.fillStyle = '#fff4c0';
    ctx.fillRect(x - 1, y - 1, 1, 2);
  }

  // Seasonal particles over the garden and street (not inside the shop).
  function drawWeather(s, t) {
    const id = HC.sim.f.season(s).id;
    const insideShop = (x, y) => x >= 112 && y < 128;
    if (id === 'winter') {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 46; i++) {
        const sp = 10 + (i % 5) * 3;
        const x = Math.floor((i * 53 + Math.sin(t * 0.8 + i) * 6 + 400) % 240);
        const y = Math.floor((i * 37 + t * sp) % 160);
        if (!insideShop(x, y)) ctx.fillRect(x, y, i % 4 === 0 ? 2 : 1, 1);
      }
    } else if (id === 'autumn') {
      for (let i = 0; i < 9; i++) {
        const x = Math.floor((i * 29 + Math.sin(t * 1.3 + i) * 10 + 200) % 104);
        const y = Math.floor((i * 41 + t * (8 + i)) % 150);
        ctx.fillStyle = AUTUMN_COLS[i % 4];
        ctx.fillRect(x, y, 2, 1);
      }
    } else if (id === 'spring') {
      ctx.fillStyle = '#f8b8d0';
      for (let i = 0; i < 6; i++) {
        const x = Math.floor((i * 37 + t * 9 + Math.sin(t + i) * 8) % 104);
        const y = Math.floor((i * 23 + Math.cos(t * 0.7 + i) * 20 + t * 4) % 144);
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function drawFx(t) {
    for (const e of HC.sim.rt.fx) {
      if (e.kind !== 'text') continue;
      const k = e.t / e.life;
      const y = e.y - k * 14;
      ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      spr.drawText(ctx, e.text, e.x, y, '#fff08a');
      ctx.globalAlpha = 1;
    }
  }

  // ---- Lighting -------------------------------------------------------------
  function lightLevels(s) {
    const p = HC.sim.f.dayPhase(s);
    // 0 = full day, 1 = full night; dusk is a warm transition
    let night = 0, dusk = 0;
    if (p >= 0.6 && p < 0.7) {
      const k = (p - 0.6) / 0.1;
      dusk = Math.sin(Math.PI * k);
      night = k;
    } else if (p >= 0.7 && p < 0.95) night = 1;
    else if (p >= 0.95) night = 1 - (p - 0.95) / 0.05;
    return { night, dusk };
  }

  function mix(a, b, k) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * k));
  }

  function drawLighting(s, t) {
    const { night, dusk } = lightLevels(s);
    if (night <= 0.01 && dusk <= 0.01) return;
    let outside = [255, 255, 255];
    outside = mix(outside, [255, 190, 140], dusk * 0.8);
    outside = mix(outside, [78, 88, 160], night * 0.9);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgb(${outside})`;
    ctx.fillRect(0, 0, L.W, L.H);
    // Lamps and the lit shop interior glow through the dark.
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, a) => {
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(255,190,90,${a})`);
      gr.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    const flicker = 0.02 * Math.sin(t * 13) + 0.02 * Math.sin(t * 7.3);
    glow(176, 70, 90, (0.28 + flicker) * night);
    glow(107, 114, 22, (0.5 + flicker) * night);
    glow(128, 136, 16, 0.35 * night);
    glow(220, 136, 16, 0.35 * night);
    ctx.globalCompositeOperation = 'source-over';
    // Stars over the garden
    if (night > 0.5) {
      ctx.fillStyle = `rgba(255,250,220,${(night - 0.5) * 1.4})`;
      const rnd = util.seeded(99);
      for (let i = 0; i < 14; i++) {
        const x = Math.floor(rnd() * 96), y = Math.floor(rnd() * 30);
        if (Math.sin(t * 2 + i) > -0.3) ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function draw(s, t) {
    ctx.drawImage(staticFor(HC.sim.f.season(s)), 0, 0);
    drawFlowers(s, t);
    drawHives(s, t);
    drawShelves(s, t);
    drawActors(s, t);
    drawBees(s, t);
    drawWeather(s, t);
    drawLighting(s, t);
    // UI-like overlays stay bright at night.
    drawDrip(t);
    drawFx(t);
  }

  // ---- Hit testing for taps on the scene -----------------------------------
  function hitTest(s, x, y) {
    const d = HC.sim.rt.drip;
    if (d) {
      const [cx, cy] = L.hiveSlots[d.hive];
      if (Math.abs(x - (cx * 16 + 8)) < 12 && y > cy * 16 - 16 && y < cy * 16 + 8) return { kind: 'drip' };
    }
    for (let i = 0; i < L.hiveSlots.length; i++) {
      const [cx, cy] = L.hiveSlots[i];
      if (x >= cx * 16 - 2 && x < cx * 16 + 18 && y >= cy * 16 && y < cy * 16 + 17) {
        if (s.hives[i]) return { kind: 'hive', index: i };
        if (i === s.hives.length) return { kind: 'buildHive' };
      }
    }
    if (y >= 6 && y < 34 && x >= 112 && x < 240) {
      const i = Math.floor((x - 112) / 16);
      if (s.shelves[i]) return { kind: 'shelf', index: i };
      return { kind: 'buyShelf' };
    }
    if (s.merchant && x >= L.wagon.x - 22 && x < L.wagon.x + 34 && y >= L.wagon.y - 26 && y < L.wagon.y + 4) return { kind: 'merchant' };
    if (x >= 200 && x < 236 && y >= 66 && y < 112) return { kind: 'keeper' };
    return null;
  }

  HC.render = { init, draw, hitTest, lightLevels, KEEPER_LOOK };
})();

</script>
<script>
// Chiptune sound: square/triangle blips for effects and a small looping tune.
// Audio starts only after the first tap, as browsers require.
(function () {
  const HC = window.HC;
  let ac = null, master = null, musicGain = null, sfxGain = null;
  let musicTimer = null, nextNote = 0, step = 0;

  function ensure() {
    if (ac) return ac;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    ac = new Ctx();
    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(ac.destination);
    sfxGain = ac.createGain();
    sfxGain.gain.value = 0.35;
    sfxGain.connect(master);
    musicGain = ac.createGain();
    musicGain.gain.value = 0.16;
    musicGain.connect(master);
    return ac;
  }

  function tone(freq, start, dur, type = 'square', vol = 0.5, dest = sfxGain, slide = 0) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g);
    g.connect(dest);
    o.start(start);
    o.stop(start + dur + 0.02);
  }

  const N = (n) => 440 * Math.pow(2, (n - 69) / 12); // MIDI note -> Hz

  const SFX = {
    coin: (t) => { tone(N(83), t, 0.05, 'square', 0.25); tone(N(88), t + 0.05, 0.12, 'square', 0.25); },
    buy: (t) => [72, 76, 79].forEach((n, i) => tone(N(n), t + i * 0.06, 0.09, 'square', 0.22)),
    click: (t) => tone(N(84), t, 0.03, 'square', 0.15),
    fail: (t) => { tone(N(55), t, 0.09, 'square', 0.25); tone(N(50), t + 0.09, 0.14, 'square', 0.25); },
    hatch: (t) => [72, 76, 79, 84, 79, 84].forEach((n, i) => tone(N(n), t + i * 0.08, 0.12, i % 2 ? 'triangle' : 'square', 0.25)),
    order: (t) => [79, 83, 86, 91].forEach((n, i) => tone(N(n), t + i * 0.07, 0.1, 'square', 0.22)),
    discover: (t) => [67, 72, 76, 79, 84, 88, 91].forEach((n, i) => tone(N(n), t + i * 0.07, 0.14, 'square', 0.22)),
    bell: (t) => { tone(N(96), t, 0.25, 'triangle', 0.3); tone(N(91), t + 0.12, 0.3, 'triangle', 0.2); },
    text: (t) => tone(N(79), t, 0.02, 'square', 0.08),
  };

  // A gentle 32-step loop in F major: melody over a walking triangle bass.
  const MELODY = [77, 0, 81, 0, 84, 0, 81, 79, 77, 0, 74, 0, 72, 0, 0, 0, 74, 0, 77, 0, 79, 0, 81, 79, 77, 0, 76, 0, 77, 0, 0, 0];
  const BASS = [53, 0, 0, 0, 60, 0, 0, 0, 50, 0, 0, 0, 57, 0, 0, 0, 46, 0, 0, 0, 53, 0, 0, 0, 48, 0, 0, 0, 53, 0, 55, 0];
  const STEP = 0.19;

  function scheduleMusic() {
    while (nextNote < ac.currentTime + 0.3) {
      const m = MELODY[step % 32], b = BASS[step % 32];
      if (m) tone(N(m), nextNote, STEP * 1.6, 'square', 0.18, musicGain);
      if (b) tone(N(b), nextNote, STEP * 3.5, 'triangle', 0.35, musicGain);
      if (step % 4 === 2) tone(2000, nextNote, 0.02, 'square', 0.03, musicGain, -1500);
      nextNote += STEP;
      step++;
    }
  }

  HC.audio = {
    unlock() {
      if (!ensure()) return;
      if (ac.state === 'suspended') ac.resume();
      HC.audio.syncMusic();
    },
    play(name) {
      const s = HC.game;
      if (!s || !s.settings.sfx || !ac || ac.state !== 'running' || !SFX[name]) return;
      SFX[name](ac.currentTime + 0.01);
    },
    syncMusic() {
      const on = HC.game && HC.game.settings.music && ac && ac.state === 'running';
      if (on && !musicTimer) {
        nextNote = ac.currentTime + 0.05;
        musicTimer = setInterval(scheduleMusic, 100);
      } else if (!on && musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    },
  };
})();

</script>
<script>
// DOM interface: HUD, tab panels, modals, toasts and the tutorial text box.
// Panels re-render only on structural changes ('dirty'); fast-changing numbers
// update through [data-live] bindings so buttons are never replaced mid-click.
(function () {
  const HC = window.HC;
  const { util, data: D, spr, bus } = HC;
  const { fmt, esc } = util;
  const f = () => HC.sim.f;
  const S = () => HC.game;

  const $ = (sel, root = document) => root.querySelector(sel);
  const el = {};
  let tab = 'apiary';
  let dirty = true;
  let modal = null; // { render: () => html, onAct?: (act, ds) => bool }
  const live = new Map();
  let liveSeq = 0;

  // Register a live binding; returns an id to drop in a data attribute.
  function L(fn) {
    const id = 'l' + liveSeq++;
    live.set(id, fn);
    return id;
  }

  const coin = () => `<img class="px ico" src="${spr.miscURL('coin')}" alt="" width="16" height="16">`;
  const goodImg = (g, size = 16) => `<img class="px ico" src="${spr.goodURL(g)}" alt="" width="${size}" height="${size}">`;
  const beeImg = (sp, sparkle, size = 32, cls = '') => `<img class="px bee-img ${cls}" src="${spr.beeURL(sp, sparkle)}" alt="" width="${size}" height="${size}">`;
  const price = (n) => `${coin()}<span>${fmt(n)}</span>`;
  const rarityChip = (r) => `<span class="chip chip-${r.toLowerCase()}">${r}</span>`;

  function btn(label, act, args = {}, opts = {}) {
    const data = Object.entries(args).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
    const afford = opts.cost != null ? `data-afford="${L(() => S().coins >= opts.cost)}"` : '';
    const dis = opts.disabled ? 'disabled' : '';
    return `<button class="btn ${opts.cls || ''}" data-act="${act}" ${data} ${afford} ${dis}>${label}</button>`;
  }

  // ---- Toasts & text box --------------------------------------------------
  function toast(msg, kind = '') {
    if (!msg) return;
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    el.toasts.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
    while (el.toasts.children.length > 4) el.toasts.firstChild.remove();
  }

  const textQueue = [];
  let typing = null;
  let shown = null; // the queue item currently on screen
  // `valid` (optional) is re-checked before each line so stale hints are skipped.
  function say(lines, valid) {
    textQueue.push(...lines.map((text) => ({ text, valid })));
    if (!typing && el.textbox.hidden) nextLine();
  }
  function nextLine() {
    if (typing) {
      // Finish the current line instantly on tap.
      clearInterval(typing.timer);
      el.textboxText.textContent = typing.line;
      typing = null;
      el.textbox.classList.add('done');
      return;
    }
    let item = textQueue.shift();
    while (item && item.valid && !item.valid()) item = textQueue.shift();
    shown = item || null;
    const line = item && item.text;
    if (line == null) {
      el.textbox.hidden = true;
      return;
    }
    el.textbox.hidden = false;
    el.textbox.classList.remove('done');
    el.textboxText.textContent = '';
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      el.textboxText.textContent = line;
      el.textbox.classList.add('done');
      return;
    }
    let i = 0;
    typing = {
      line,
      timer: setInterval(() => {
        i++;
        el.textboxText.textContent = line.slice(0, i);
        if (i % 3 === 0) HC.audio.play('text');
        if (i >= line.length) {
          clearInterval(typing.timer);
          typing = null;
          el.textbox.classList.add('done');
        }
      }, 24),
    };
  }

  // ---- HUD ------------------------------------------------------------------
  function renderHud() {
    el.goalbar.innerHTML = `<div class="goal-inner" data-html="${L(goalHtml)}"></div>`;
    el.hud.innerHTML = `
      <div class="hud-coins" title="Coins">${coin()}<b data-live="${L(() => fmt(S().coins))}"></b></div>
      <div class="hud-item" title="Income over the last minute"><span class="lbl">per min</span><b data-live="${L(() => fmt(HC.sim.incomePerMin()))}"></b></div>
      <div class="hud-item" title="Reputation"><span class="lbl">rep</span><span class="stars" data-html="${L(starsHtml)}"></span></div>
      <div class="hud-item hud-time" title="Time of day"><span data-html="${L(timeHtml)}"></span></div>
      <button class="hud-item season-chip" data-act="season" data-html="${L(seasonHtml)}"></button>
      ${S().ribbons ? `<div class="hud-item" title="Festival ribbons: +${S().ribbons * 10}% sale prices"><img class="px ico" src="${spr.miscURL('ribbon')}" alt="" width="16" height="16"><b>${S().ribbons}</b></div>` : ''}
    `;
  }
  function goalHtml() {
    const s = S();
    const g = HC.goals.current(s);
    if (!g) return '<span class="goal-text">Every goal complete. The town is proud of you.</span>';
    const ok = g.check(s);
    return `<span class="goal-label">Goal ${(s.goal || 0) + 1}</span><button class="goal-text" data-act="goalHint" title="Show a hint">${g.text}</button>` +
      (ok ? `<button class="btn btn-sm btn-go" data-act="claimGoal">Claim ${price(g.reward)}</button>` : `<span class="goal-reward">${price(g.reward)}</span>`);
  }
  function seasonHtml() {
    const s = S();
    const se = f().season(s);
    return `<span class="season-dot season-${se.id}"></span><b>${se.name}</b><span class="lbl">day ${f().day(s)}</span>`;
  }
  function starsHtml() {
    const r = S().rep;
    let h = '';
    for (let i = 0; i < 5; i++) {
      const on = r >= i + 0.5;
      h += `<img class="px ico" src="${spr.miscURL(on ? 'star' : 'starEmpty')}" alt="" width="12" height="12">`;
    }
    return h + `<span class="sr-only">${r.toFixed(1)} of 5</span>`;
  }
  function timeHtml() {
    const p = f().dayPhase(S());
    const mins = Math.floor(((p * 24 + 6) % 24) * 60);
    const hh = Math.floor(mins / 60), mm = mins % 60;
    const night = f().isNight(S());
    const label = `${((hh + 11) % 12) + 1}:${String(mm - (mm % 10)).padStart(2, '0')} ${hh < 12 ? 'am' : 'pm'}`;
    return `<img class="px ico" src="${spr.miscURL(night ? 'moon' : 'sun')}" alt="" width="14" height="14"><b>${label}</b>`;
  }

  // ---- Panels ---------------------------------------------------------------
  const panels = {};

  function beeTile(bee, extra = '') {
    const sp = D.species[bee.sp];
    return `<button class="bee-tile ${bee.sparkle ? 'is-sparkle' : ''}" data-act="bee" data-id="${bee.id}" title="${esc(bee.name)}">
      ${beeImg(bee.sp, bee.sparkle, 32)}
      <span class="bee-name">${esc(bee.name)}</span>
      <span class="bee-sub">${sp.name.replace(' Bee', '')} · ${util.pct(bee.vigor)}</span>
      ${extra}
    </button>`;
  }

  panels.apiary = function () {
    const s = S();
    const rates = f().goodRates(s);
    const hiveCards = s.hives.map((h, i) => {
      const cap = f().hiveCap(h);
      const slots = [];
      for (let k = 0; k < cap; k++) {
        const id = h.bees[k];
        slots.push(id ? beeTile(s.bees[id]) : `<button class="bee-tile empty" data-act="addToHive" data-i="${i}" title="Add a bee"><span class="plus">+</span><span class="bee-sub">Add bee</span></button>`);
      }
      const upCost = h.level < D.HIVE_MAX_LEVEL ? f().hiveUpgradeCost(s, i) : null;
      const mult = f().hiveMult(s, h);
      return `<article class="card hive-card" id="hive-${i}">
        <header class="card-head">
          <img class="px" src="${spr.hiveURL(h.level)}" alt="" width="32" height="32">
          <div class="grow"><h3>Hive ${i + 1}</h3><p class="muted">Level ${h.level + 1} · ${h.bees.length}/${cap} bees · ${util.pct(mult)} output</p></div>
          ${upCost != null ? btn(`Upgrade ${price(upCost)}`, 'upgradeHive', { i }, { cost: upCost, cls: 'btn-sm' }) : '<span class="chip">Max level</span>'}
        </header>
        <div class="bee-grid">${slots.join('')}</div>
      </article>`;
    }).join('');

    const nextHive = s.hives.length < 6 ? `<article class="card build-card">
        <div class="grow"><h3>Build hive ${s.hives.length + 1}</h3><p class="muted">Room for 3 more bees. Upgrades add slots and output.</p></div>
        ${btn(`Build ${price(f().hiveCost(s))}`, 'buildHive', {}, { cost: f().hiveCost(s) })}
      </article>` : '';

    const boxBees = s.box.map((id) => beeTile(s.bees[id])).join('') || '<p class="muted empty-note">No spare bees. Bees you buy or hatch land here when the hives are full.</p>';

    const market = ['meadow', 'clover'].map((sp) => {
      const spec = D.species[sp];
      const unlocked = f().marketUnlocked(s, sp);
      const cost = f().marketPrice(s, sp);
      return `<div class="row-item ${unlocked ? '' : 'locked'}">
        ${beeImg(sp, false, 32)}
        <div class="grow"><b>${spec.name}</b><p class="muted">${unlocked ? `Makes ${D.good[spec.good].name} · 1 per ${spec.secs}s` : `Unlocks after earning ₵${fmt(120)} in total.`}</p></div>
        ${unlocked ? btn(`Buy ${price(cost)}`, 'buyBee', { sp }, { cost }) : '<span class="chip">Locked</span>'}
      </div>`;
    }).join('');

    const prod = Object.entries(rates).sort((a, b) => D.good[a[0]].tier - D.good[b[0]].tier)
      .map(([g, r]) => `<span class="pill">${goodImg(g)} ${(r * 60).toFixed(1)}/min</span>`).join('');

    return `
      <section class="win">
        <div class="win-head"><h2>Apiary</h2><span class="muted">${f().beeCount(s)} bees · ${s.hives.length}/6 hives</span></div>
        <div class="pills">${prod || '<span class="muted">Nothing in production.</span>'}</div>
        <div class="stack">${hiveCards}${nextHive}</div>
      </section>
      <section class="win">
        <div class="win-head"><h2>Bee box</h2><span class="muted">${s.box.length}/${f().boxCap(s)} spaces</span>
          ${s.box.length >= 4 ? btn('Sell extras', 'sellExtras', {}, { cls: 'btn-sm btn-ghost' }) : ''}</div>
        <div class="bee-grid">${boxBees}</div>
      </section>
      <section class="win">
        <div class="win-head"><h2>Bee Market</h2><span class="muted">Prices rise with each purchase</span></div>
        <div class="list">${market}</div>
        ${s.merchant ? merchantCard() : ''}
      </section>`;
  };

  function merchantCard() {
    const s = S();
    const o = s.merchant.offer;
    const sp = D.species[o.sp];
    const known = s.discovered[o.sp];
    return `<div class="merchant-card">
      ${beeImg(o.sp, o.sparkle, 48, known ? '' : 'mystery')}
      <div class="grow">
        <b>Travelling merchant</b> <span class="muted">leaves in <span data-live="${L(() => (S().merchant ? util.fmtTime(S().merchant.left) : 'gone'))}"></span></span>
        <p>${known ? sp.name : 'An unfamiliar bee'}${o.sparkle ? ' <span class="chip chip-sparkle">Sparkle</span>' : ''} · vigor ${util.pct(o.vigor)}${o.trait ? ' · ' + D.TRAITS[o.trait].name : ''}</p>
      </div>
      ${btn(`Buy ${price(o.price)}`, 'merchant', {}, { cost: o.price })}
    </div>`;
  }

  panels.shop = function () {
    const s = S();
    const cap = f().shelfCap(s);
    const shelves = s.shelves.map((sh, i) => {
      const g = sh.good && D.good[sh.good];
      return `<button class="shelf-tile" data-act="shelf" data-i="${i}">
        <span class="shelf-num">${i + 1}</span>
        ${g ? goodImg(g.id, 24) : '<span class="shelf-empty">empty</span>'}
        <span class="grow shelf-info">
          <b>${g ? g.name : 'Choose a product'}</b>
          ${g ? `<span class="muted">₵${fmt(f().price(s, g.id))} each · <span data-live="${L(() => sh.qty + '/' + cap)}"></span> on shelf · <span data-live="${L(() => fmt(S().store[sh.good] || 0))}"></span> in store</span>` : '<span class="muted">Tap to stock this shelf</span>'}
        </span>
      </button>`;
    }).join('');

    const storeCap = f().storageCap(s);
    const store = D.GOODS.filter((g) => s.unlockedGoods[g.id]).map((g) => `
      <div class="store-item" title="${g.name}">
        ${goodImg(g.id, 24)}
        <span class="store-qty" data-live="${L(() => fmt(S().store[g.id] || 0))}"></span>
        <span class="bar"><i data-width="${L(() => Math.min(1, (S().store[g.id] || 0) / storeCap))}"></i></span>
      </div>`).join('');

    const ups = D.UPGRADES.map((u) => {
      const lv = s.up[u.id];
      const maxed = lv >= u.max;
      const cost = maxed ? 0 : f().upgradeCost(s, u.id);
      return `<div class="row-item">
        <div class="grow"><b>${u.name}</b> <span class="chip">${maxed ? 'Max' : 'Lv ' + lv}</span><p class="muted">${u.desc(lv)}</p></div>
        ${maxed ? '' : btn(price(cost), 'upgrade', { id: u.id }, { cost, cls: 'btn-sm' })}
      </div>`;
    }).join('');

    return `
      <section class="win">
        <div class="win-head"><h2>Shelves</h2><span class="muted">Customers buy what's on display</span></div>
        <div class="stack">${shelves}</div>
        <p class="muted small">Reputation <b data-live="${L(() => S().rep.toFixed(2))}"></b>/5 · a customer every <b data-live="${L(() => f().spawnInterval(S()).toFixed(1) + 's')}"></b> on average · prices ×${f().priceMult(s).toFixed(2)}</p>
      </section>
      <section class="win">
        <div class="win-head"><h2>Storehouse</h2><span class="muted">Holds ${fmt(storeCap)} of each product</span></div>
        <div class="store-grid">${store}</div>
      </section>
      <section class="win">
        <div class="win-head"><h2>Upgrades</h2></div>
        <div class="list">${ups}</div>
      </section>`;
  };

  panels.nursery = function () {
    const s = S();
    const slots = s.nursery.map((n, i) => {
      if (!n) {
        return `<article class="card cradle">
          <img class="px egg" src="${spr.miscURL('egg')}" alt="" width="32" height="32">
          <div class="grow"><h3>Cradle ${i + 1}</h3><p class="muted">Empty. Choose two bees to raise an egg.</p></div>
          ${btn('Pick parents', 'breed', { slot: i })}
        </article>`;
      }
      const a = s.bees[n.a], b = s.bees[n.b];
      const parents = [a, b].map((x) => (x ? beeImg(x.sp, x.sparkle, 32) : '<span class="muted">gone</span>')).join('<span class="heart">+</span>');
      return `<article class="card cradle ${n.ready ? 'ready' : ''}">
        <div class="parents">${parents}</div>
        <div class="grow">
          <h3>Cradle ${i + 1}</h3>

  // ---- Modals ---------------------------------------------------------------
  function openModal(m) {
    modal = m;
    renderModal();
    el.modal.hidden = false;
    const first = el.modalBody.querySelector('button, input, textarea');
    if (first) first.focus({ preventScroll: true });
  }
  function closeModal() {
    modal = null;
    el.modal.hidden = true;
    el.modalBody.innerHTML = ''; // also drops focus from any field inside it
  }
  function renderModal() {
    if (!modal) return;
    el.modalBody.innerHTML = modal.render();
    refreshLive(el.modalBody);
  }

  function confirmModal(title, text, yesLabel, onYes, danger) {
    openModal({
      render: () => `<h2>${title}</h2><p>${text}</p><div class="btn-row end">${btn('Cancel', 'closeModal', {}, { cls: 'btn-ghost' })}${btn(yesLabel, 'confirmYes', {}, { cls: danger ? 'btn-danger' : 'btn-go' })}</div>`,
      onAct: (act) => {
        if (act === 'confirmYes') {
          closeModal();
          onYes();
          return true;
        }
      },
    });
  }

  function beeStats(bee) {
    const s = S();
    const sp = D.species[bee.sp];
    const hi = f().hiveOf(s, bee.id);
    const rate = hi >= 0 ? f().beeRate(s, bee, s.hives[hi], f().isNight(s)) : (1 / sp.secs) * bee.vigor * (bee.sparkle ? 2 : 1);
    const trait = bee.trait && D.TRAITS[bee.trait];
    return `<div class="stats">
      <div class="stat-row"><span>Makes</span><b>${goodImg(sp.good)} ${D.good[sp.good].name}</b></div>
      <div class="stat-row"><span>Output</span><b>${(rate * 60).toFixed(1)}/min${hi < 0 ? ' (resting)' : ''}</b></div>
      <div class="stat-row"><span>Vigor</span><b>${util.pct(bee.vigor)}</b></div>
      <div class="stat-row"><span>Trait</span><b>${trait ? trait.name + ' · <span class="muted">' + trait.desc + '</span>' : '—'}</b></div>
      ${sp.aura ? `<div class="stat-row"><span>Special</span><b>${sp.aura.hive ? '+' + sp.aura.hive * 100 + '% hive output' : '+' + sp.aura.customers * 100 + '% customers'}</b></div>` : ''}
      ${sp.nightBonus ? `<div class="stat-row"><span>Special</span><b>+${sp.nightBonus * 100}% at night</b></div>` : ''}
      <div class="stat-row"><span>Generation</span><b>${bee.gen}</b></div>
      <div class="stat-row"><span>Lives in</span><b>${hi >= 0 ? 'Hive ' + (hi + 1) : 'Bee box'}</b></div>
    </div>`;
  }

  function beeModal(id) {
    let renaming = false;
    openModal({
      render: () => {
        const s = S();
        const bee = s.bees[id];
        if (!bee) return `<p>This bee has moved on.</p><div class="btn-row end">${btn('Close', 'closeModal')}</div>`;
        const sp = D.species[bee.sp];
        const hi = f().hiveOf(s, id);
        const moves = s.hives.map((h, i) => (i === hi ? '' : btn(`Hive ${i + 1} <span class="muted">${h.bees.length}/${f().hiveCap(h)}</span>`, 'moveBee', { id, target: i }, { cls: 'btn-sm', disabled: h.bees.length >= f().hiveCap(h) }))).join('');
        return `
          <div class="bee-hero ${bee.sparkle ? 'is-sparkle' : ''}">
            ${beeImg(bee.sp, bee.sparkle, 96)}
            <div>
              ${renaming ? `<form class="rename" data-form="rename"><input id="renameInput" maxlength="16" value="${esc(bee.name)}" aria-label="Bee name"><button class="btn btn-sm" type="submit">Save</button></form>` : `<h2>${esc(bee.name)} <button class="link" data-act="rename">rename</button></h2>`}
              <p>${sp.name} ${rarityChip(sp.rarity)} ${bee.sparkle ? '<span class="chip chip-sparkle">Sparkle</span>' : ''}</p>
            </div>
          </div>
          ${beeStats(bee)}
          <h3 class="sub">Move</h3>
          <div class="btn-row">${moves}${hi >= 0 ? btn('Bee box', 'moveBee', { id, target: 'box' }, { cls: 'btn-sm' }) : ''}</div>
          <div class="btn-row end">
            ${btn(`Sell ${price(f().sellPrice(bee))}`, 'sellBee', { id }, { cls: 'btn-ghost btn-sm' })}
            ${btn('Close', 'closeModal')}
          </div>`;
      },
      onAct: (act, ds) => {
        if (act === 'rename') {
          renaming = true;
          renderModal();
          const inp = $('#renameInput');
          if (inp) { inp.focus(); inp.select(); }
          return true;
        }
        if (act === 'moveBee') {
          const r = HC.act.moveBee(ds.id, ds.target === 'box' ? 'box' : Number(ds.target));
          if (r.ok) toast(r.msg);
          renderModal();
          return true;
        }
        if (act === 'sellBee') {
          const bee = S().bees[ds.id];
          confirmModal('Sell ' + esc(bee.name) + '?', `A keeper from the next town will pay ₵${fmt(f().sellPrice(bee))}. This can't be undone.`, 'Sell', () => {
            const r = HC.act.sellBee(ds.id);
            if (r.ok) toast(r.msg);
          }, true);
          return true;
        }
      },
      onSubmit: (form) => {
        if (form.dataset.form === 'rename') {
          HC.act.renameBee(id, $('#renameInput').value);
          renaming = false;
          renderModal();
        }
      },
    });
  }

  function addToHiveModal(hiveIdx) {
    openModal({
      render: () => {
        const s = S();
        const box = s.box.map((id) => {
          const b = s.bees[id];
          return `<button class="pick-row" data-act="pickAdd" data-id="${id}">${beeImg(b.sp, b.sparkle, 32)}<span class="grow"><b>${esc(b.name)}</b><span class="muted">${D.species[b.sp].name} · ${util.pct(b.vigor)}</span></span></button>`;
        }).join('');
        return `<h2>Add a bee to hive ${hiveIdx + 1}</h2>
          ${box ? `<div class="pick-list">${box}</div>` : '<p class="muted">Your bee box is empty. Buy bees at the Bee Market or hatch them in the Nursery.</p>'}
          <div class="btn-row end">${box ? '' : btn('Go to market', 'gotoMarket')}${btn('Close', 'closeModal', {}, { cls: 'btn-ghost' })}</div>`;

      onAct: (act, ds) => {
        if (act === 'pickAdd') {

  function shelfModal(i) {
    openModal({
      render: () => {
        const s = S();
        const sh = s.shelves[i];
        const onOther = new Set(s.shelves.filter((x, k) => k !== i).map((x) => x.good));
        const rows = D.GOODS.filter((g) => s.unlockedGoods[g.id]).reverse().map((g) => `
          <button class="pick-row ${sh.good === g.id ? 'selected' : ''}" data-act="pickGood" data-good="${g.id}">

            <span class="grow"><b>${g.name}</b><span class="muted">₵${fmt(f().price(s, g.id))} each · ${fmt(s.store[g.id] || 0)} in store${onOther.has(g.id) ? ' · also on another shelf' : ''}</span></span>
          </button>`).join('');
        return `<h2>Shelf ${i + 1}</h2><p class="muted">Pick what this shelf sells. Pricier goods need richer customers, and they come with reputation.</p>
          <div class="pick-list">${rows}</div>
          <div class="btn-row end">${sh.good ? btn('Clear shelf', 'pickGood', { good: '' }, { cls: 'btn-ghost' }) : ''}${btn('Close', 'closeModal', {}, { cls: 'btn-ghost' })}</div>`;
      },
      onAct: (act, ds) => {
        if (act === 'pickGood') {
          const r = HC.act.setShelf(i, ds.good || null);
          closeModal();

  function breedModal(slot) {
    const pick = { a: null, b: null };
    openModal({
      render: () => {
        const s = S();
        const busy = new Set(s.nursery.filter(Boolean).flatMap((n) => [n.a, n.b]));
        const bees = Object.values(s.bees).filter((b) => !busy.has(b.id))
          .sort((x, y) => D.species[y.sp].tier - D.species[x.sp].tier || y.vigor - x.vigor);
        const list = bees.map((b) => {
          const sel = pick.a === b.id ? 'A' : pick.b === b.id ? 'B' : '';
          return `<button class="bee-tile ${sel ? 'selected' : ''} ${b.sparkle ? 'is-sparkle' : ''}" data-act="pickParent" data-id="${b.id}">
            ${sel ? `<span class="sel-badge">${sel}</span>` : ''}
            ${beeImg(b.sp, b.sparkle, 32)}
            <span class="bee-name">${esc(b.name)}</span>
            <span class="bee-sub">${D.species[b.sp].name.replace(' Bee', '')} · ${util.pct(b.vigor)}</span>
          </button>`;
        }).join('');
        let preview = '<p class="muted">Choose two bees.</p>';
        let startBtn = '';
        if (pick.a && pick.b) {
          const a = s.bees[pick.a], b = s.bees[pick.b];
          const r = D.recipeFor(a.sp, b.sp);
          let outcome;
          if (a.sp === b.sp) outcome = `Another ${D.species[a.sp].name}, with vigor near ${util.pct((a.vigor + b.vigor) / 2 + 0.045)}.`;
          else if (r && s.discovered[r.out]) outcome = `${Math.round(r.p * 100)}% chance of a ${D.species[r.out].name}. Otherwise it takes after a parent.`;
          else if (r) outcome = '<b>These two feel close to something new…</b> Otherwise it takes after a parent.';
          else outcome = 'The egg will take after one of its parents.';
          const cost = f().breedCost(a, b);
          preview = `<div class="breed-preview">${beeImg(a.sp, a.sparkle, 40)}<span class="heart">+</span>${beeImg(b.sp, b.sparkle, 40)}
            <div class="grow"><p>${outcome}</p><p class="muted">Takes ${util.fmtTime(f().breedTime(a, b))} · costs ₵${fmt(cost)}</p></div></div>`;
          startBtn = btn(`Start ${price(cost)}`, 'startBreed', {}, { cost, cls: 'btn-go' });
        }
        return `<h2>Cradle ${slot + 1}: pick parents</h2>
          ${preview}
          <div class="bee-grid pick">${list}</div>
          <div class="btn-row end">${btn('Close', 'closeModal', {}, { cls: 'btn-ghost' })}${startBtn}</div>`;
      },
      onAct: (act, ds) => {
        if (act === 'pickParent') {
          const id = ds.id;
          if (pick.a === id) pick.a = null;
          else if (pick.b === id) pick.b = null;
          else if (!pick.a) pick.a = id;
          else if (!pick.b) pick.b = id;
          else pick.b = id;
          HC.audio.play('click');
          renderModal();
          return true;
        }
        if (act === 'startBreed') {
          const r = HC.act.startBreed(slot, pick.a, pick.b);
          if (r.ok) {
            closeModal();
            toast(r.msg);
          }
          return true;
        }
      },
    });
  }

          ${isNew ? `<p class="muted">${sp.flavor}</p><p>Makes <b>${D.good[sp.good].name}</b>, sold at ₵${fmt(f().price(S(), sp.good))} each.</p>` : ''}
