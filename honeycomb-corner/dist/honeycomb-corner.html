<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honeycomb Corner</title>
<meta name="description" content="A cozy pixel-art idle game: keep bees, breed new species, and run a honey shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
/* Layout: a handheld "screen" (scene + HUD + tabs) beside parchment menu
   windows; on phones the screen sits on top and the menus scroll beneath. */
:root {
  --night: #221a24;       /* page ground, dusk-aubergine */
  --night-2: #2f2431;     /* honeycomb pattern lines */
  --bezel: #3d2e36;       /* handheld shell */
  --bezel-hi: #56414b;
  --parch: #fff3d4;       /* menu window paper */
  --parch-2: #f5e0b0;     /* inset rows */
  --ink: #2b1d14;         /* outlines + text */
  --ink-soft: #6e5644;
  --honey: #f2b230;       /* accent */
  --amber: #d9771f;
  --leaf: #4f9a3f;
  --berry: #c8445a;
  --cream-text: #f8ead0;
  --focus: #7ad0f0;

  --font-display: 'Silkscreen', ui-monospace, 'Courier New', monospace;
  --font-body: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;

  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  /* Faint honeycomb: two offset hex-ish dot grids */
  background-image:
    radial-gradient(circle at 50% 50%, var(--night-2) 1.5px, transparent 2px),
    radial-gradient(circle at 50% 50%, var(--night-2) 1.5px, transparent 2px);
  background-size: 28px 48px;
  background-position: 0 0, 14px 24px;
  color: var(--cream-text);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.4;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.ico { vertical-align: -3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 40px;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}

/* ---- Masthead -------------------------------------------------------- */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.25rem, 4vw, 1.9rem);
  letter-spacing: 0.02em;
  margin: 0;
  color: var(--honey);
  text-shadow: 3px 3px 0 var(--ink), 0 0 0 var(--ink);
  display: flex; align-items: center; gap: 10px;
  text-wrap: balance;
}
.logo-mark {
  width: 22px; height: 24px; flex: none;
  background: var(--honey);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  box-shadow: inset 0 -6px 0 var(--amber);
}
.tagline { margin: 0; font-family: var(--font-display); font-size: var(--step--1); color: #b89c86; letter-spacing: 0.06em; text-transform: uppercase; }

/* ---- Stage: bezel, screen, HUD, tabs ------------------------------------ */
.stage { display: grid; gap: 10px; align-content: start; min-width: 0; }
.bezel {
  background: var(--bezel);
  border: 3px solid var(--ink);
  border-radius: 14px 14px 28px 14px;
  padding: 12px 12px 10px;
  box-shadow: inset 0 2px 0 var(--bezel-hi), 0 6px 0 rgba(0, 0, 0, 0.35);
}
.screen {
  position: relative;
  border: 3px solid var(--ink);
  border-radius: 4px;
  overflow: hidden;
  background: #000;
  line-height: 0;
}
#scene {
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  max-width: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
  touch-action: manipulation;
}

.textbox {
  position: absolute;
  left: 3%; right: 3%; bottom: 4%;
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch);
  padding: 10px 28px 10px 14px;
  line-height: 1.35;
  font-size: clamp(0.8rem, 2.4vw, 1.05rem);
  min-height: 3.4em;
  cursor: pointer;
}
.textbox p { margin: 0; }
.textbox .more {
  position: absolute; right: 12px; bottom: 9px;
  width: 0; height: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--amber);
  opacity: 0;
}
.textbox.done .more { opacity: 1; animation: bob 0.7s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

.hud {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 8px 4px 0;
  font-family: var(--font-display);
  font-size: var(--step--1);
  color: var(--cream-text);
  font-variant-numeric: tabular-nums;
}
.hud b { font-weight: 700; }
.hud-coins { font-size: var(--step-1); display: flex; align-items: center; gap: 6px; color: var(--honey); margin-right: auto; }
.hud-coins .ico { width: 20px; height: 20px; }
.hud-item { display: flex; align-items: center; gap: 5px; }
.hud .lbl { color: #b89c86; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
.stars { display: inline-flex; gap: 1px; }
.season-chip { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.season-chip:hover b { text-decoration: underline; }
.season-dot { width: 10px; height: 10px; border: 2px solid var(--ink); display: inline-block; }
.season-spring { background: #f8b8d0; }
.season-summer { background: #f8d030; }
.season-autumn { background: #e8702a; }
.season-winter { background: #e8eef4; }

.goalbar { margin-top: 8px; }
.goal-inner {
  display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
  background: rgba(0, 0, 0, 0.22);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 6px 8px 6px 10px;
  min-height: 40px;
}
.goal-label { font-family: var(--font-display); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--honey); white-space: nowrap; }
.goal-text { flex: 1; min-width: 10em; font-size: var(--step--1); background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: help; }
.goal-text:hover { text-decoration: underline dotted; }
.goal-reward { display: inline-flex; align-items: center; gap: 4px; font-size: var(--step--1); color: #b89c86; font-variant-numeric: tabular-nums; }
.goal-reward .ico { width: 14px; height: 14px; vertical-align: 0; }

.tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 4px;
}
.tabs button {
  position: relative;
  background: var(--bezel);
  border: 2px solid var(--ink);
  border-radius: 6px 6px 3px 3px;
  padding: 8px 2px;
  font-family: var(--font-display);
  font-size: clamp(0.62rem, 2.2vw, 0.8rem);
  color: #d8c4ae;
  cursor: pointer;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tabs button:hover { color: var(--parch); }
.tabs button.on { background: var(--honey); color: var(--ink); box-shadow: inset 0 -3px 0 var(--amber); }
.tabs button.badge::after {
  content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px;
  background: var(--berry); border: 1px solid var(--ink);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* ---- Panel windows --------------------------------------------------- */
.panel { display: grid; gap: 14px; align-content: start; min-width: 0; }
.win {
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch), 0 5px 0 rgba(0, 0, 0, 0.35);
  padding: 14px 16px 16px;
  min-width: 0;
}
.win > * + * { margin-top: 10px; }
.win p { margin: 0; }
.win-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.win h2, .modal h2 {
  font-family: var(--font-display);
  font-size: var(--step-1);
  margin: 0;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
h3 { font-size: var(--step-0); margin: 0; font-weight: 600; }
.muted { color: var(--ink-soft); }
.small { font-size: var(--step--1); }
.grow { flex: 1; min-width: 0; }
.empty-note { padding: 6px 0; }
.stack { display: grid; gap: 10px; }
.list { display: grid; gap: 2px; }

.card {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 10px 12px;
}
.card-head { display: flex; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap; }
.card-head img { width: 32px; height: 32px; }
.hive-card { display: grid; gap: 10px; }
.hive-card.flash { animation: flash 0.3s steps(2) 3; }
@keyframes flash { 50% { background: var(--honey); } }

.row-item {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 4px;
  border-bottom: 2px dashed rgba(43, 29, 20, 0.2);
}
.row-item:last-child { border-bottom: 0; }
.row-item.locked { opacity: 0.6; }
.row-item p { font-size: var(--step--1); }

/* ---- Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  background: var(--honey);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 5px;
  padding: 7px 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  transition: transform 60ms;
}
.btn:hover { background: #f8c450; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .ico { width: 14px; height: 14px; vertical-align: 0; }
.btn-sm { padding: 5px 9px; font-size: var(--step--1); }
.btn-go { background: #8cd06a; }
.btn-go:hover { background: #a2dc82; }
.btn-ghost { background: var(--parch); }
.btn-ghost:hover { background: #fff; }
.btn-danger { background: #f09080; }
.btn.cant, .btn:disabled { background: #d8ccb4; color: #8a7a6a; box-shadow: 0 3px 0 #8a7a6a; border-color: #8a7a6a; cursor: not-allowed; }
.btn.cant .ico { opacity: 0.55; }
.btn.shake { animation: shake 0.25s steps(4); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.center { justify-content: center; }
.link { background: none; border: 0; padding: 2px 4px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: var(--step--1); }

.chip {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.66rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 1px 6px;
  border: 2px solid var(--ink);
  border-radius: 3px;
  background: var(--parch);
  vertical-align: 1px;
  white-space: nowrap;
}
.chip-common { background: #e8e0cc; }
.chip-uncommon { background: #b8e0a0; }
.chip-rare { background: #a8d0f0; }
.chip-epic { background: #d0b0f0; }
.chip-legendary { background: #f8d060; }
.chip-sparkle { background: #f8b8d0; }

.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 4px;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 12px;
  font-size: var(--step--1);
  font-variant-numeric: tabular-nums;
}

.bar { display: block; height: 8px; background: #e0cda0; border: 2px solid var(--ink); border-radius: 2px; overflow: hidden; min-width: 40px; }
.bar.big { height: 12px; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--honey); box-shadow: inset 0 -2px 0 var(--amber); transition: width 0.25s steps(6); }

/* ---- Bees ------------------------------------------------------------ */
.bee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.bee-grid > p { grid-column: 1 / -1; }
.bee-grid.pick { max-height: 46vh; overflow-y: auto; padding: 4px; }
.bee-tile {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--parch);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 8px 4px 6px;
  cursor: pointer;
  min-width: 0;
  box-shadow: 0 2px 0 rgba(43, 29, 20, 0.35);
}
.bee-tile:hover { background: #fffaf0; }
.bee-tile .bee-img { width: 40px; height: 40px; }
.bee-name { font-weight: 600; font-size: var(--step--1); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bee-sub { font-size: 0.72rem; color: var(--ink-soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bee-tile.empty { border-style: dashed; background: transparent; box-shadow: none; justify-content: center; min-height: 86px; }
.bee-tile.empty .plus { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; color: var(--ink-soft); }
.bee-tile.selected { background: #fff4b0; outline: 3px solid var(--amber); outline-offset: -1px; }
.bee-tile.is-sparkle { background: linear-gradient(160deg, #fff4fa, #fde6c8); }
.sel-badge {
  position: absolute; top: -8px; left: -6px;
  background: var(--amber); color: var(--ink);
  font-family: var(--font-display); font-size: 0.7rem;
  border: 2px solid var(--ink); border-radius: 3px; padding: 0 5px;
}
.mystery { filter: brightness(0) opacity(0.45); }

.merchant-card {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(90deg, #dbe8f4, #efe2f7);
  border: 2px solid var(--ink); border-radius: 6px; padding: 10px 12px;
}
.merchant-card img { width: 48px; height: 48px; }

/* ---- Shop ------------------------------------------------------------ */
.shelf-tile {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  text-align: left;
  background: var(--parch-2);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
}
.shelf-tile:hover { background: #fbe9c0; }
.shelf-tile img { width: 28px; height: 28px; }
.shelf-num { font-family: var(--font-display); font-size: var(--step--1); color: var(--ink-soft); width: 1.2em; }
.shelf-empty { width: 28px; font-size: 0.7rem; color: var(--ink-soft); text-align: center; }
.shelf-info { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.shelf-info .muted { font-size: var(--step--1); }

.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.store-item {
  display: grid; justify-items: center; gap: 3px;
  background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 6px;
  font-variant-numeric: tabular-nums;
}
.store-item img { width: 28px; height: 28px; }
.store-item .bar { width: 100%; }
.store-qty { font-weight: 600; font-size: var(--step--1); }

/* ---- Nursery --------------------------------------------------------- */
.cradle .egg { width: 40px; height: 40px; }
.cradle.ready { background: #fff2b8; animation: glow 1.2s steps(2) infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--honey); } }
.parents { display: flex; align-items: center; gap: 2px; }
.parents img { width: 36px; height: 36px; }
.heart { font-family: var(--font-display); color: var(--berry); padding: 0 2px; }
.recipes { display: grid; gap: 6px; }
.recipe { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--step--1); }
.recipe img { width: 28px; height: 28px; }
.breed-preview { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 10px; }
.breed-preview img { width: 44px; height: 44px; }

/* ---- Town ------------------------------------------------------------ */
.order img { width: 36px; height: 36px; }
.order-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---- Guide ----------------------------------------------------------- */
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.guide-cell {
  position: relative;
  display: grid; justify-items: center; gap: 4px;
  background: linear-gradient(#fbecc4, var(--parch-2));
  border: 2px solid var(--ink); border-radius: 6px;
  padding: 10px 6px 8px;
  cursor: pointer;
  min-width: 0;
}
.guide-cell.unknown { background: #e6d6b0; }
.guide-cell .bee-img { width: 56px; height: 56px; }
.guide-no { position: absolute; top: 4px; left: 6px; font-family: var(--font-display); font-size: 0.62rem; color: var(--ink-soft); }
.sparkle-dot { position: absolute; top: 3px; right: 6px; color: #d0508a; }
.stats { display: grid; gap: 0; }
.stat-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 2px; border-bottom: 2px dotted rgba(43, 29, 20, 0.2); font-variant-numeric: tabular-nums; }
.stat-row:last-child { border-bottom: 0; }
.stat-row b { text-align: right; font-weight: 600; }

/* ---- Menu ------------------------------------------------------------ */
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--amber); }
textarea {
  width: 100%;
  margin-top: 6px;
  font-family: ui-monospace, monospace;
  font-size: 0.72rem;
  background: #fffaf0;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 6px;
  word-break: break-all;
}
#saveArea .btn { margin-top: 6px; }

/* ---- Modal ----------------------------------------------------------- */
.modal {
  position: fixed; inset: 0;
  background: rgba(20, 12, 18, 0.72);
  display: grid; place-items: center;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  z-index: 20;
}
.modal-card {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  background: var(--parch);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px var(--honey), inset 0 0 0 4px var(--parch), 0 8px 0 rgba(0, 0, 0, 0.4);
  padding: 18px 18px 16px;
  animation: pop 0.14s steps(3);
}
@keyframes pop { from { transform: scale(0.94); } }
#modalBody > * + * { margin-top: 12px; }
#modalBody p { margin: 0; }
.modal h3.sub { font-family: var(--font-display); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
.eyebrow { font-family: var(--font-display); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); }
.bee-hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bee-hero .bee-img { width: 96px; height: 96px; background: var(--parch-2); border: 2px solid var(--ink); border-radius: 8px; }
.bee-hero.is-sparkle .bee-img { background: linear-gradient(160deg, #fff4fa, #fde6c8); }
.rename { display: flex; gap: 6px; }
.rename input { font: inherit; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 4px; background: #fffaf0; color: var(--ink); width: 11em; }
.pick-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; padding: 2px; }
.pick-row {
  display: flex; align-items: center; gap: 10px;
  text-align: left; width: 100%;
  background: var(--parch-2); border: 2px solid var(--ink); border-radius: 6px;
  padding: 8px 10px; cursor: pointer;
}
.pick-row:hover { background: #fbe9c0; }
.pick-row.selected { outline: 3px solid var(--amber); outline-offset: -1px; }
.pick-row .grow { display: flex; flex-direction: column; }
.pick-row .muted { font-size: var(--step--1); }
.pick-row img { width: 32px; height: 32px; }

.reveal { text-align: center; display: grid; justify-items: center; gap: 8px; }
.reveal .bee-img { width: 128px; height: 128px; }
.reveal.is-sparkle { background: radial-gradient(circle, #fff0f6 0%, transparent 70%); }
.pop { animation: hatch 0.6s steps(6); }
@keyframes hatch { 0% { transform: scale(0.2) rotate(-20deg); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* ---- Toasts ---------------------------------------------------------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 6px; justify-items: center;
  z-index: 30; pointer-events: none;

<script>
// Shared helpers. Every module hangs off the global HC namespace so the game
// runs from plain <script> tags with no build step.
(function () {
  const HC = (window.HC = window.HC || {});

  const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];

  const util = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    chance: (p) => Math.random() < p,

    weighted(items, weightFn) {
      let total = 0;
      const ws = items.map((it) => {
        const w = Math.max(0, weightFn(it));
        total += w;
        return w;
      });
      if (total <= 0) return null;
      let r = Math.random() * total;
      for (let i = 0; i < items.length; i++) {
        r -= ws[i];
        if (r <= 0) return items[i];
      }
      return items[items.length - 1];
    },

    gauss() {
      let u = 0, v = 0;
      while (!u) u = Math.random();
      while (!v) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },

    // Deterministic PRNG so garden layout is identical every load.
    seeded(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },

    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    },

    uid() {
      return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
    },

    // 1234 -> "1,234"; 12345 -> "12.3K"; 1.5e9 -> "1.50B"
    fmt(n) {
      if (!isFinite(n)) return '∞';
      const neg = n < 0;
      n = Math.abs(n);
      let out;
      if (n < 10000) {
        out = n < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toLocaleString('en-US');
      } else {
        let i = 0;
        while (n >= 1000 && i < SUFFIXES.length - 1) {
          n /= 1000;
          i++;
        }
        out = (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + SUFFIXES[i];
      }
      return (neg ? '-' : '') + out;
    },

    // Short form used by the in-canvas bitmap font (only digits, K/M/B/T and '.').
    fmtShort(n) {
      n = Math.floor(n);
      if (n < 1000) return String(n);
      let i = 0;
      while (n >= 1000 && i < 4) {
        n /= 1000;
        i++;
      }
      return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + ' KMBT'[i];
    },

    fmtTime(s) {
      s = Math.max(0, Math.ceil(s));
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return m + 'm ' + String(r).padStart(2, '0') + 's';
      const h = Math.floor(m / 60);
      return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    },

    pct: (v) => Math.round(v * 100) + '%',

    esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    // Storage can be missing or throw (private mode, sandboxed previews).
    store: {
      get(k) {
        try { return window.localStorage.getItem(k); } catch (e) { return null; }
      },
      set(k, v) {
        try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; }
      },
      del(k) {
        try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
      },
    },
  };

  // Tiny pub/sub used by the sim to notify the UI, audio and renderer.
  const handlers = {};
  HC.bus = {
    on(evt, fn) {
      (handlers[evt] = handlers[evt] || []).push(fn);
    },
    emit(evt, payload) {
      (handlers[evt] || []).forEach((fn) => fn(payload));
      (handlers['*'] || []).forEach((fn) => fn(evt, payload));
    },
  };

  HC.util = util;
})();

</script>

    HAIR, SHIRTS, SKIN, BEE_NAMES, REQUESTERS, TIPS,
    good: byId(GOODS),
    species: byId(SPECIES),
    upgrade: byId(UPGRADES),
    customer: byId(CUSTOMERS),
    DAY_LENGTH: 480, // seconds per in-game day
    SEASON_DAYS: 4,
    OFFLINE_CAP: 8 * 3600,
    FESTIVAL_AT: 1e7,
    SAVE_KEY: 'honeycomb-corner-save-v1',
  };

  HC.data.recipeFor = function (a, b) {
    return RECIPES.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a)) || null;
  };
})();

<script>
// Game state: creation, bee factory, save/load and import/export.
(function () {
  const HC = window.HC;
  const { util, data } = HC;

  function newGame() {
    const s = {
      v: 1,
      created: Date.now(),
      lastSeen: Date.now(),
      coins: 20,
      lifetime: 0, // coins earned across all festivals
      runEarned: 0, // coins earned since the last festival
      ribbons: 0,
      festivals: 0,
      rep: 1,
      time: data.DAY_LENGTH * 0.12, // start in the morning
      playTime: 0,
      hives: [{ level: 0, bees: [] }],
      bees: {},
      box: [],
      store: { wildflower: 6 },
      unlockedGoods: { wildflower: true },
      shelves: [{ good: 'wildflower', qty: 0 }],
      up: {},
      market: { meadow: 0, clover: 0 },
      discovered: { meadow: true },
      sparkleSeen: {},
      triedPairs: {},
      nursery: [null],
      orders: [],
      nextOrderAt: 70,
      merchant: null,
      nextMerchantAt: 360,
      stats: { sold: 0, customers: 0, disappointed: 0, bred: 0, hatched: 0, orders: 0, best: 0 },
      hints: {},
      settings: { sfx: true, music: false },
      keepsake: null,
      goal: 0,
    };
    for (const u of data.UPGRADES) s.up[u.id] = 0;
    const a = makeBee(s, 'meadow', { vigor: 1 });
    const b = makeBee(s, 'meadow', { vigor: 0.95 });
    s.hives[0].bees.push(a.id, b.id);
    return s;
  }

  function makeBee(s, sp, opts = {}) {
    const used = new Set(Object.values(s.bees).map((b) => b.name));
    const free = data.BEE_NAMES.filter((n) => !used.has(n));
    let name = free.length ? util.pick(free) : util.pick(data.BEE_NAMES);
    // Pool exhausted: add a generation-style suffix, e.g. "Pip II".
    for (let k = 2; used.has(name); k++) name = name.replace(/ [IVX]+$/, '') + ' ' + ['II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][Math.min(k - 2, 8)];
    const bee = {
      id: util.uid(),
      sp,
      name,
      vigor: opts.vigor != null ? opts.vigor : util.rand(0.85, 1.15),
      sparkle: !!opts.sparkle,
      trait: opts.trait || null,
      gen: opts.gen || 1,
      prog: Math.random(),
      born: Date.now(),
    };
    s.bees[bee.id] = bee;
    s.discovered[sp] = true;
    if (bee.sparkle) s.sparkleSeen[sp] = true;
    const good = data.species[sp].good;
    if (!s.unlockedGoods[good]) {
      s.unlockedGoods[good] = true;
      // A brand-new product goes straight onto an empty shelf if there is one.
      const empty = s.shelves.find((sh) => !sh.good);
      if (empty) empty.good = good;
    }
    return bee;
  }

  // Fill any fields missing from older saves with defaults, so new features
  // never crash an existing save.
  function migrate(loaded) {
    const base = newGame();
    const s = Object.assign(base, loaded);
    s.up = Object.assign({}, newGame().up, loaded.up || {});
    s.stats = Object.assign({}, base.stats, loaded.stats || {});
    s.settings = Object.assign({ sfx: true, music: false }, loaded.settings || {});
    s.market = Object.assign({ meadow: 0, clover: 0 }, loaded.market || {});
    // Drop references to bees that no longer exist.
    s.hives.forEach((h) => (h.bees = h.bees.filter((id) => s.bees[id])));
    s.box = s.box.filter((id) => s.bees[id]);
    while (s.nursery.length < 1 + (s.up.nursery || 0)) s.nursery.push(null);
    while (s.shelves.length < 1 + (s.up.shelf || 0)) s.shelves.push({ good: null, qty: 0 });
    return s;
  }

  function serialize(s) {
    s.lastSeen = Date.now();
    return JSON.stringify(s);
  }

  function deserialize(str) {
    const obj = JSON.parse(str);
    if (!obj || typeof obj !== 'object' || !obj.hives || !obj.bees) throw new Error('Not a Honeycomb Corner save');
    return migrate(obj);
  }

  function save(s) {
    return util.store.set(data.SAVE_KEY, serialize(s));
  }

  function load() {
    const raw = util.store.get(data.SAVE_KEY);
    if (!raw) return null;
    try {
      return deserialize(raw);
    } catch (e) {
      console.warn('Save could not be read, starting fresh.', e);
      return null;
    }
  }

  function exportSave(s) {
    // btoa needs Latin-1; encode UTF-8 first so bee names with accents survive.
    return btoa(unescape(encodeURIComponent(serialize(s))));
  }

  function importSave(code) {
    const json = decodeURIComponent(escape(atob(code.trim())));
    return deserialize(json);
  }

  HC.state = { newGame, makeBee, migrate, serialize, deserialize, save, load, exportSave, importSave };
})();

<script>
// Simulation: formulas, production, customers, nursery, orders, merchant.
// Pure game logic. It never touches the DOM; it emits events on HC.bus.
(function () {
  const HC = window.HC;
  const { util, data, bus } = HC;
  const D = data;

  // ---- Scene layout (240x160, 16px tiles) shared with the renderer ---------
  const layout = {
    W: 240, H: 160, T: 16,
    doorX: 152, streetY: 152, doorY: 136, insideY: 120, aisleY: 40,
    corridorX: 168, turnY: 56,
    keeper: { x: 216, y: 99 },
    shelfX: (i) => (7 + i) * 16 + 8,
    queueSlot: (i) => (i < 3 ? { x: 216 - 16 * i, y: 120 } : { x: 184, y: 104 - 16 * (i - 3) }),
    hiveSlots: [[1, 1], [4, 1], [1, 4], [4, 4], [1, 7], [4, 7]],
    wagon: { x: 40, y: 152 },
  };

  // ---- Formulas -------------------------------------------------------------
  const f = {
    dayPhase: (s) => (s.time % D.DAY_LENGTH) / D.DAY_LENGTH,
    isNight(s) {
      const p = f.dayPhase(s);
      return p >= 0.7 && p < 0.95;
    },
    season(s) {
      const len = D.DAY_LENGTH * D.SEASON_DAYS;
      return D.SEASONS[Math.floor(s.time / len) % 4];
    },
    seasonLeft(s) {
      const len = D.DAY_LENGTH * D.SEASON_DAYS;
      return len - (s.time % len);
    },
    day: (s) => Math.floor(s.time / D.DAY_LENGTH) + 1,
    hiveCap: (h) => 3 + h.level,
    hiveCost: (s) => D.HIVE_COSTS[s.hives.length],
    hiveUpgradeCost: (s, i) => Math.ceil(100 * Math.pow(3, s.hives[i].level) * Math.pow(1 + i, 1.4)),
    upgradeCost(s, id) {
      const u = D.upgrade[id];
      return Math.ceil(u.base * Math.pow(u.growth, s.up[id] || 0));
    },
    storageCap: (s) => Math.floor(40 * (1 + 0.6 * s.up.storage)),
    shelfCap: () => 6,
    boxCap: (s) => 10 + 4 * s.up.beebox,
    priceMult: (s) => (1 + 0.08 * s.up.labels) * (1 + 0.1 * s.ribbons),
    price(s, goodId, mult = 1) {
      const se = f.season(s);
      let m = mult * (1 + (se.price || 0));
      if (goodId === 'candle' && se.candle) m *= 1 + se.candle;
      return Math.max(1, Math.round(D.good[goodId].price * f.priceMult(s) * m));
    },
    cartRate: (s) => (s.up.cart ? 0.2 + 0.05 * (s.up.cart - 1) : 0),
    checkoutTime: (s) => 1.4 * Math.pow(0.88, s.up.register),

    hiveMult(s, h) {
      let nurse = 0;
      for (const id of h.bees) {
        const sp = D.species[s.bees[id].sp];
        if (sp.aura && sp.aura.hive) nurse += sp.aura.hive;
      }
      return 1 + 0.15 * h.level + nurse;
    },

    beeRate(s, bee, h, night) {
      const sp = D.species[bee.sp];
      let r = (1 / sp.secs) * bee.vigor * (bee.sparkle ? 2 : 1);
      r *= f.hiveMult(s, h) * (1 + 0.08 * s.up.flowers) * (1 + (f.season(s).prod || 0));
      const t = bee.trait && D.TRAITS[bee.trait];
      if (t) {
        if (t.prod) r *= 1 + t.prod;
        if (t.night && night) r *= 1 + t.night;
        if (t.day && !night) r *= 1 + t.day;
      }
      if (sp.nightBonus && night) r *= 1 + sp.nightBonus;
      return r;
    },

    // Units per second of each good across all hives.
    goodRates(s) {
      const night = f.isNight(s);
      const out = {};
      for (const h of s.hives) {
        for (const id of h.bees) {
          const bee = s.bees[id];
          const g = D.species[bee.sp].good;
          out[g] = (out[g] || 0) + f.beeRate(s, bee, h, night);
        }
      }
      return out;
    },

    customerBoost(s) {
      let b = 0.15 * s.up.sign + (f.season(s).customers || 0);
      for (const h of s.hives) {
        for (const id of h.bees) {
          const bee = s.bees[id];
          const sp = D.species[bee.sp];
          if (sp.aura && sp.aura.customers) b += sp.aura.customers;
          if (bee.trait === 'charming') b += D.TRAITS.charming.customers;
        }
      }
      return b;
    },
    spawnInterval: (s) => Math.max(0.8, 9 / (1 + 0.2 * s.rep) / (1 + f.customerBoost(s))),

    marketUnlocked(s, sp) {
      if (sp === 'meadow') return true;
      if (sp === 'clover') return s.lifetime >= 120 || !!s.discovered.clover;
      return false;
    },
    marketPrice(s, sp) {
      const n = s.market[sp] || 0;
      return sp === 'meadow' ? Math.ceil(25 * Math.pow(1.18, n)) : Math.ceil(120 * Math.pow(1.2, n));
    },
    beeValue: (bee) => 20 * Math.pow(3, D.species[bee.sp].tier) * bee.vigor * (bee.sparkle ? 5 : 1),
    sellPrice: (bee) => Math.ceil(f.beeValue(bee) * 0.4),
    maxTier: (a, b) => Math.max(D.species[a.sp].tier, D.species[b.sp].tier),
    breedCost: (a, b) => Math.ceil(40 * Math.pow(3.4, f.maxTier(a, b))),
    breedTime: (a, b) => Math.round(20 * Math.pow(1 + f.maxTier(a, b), 1.6)),

    beeCount: (s) => Object.keys(s.bees).length,
    hiveOf(s, beeId) {
      return s.hives.findIndex((h) => h.bees.includes(beeId));
    },
    festivalRibbons: (s) => (s.runEarned >= D.FESTIVAL_AT ? Math.floor(2 * Math.sqrt(s.runEarned / D.FESTIVAL_AT)) : 0),
    bestStockedTier(s) {
      let best = -1;
      for (const sh of s.shelves) if (sh.good && sh.qty > 0) best = Math.max(best, D.good[sh.good].tier);
      return best;
    },
  };

  // ---- Runtime (not saved) --------------------------------------------------
  const rt = {
    customers: [],
    queue: [],
    fx: [],
    spawnT: 3,
    income: [], // [gameTime, amount] for the last 60s
    clock: 0,
    drip: null, // { hive, left } a golden drop waiting to be tapped
    dripT: 45,
  };

  function earn(s, amt, x, y) {
    if (amt <= 0) return;
    s.coins += amt;
    s.lifetime += amt;
    s.runEarned += amt;
    rt.income.push([rt.clock, amt]);
    if (x != null) rt.fx.push({ kind: 'text', x, y, text: '+' + util.fmtShort(amt), t: 0, life: 1.4 });
  }

  function incomePerMin() {
    const cutoff = rt.clock - 60;
    while (rt.income.length && rt.income[0][0] < cutoff) rt.income.shift();
    let sum = 0;
    for (const [, a] of rt.income) sum += a;
    const span = Math.min(60, Math.max(10, rt.clock - (rt.income[0] ? rt.income[0][0] : rt.clock)));
    return (sum / span) * 60;
  }

  function addGood(s, g, n) {
    if (n <= 0) return;
    s.unlockedGoods[g] = true;
    const cap = f.storageCap(s);
    const have = s.store[g] || 0;
    const put = Math.min(n, Math.max(0, cap - have));
    s.store[g] = have + put;
    const over = n - put;
    if (over > 0 && s.up.cart) earn(s, over * f.price(s, g) * f.cartRate(s));
  }

  function restock(s) {
    const cap = f.shelfCap(s);
    for (const sh of s.shelves) {
      if (!sh.good) continue;
      const need = cap - sh.qty;
      if (need <= 0) continue;
      const take = Math.min(need, s.store[sh.good] || 0);
      if (take > 0) {
        sh.qty += take;
        s.store[sh.good] -= take;
      }
    }
  }

  function produce(s, dt) {
    const night = f.isNight(s);
    for (const h of s.hives) {
      for (const id of h.bees) {
        const bee = s.bees[id];
        bee.prog += f.beeRate(s, bee, h, night) * dt;
        if (bee.prog >= 1) {
          const n = Math.floor(bee.prog);
          bee.prog -= n;
          addGood(s, D.species[bee.sp].good, n);
        }
      }
    }
  }

  function rollCustomerType(s) {
    return util.weighted(D.CUSTOMERS, (c) => c.weight + (c.repWeight || 0) * s.rep);
  }

  function chooseShelf(s, ctype) {
    const best = f.bestStockedTier(s);
    if (best < 0) return -1;
    const maxTier = Math.max(0, best - ctype.offset);
    const idx = [];
    s.shelves.forEach((sh, i) => {
      if (sh.good && sh.qty > 0 && D.good[sh.good].tier <= maxTier) idx.push(i);
    });
    if (!idx.length) return -1;
    const pick = util.weighted(idx, (i) => {
      const p = D.good[s.shelves[i].good].price;
      return ctype.id === 'collector' ? Math.pow(p, 1.5) : Math.sqrt(p);
    });
    return pick == null ? -1 : pick;
  }

  function unitsWanted(s, ctype) {
    let n = util.randInt(ctype.units[0], ctype.units[1]);
    for (let i = 0; i < s.up.samples; i++) if (Math.random() < 0.1) n++;
    return n;
  }

  function repGain(s) {
    s.rep = Math.min(5, s.rep + 0.02 * (1 - s.rep / 5.5));
  }
  function repLoss(s, amt = 0.04) {
    s.rep = Math.max(0, s.rep - amt);
  }

  function makeLook(ctype) {
    const hair = util.pick(D.HAIR), skin = util.pick(D.SKIN);
    const shirt = ctype.shirt || util.pick(D.SHIRTS);
    return { hair, skin, shirt, hat: ctype.hat };
  }

  function exitPath(fromY) {
    const side = Math.random() < 0.5 ? -12 : layout.W + 12;
    const p = [];
    if (fromY < layout.insideY) p.push({ x: layout.doorX, y: layout.insideY });
    p.push({ x: layout.doorX, y: layout.doorY }, { x: layout.doorX, y: layout.streetY }, { x: side, y: layout.streetY });
    return p;
  }

  function spawnCustomer(s) {
    const ctype = rollCustomerType(s);
    const fromLeft = Math.random() < 0.5;
    const c = {
      id: util.uid(),
      type: ctype,
      look: makeLook(ctype),
      x: fromLeft ? -12 : layout.W + 12,
      y: layout.streetY,
      dir: fromLeft ? 'right' : 'left',
      walk: 0,
      speed: util.rand(26, 34),
      state: 'enter',
      path: [
        { x: layout.doorX, y: layout.streetY },
        { x: layout.doorX, y: layout.doorY },
        { x: layout.doorX, y: layout.insideY },
        { x: layout.doorX, y: layout.aisleY },
      ],
      shelf: -1,
      retries: 0,
      bubble: null,
      timer: 0,
    };
    rt.customers.push(c);
  }

  function leaveUnhappy(s, c) {
    c.bubble = { kind: 'dots', t: 0 };
    c.state = 'leave';
    c.path = exitPath(c.y);
    repLoss(s);
    s.stats.disappointed++;
    bus.emit('disappointed', c);
  }

  function moveAlong(c, dt) {
    if (!c.path.length) return true;
    const tgt = c.path[0];
    const dx = tgt.x - c.x, dy = tgt.y - c.y;
    const dist = Math.hypot(dx, dy);
    const step = c.speed * dt;
    if (Math.abs(dx) > Math.abs(dy)) c.dir = dx > 0 ? 'right' : 'left';
    else if (dist > 0.01) c.dir = dy > 0 ? 'down' : 'up';
    if (dist <= step) {
      c.x = tgt.x;
      c.y = tgt.y;
      c.path.shift();
    } else {
      c.x += (dx / dist) * step;
      c.y += (dy / dist) * step;
    }
    c.walk += dt;
    return c.path.length === 0;
  }

  function goToShelf(c, idx) {
    c.shelf = idx;
    c.state = 'toShelf';
    c.path = [{ x: layout.shelfX(idx), y: layout.aisleY }];
  }

  function updateCustomer(s, c, dt) {
    if (c.bubble) {
      c.bubble.t += dt;
      if (c.bubble.kind !== 'good' && c.bubble.t > 1.6) c.bubble = null;
    }
    switch (c.state) {
      case 'enter':
        if (moveAlong(c, dt)) {
          const idx = chooseShelf(s, c.type);
          if (idx < 0) leaveUnhappy(s, c);
          else goToShelf(c, idx);
        }
        break;
      case 'toShelf':
        if (moveAlong(c, dt)) {
          c.state = 'browse';
          c.dir = 'up';
          c.timer = util.rand(0.9, 1.7);
          const sh = s.shelves[c.shelf];
          c.bubble = sh.good ? { kind: 'good', good: sh.good, t: 0 } : null;
        }
        break;
      case 'browse': {
        c.timer -= dt;
        if (c.timer > 0) break;
        c.bubble = null;
        const sh = s.shelves[c.shelf];
        const maxTier = Math.max(0, f.bestStockedTier(s) - c.type.offset);
        if (sh && sh.good && sh.qty > 0 && D.good[sh.good].tier <= maxTier) {
          const take = Math.min(unitsWanted(s, c.type), sh.qty);
          sh.qty -= take;
          c.bought = { good: sh.good, qty: take };
          c.total = f.price(s, sh.good, c.type.mult || 1) * take;
          rt.queue.push(c);
          c.state = 'toQueue';
          const slot = layout.queueSlot(rt.queue.length - 1);
          const sx = layout.shelfX(c.shelf);
          c.path = [
            { x: sx, y: layout.turnY },
            { x: layout.corridorX, y: layout.turnY },
            { x: layout.corridorX, y: slot.y },
            { x: slot.x, y: slot.y },
          ];
          c.bubble = { kind: 'heart', t: 0 };
        } else if (c.retries < 1) {
          c.retries++;
          const idx = chooseShelf(s, c.type);
          if (idx < 0) leaveUnhappy(s, c);
          else goToShelf(c, idx);
        } else leaveUnhappy(s, c);
        break;
      }
      case 'toQueue':
        if (moveAlong(c, dt)) c.state = 'queue';
        break;
      case 'queue': {
        const qi = rt.queue.indexOf(c);
        const slot = layout.queueSlot(qi);
        if (Math.abs(c.x - slot.x) > 0.5 || Math.abs(c.y - slot.y) > 0.5) {
          c.path = [slot];
          moveAlong(c, dt);
        } else {
          c.dir = qi === 0 ? 'up' : qi < 3 ? 'right' : 'down';
          if (qi === 0) {
            c.state = 'pay';
            c.timer = f.checkoutTime(s);
          }
        }
        break;
      }
      case 'pay':
        c.timer -= dt;
        if (c.timer <= 0) {
          earn(s, c.total, layout.keeper.x, layout.keeper.y - 14);
          s.stats.sold += c.bought.qty;
          s.stats.customers++;
          s.stats.best = Math.max(s.stats.best, c.total);
          repGain(s);
          rt.queue.shift();
          c.state = 'exit';
          c.path = exitPath(c.y);
          bus.emit('sale', c);
        }
        break;
      case 'exit':
      case 'leave':
        if (moveAlong(c, dt)) c.done = true;
        break;
    }
  }

  function updateCustomers(s, dt) {
    rt.spawnT -= dt;
    if (rt.spawnT <= 0) {
      rt.spawnT = f.spawnInterval(s) * util.rand(0.7, 1.3);
      if (rt.customers.length < 14) spawnCustomer(s);
    }
    for (const c of rt.customers) updateCustomer(s, c, dt);
    rt.customers = rt.customers.filter((c) => !c.done);
  }

  // Offline and background-tab customers skip the walking and buy instantly.
  function instantCustomers(s, dt, efficiency) {
    rt.offlineAcc = (rt.offlineAcc || 0) + (dt / f.spawnInterval(s)) * efficiency;
    let earned = 0;
    while (rt.offlineAcc >= 1) {
      rt.offlineAcc -= 1;
      const ctype = rollCustomerType(s);
      restock(s);
      const idx = chooseShelf(s, ctype);
      if (idx < 0) {
        s.stats.disappointed++;
        repLoss(s, 0.01);
        continue;
      }
      const sh = s.shelves[idx];
      const take = Math.min(unitsWanted(s, ctype), sh.qty);
      sh.qty -= take;
      const amt = f.price(s, sh.good, ctype.mult || 1) * take;
      s.coins += amt;
      s.lifetime += amt;
      s.runEarned += amt;
      earned += amt;
      s.stats.sold += take;
      s.stats.customers++;
      repGain(s);
    }
    return earned;
  }

  // ---- Nursery -------------------------------------------------------------
  function updateNursery(s, dt) {
    s.nursery.forEach((slot, i) => {
      if (!slot || slot.ready) return;
      slot.t += dt * (1 + (f.season(s).breed || 0));
      if (slot.t >= slot.dur) {
        slot.ready = true;
        bus.emit('eggReady', i);
        bus.emit('dirty');
      }
    });
  }

  function decideEgg(s, a, b) {
    let sp;
    const key = [a.sp, b.sp].sort().join('+');
    const recipe = D.recipeFor(a.sp, b.sp);
    if (a.sp === b.sp) sp = a.sp;
    else if (recipe) {
      const fails = s.triedPairs[key] || 0;
      // Pity timer: after 4 misses the new species is guaranteed.
      if (fails >= 4 || Math.random() < recipe.p) {
        sp = recipe.out;
        s.triedPairs[key] = 0;
      } else {
        sp = Math.random() < 0.5 ? a.sp : b.sp;
        s.triedPairs[key] = fails + 1;
      }
    } else sp = Math.random() < 0.5 ? a.sp : b.sp;

    let vigor = (a.vigor + b.vigor) / 2 + util.gauss() * 0.07 + 0.015 + (a.sp === b.sp ? 0.03 : 0);
    vigor = util.clamp(vigor, 0.5, 2.5);

    let sparkleP = 1 / 80;
    if (a.trait === 'lucky' || b.trait === 'lucky') sparkleP *= D.TRAITS.lucky.lucky;
    if (a.sparkle || b.sparkle) sparkleP *= 2;

    let trait = null;
    if (a.trait && Math.random() < 0.35) trait = a.trait;
    else if (b.trait && Math.random() < 0.35) trait = b.trait;
    else if (Math.random() < 0.25) trait = util.pick(Object.keys(D.TRAITS));

    return { sp, vigor, sparkle: Math.random() < sparkleP, trait, gen: Math.max(a.gen, b.gen) + 1 };
  }

  // ---- Orders and merchant ------------------------------------------------
  function makeOrder(s) {
    const rates = f.goodRates(s);
    const goods = D.GOODS.filter((g) => s.unlockedGoods[g.id]);
    if (!goods.length) return null;
    const g = util.weighted(goods, (x) => (rates[x.id] ? 3 + x.tier : 0.5));
    const rate = Math.max(rates[g.id] || 0, 0.04);
    const qty = util.clamp(Math.round(rate * util.rand(100, 200)), 4, 999);
    return {
      id: util.uid(),
      who: util.pick(D.REQUESTERS),
      good: g.id,
      qty,
      reward: Math.ceil(qty * f.price(s, g.id) * 2.5),
      left: util.rand(420, 720),
    };
  }

  function makeMerchantOffer(s) {
    const pool = D.SPECIES.filter((sp) => s.discovered[sp.id] && sp.id !== 'meadow').map((sp) => sp.id);
    // Occasionally the merchant carries the next undiscovered species.
    const next = D.RECIPES.filter((r) => s.discovered[r.a] && s.discovered[r.b] && !s.discovered[r.out]).map((r) => r.out);
    let sp;
    if (next.length && Math.random() < 0.2) sp = util.pick(next);
    else sp = pool.length ? util.pick(pool) : 'clover';
    const offer = {
      sp,
      vigor: util.rand(1.1, 1.35),
      sparkle: Math.random() < 0.08,
      trait: Math.random() < 0.5 ? util.pick(Object.keys(D.TRAITS)) : null,
    };
    offer.price = Math.ceil(f.beeValue(offer) * 6);
    return offer;
  }

  let lastSeason = null;
  function updateSeason(s) {
    const se = f.season(s);
    if (lastSeason && lastSeason !== se.id) bus.emit('season', se);
    lastSeason = se.id;
  }

  function updateTown(s, dt) {
    s.nextOrderAt -= dt;
    if (s.nextOrderAt <= 0) {
      s.nextOrderAt = util.rand(75, 130);
      if (s.orders.length < 3) {
        const o = makeOrder(s);
        if (o) {
          s.orders.push(o);
          bus.emit('order', o);
          bus.emit('dirty');
        }
      }
    }
    for (const o of s.orders) o.left -= dt;
    const before = s.orders.length;
    s.orders = s.orders.filter((o) => o.left > 0);
    if (s.orders.length !== before) bus.emit('dirty');

    if (s.merchant) {
      s.merchant.left -= dt;
      if (s.merchant.left <= 0) {
        s.merchant = null;
        bus.emit('merchantLeft');
        bus.emit('dirty');
      }
    } else {
      s.nextMerchantAt -= dt;
      if (s.nextMerchantAt <= 0 && s.lifetime > 150) {
        s.nextMerchantAt = util.rand(300, 600);
        s.merchant = { left: 90, offer: makeMerchantOffer(s) };
        bus.emit('merchant', s.merchant);
        bus.emit('dirty');
      }
    }
  }

  function updateDrip(s, dt) {
    if (rt.drip) {
      rt.drip.left -= dt;
      if (rt.drip.left <= 0) rt.drip = null;
      return;
    }
    rt.dripT -= dt;
    if (rt.dripT <= 0) {
      rt.dripT = util.rand(60, 120);
      rt.drip = { hive: util.randInt(0, s.hives.length - 1), left: 12 };
      bus.emit('drip');
    }
  }

  // Tapping the drop pays about half a minute of recent income.
  function claimDrip(s) {
    if (!rt.drip) return 0;
    const [cx, cy] = layout.hiveSlots[rt.drip.hive];
    const amt = Math.max(25, Math.round(incomePerMin() * 0.5));
    rt.drip = null;
    earn(s, amt, cx * 16 + 8, cy * 16 - 2);
    return amt;
  }

  function updateFx(dt) {
    for (const e of rt.fx) e.t += dt;
    rt.fx = rt.fx.filter((e) => e.t < e.life);
  }

  // ---- Main entry points ----------------------------------------------------
  function update(s, dt) {
    rt.clock += dt;
    s.time += dt;
    s.playTime += dt;
    produce(s, dt);
    restock(s);
    updateCustomers(s, dt);
    updateNursery(s, dt);
    updateTown(s, dt);
    updateDrip(s, dt);
    updateSeason(s);
    updateFx(dt);
  }

  // Fast-forward for time spent away. Customers buy instantly at 60% of the
  // live rate so staying in the app is still worth more.
  function catchUp(s, seconds) {
    seconds = Math.min(seconds, D.OFFLINE_CAP);
    const startCoins = s.coins;
    const startStore = Object.assign({}, s.store);
    const startSold = s.stats.sold;
    const startOrders = new Set(s.orders.map((o) => o.id));
    const startSeason = f.season(s).id;
    const step = 2;
    let left = seconds;
    rt.silent = true; // listeners skip per-event toasts; the away report covers it
    while (left > 0) {
      const dt = Math.min(step, left);
      left -= dt;
      s.time += dt;
      produce(s, dt);
      restock(s);
      instantCustomers(s, dt, 0.6);
      updateNursery(s, dt);
      updateTown(s, dt);
    }
    rt.silent = false;
    lastSeason = f.season(s).id;
    const made = {};
    for (const g of Object.keys(s.store)) {
      const d = (s.store[g] || 0) - (startStore[g] || 0);
      if (d) made[g] = d;
    }
    return {
      seconds, made,
      coins: s.coins - startCoins,
      sold: s.stats.sold - startSold,
      newOrders: s.orders.filter((o) => !startOrders.has(o.id)).length,
      eggs: s.nursery.filter((n) => n && n.ready).length,
      merchant: !!s.merchant,
      season: f.season(s).id !== startSeason ? f.season(s) : null,
    };
  }

  function resetRuntime() {
    rt.customers = [];
    rt.queue = [];
    rt.fx = [];
    rt.spawnT = 2;
    rt.income = [];
    rt.drip = null;
    rt.dripT = 45;
  }

  HC.layout = layout;
  HC.sim = {
    f, rt, update, catchUp, resetRuntime, earn, addGood, restock, decideEgg,
    makeOrder, makeMerchantOffer, incomePerMin, chooseShelf, instantCustomers, claimDrip,
  };
})();

<script>
// Player actions. Each returns {ok, msg} and emits 'dirty' so the UI redraws.
(function () {
  const HC = window.HC;
  const { util, data: D, bus } = HC;
  const S = () => HC.game;
  const f = () => HC.sim.f;

  function fail(msg) {
    bus.emit('fail', msg);
    return { ok: false, msg };
  }
  function done(msg, sound = 'buy') {
    bus.emit('dirty');
    if (sound) bus.emit('sfx', sound);
    return { ok: true, msg };
  }
  function spend(cost) {
    const s = S();
    if (s.coins < cost) return false;
    s.coins -= cost;
    return true;
  }

  // Put a new bee in the first hive with space, else the bee box.
  function placeBee(bee) {
    const s = S();
    const h = s.hives.find((hv) => hv.bees.length < f().hiveCap(hv));
    if (h) {
      h.bees.push(bee.id);
      return 'hive';
    }
    s.box.push(bee.id);
    return 'box';
  }
  function hasRoom() {
    const s = S();
    return s.hives.some((h) => h.bees.length < f().hiveCap(h)) || s.box.length < f().boxCap(s);
  }

  const act = {
    buyBee(sp) {
      const s = S();
      if (!f().marketUnlocked(s, sp)) return fail('That bee is not for sale yet.');
      if (!hasRoom()) return fail('No room. Build a hive or expand the bee box.');
      const cost = f().marketPrice(s, sp);
      if (!spend(cost)) return fail('Not enough coins.');
      s.market[sp] = (s.market[sp] || 0) + 1;
      const isNew = !s.discovered[sp];
      const bee = HC.state.makeBee(s, sp);
      const where = placeBee(bee);
      bus.emit('newBee', { bee, isNew, source: 'market' });
      return done(bee.name + ' the ' + D.species[sp].name + ' joined your ' + (where === 'hive' ? 'hive' : 'bee box') + '.');
    },

    buildHive() {
      const s = S();
      if (s.hives.length >= 6) return fail('The garden has room for six hives.');
      const cost = f().hiveCost(s);
      if (!spend(cost)) return fail('Not enough coins.');
      s.hives.push({ level: 0, bees: [] });
      // Fill it straight away from the bee box.
      const h = s.hives[s.hives.length - 1];
      while (s.box.length && h.bees.length < f().hiveCap(h)) h.bees.push(s.box.shift());
      bus.emit('hiveBuilt', s.hives.length - 1);
      return done('Hive ' + s.hives.length + ' is built.');
    },

    upgradeHive(i) {
      const s = S();
      const h = s.hives[i];
      if (!h) return fail('No such hive.');
      if (h.level >= D.HIVE_MAX_LEVEL) return fail('This hive is fully upgraded.');
      if (!spend(f().hiveUpgradeCost(s, i))) return fail('Not enough coins.');
      h.level++;
      while (s.box.length && h.bees.length < f().hiveCap(h)) h.bees.push(s.box.shift());
      return done('Hive ' + (i + 1) + ' is now level ' + (h.level + 1) + '.');
    },

    // target: hive index (number) or 'box'
    moveBee(id, target) {
      const s = S();
      if (!s.bees[id]) return fail('That bee is gone.');
      const from = f().hiveOf(s, id);
      if (target === 'box') {
        if (from < 0) return fail('Already in the bee box.');
        if (s.box.length >= f().boxCap(s)) return fail('The bee box is full.');
        s.hives[from].bees = s.hives[from].bees.filter((b) => b !== id);
        s.box.push(id);
        return done(s.bees[id].name + ' moved to the bee box.', 'click');
      }
      const h = s.hives[target];
      if (!h) return fail('No such hive.');
      if (from === target) return fail('Already in that hive.');
      if (h.bees.length >= f().hiveCap(h)) return fail('Hive ' + (target + 1) + ' is full.');
      if (from >= 0) s.hives[from].bees = s.hives[from].bees.filter((b) => b !== id);
      else s.box = s.box.filter((b) => b !== id);
      h.bees.push(id);
      return done(s.bees[id].name + ' moved to hive ' + (target + 1) + '.', 'click');
    },

    swapBee(boxId, hiveIdx, hiveBeeId) {
      const s = S();
      const h = s.hives[hiveIdx];
      if (!h || !h.bees.includes(hiveBeeId) || !s.box.includes(boxId)) return fail('Those bees moved.');
      h.bees[h.bees.indexOf(hiveBeeId)] = boxId;
      s.box[s.box.indexOf(boxId)] = hiveBeeId;
      return done('Swapped ' + s.bees[boxId].name + ' into hive ' + (hiveIdx + 1) + '.', 'click');
    },

    sellBee(id) {
      const s = S();
      const bee = s.bees[id];
      if (!bee) return fail('That bee is gone.');
      if (f().beeCount(s) <= 1) return fail('Keep at least one bee.');
      if (s.nursery.some((n) => n && (n.a === id || n.b === id))) return fail(bee.name + ' is busy in the nursery.');
      const price = f().sellPrice(bee);
      s.hives.forEach((h) => (h.bees = h.bees.filter((b) => b !== id)));
      s.box = s.box.filter((b) => b !== id);
      if (s.keepsake === id) s.keepsake = null;
      delete s.bees[id];
      HC.sim.earn(s, price);
      return done(bee.name + ' went to a keeper in the next town for ₵' + util.fmt(price) + '.', 'coin');
    },

    // Sells every bee in the box except the best one of each species and any
    // bee busy in the nursery. Returns the plan when dryRun is set.
    sellExtras(dryRun) {
      const s = S();
      const busy = new Set(s.nursery.filter(Boolean).flatMap((n) => [n.a, n.b]));
      const best = {};
      for (const id of s.box) {
        const b = s.bees[id];
        if (b.sparkle) continue; // sparkles are always kept; don't let them displace the best normal bee
        if (!best[b.sp] || f().beeValue(b) > f().beeValue(s.bees[best[b.sp]])) best[b.sp] = id;
      }
      const sell = s.box.filter((id) => !busy.has(id) && best[s.bees[id].sp] !== id && !s.bees[id].sparkle);
      const total = sell.reduce((t, id) => t + f().sellPrice(s.bees[id]), 0);
      if (dryRun) return { ok: true, count: sell.length, total };
      if (!sell.length) return fail('Nothing to sell: the box only holds your best bee of each kind.');
      for (const id of sell) delete s.bees[id];
      s.box = s.box.filter((id) => s.bees[id]);
      HC.sim.earn(s, total);
      return done('Sold ' + sell.length + ' spare bees for ₵' + util.fmt(total) + '.', 'coin');
    },

    renameBee(id, name) {
      const s = S();
      const bee = s.bees[id];
      name = String(name || '').trim().slice(0, 16);
      if (!bee || !name) return fail('Enter a name.');
      bee.name = name;
      return done('Renamed to ' + name + '.', 'click');
    },

    setShelf(i, good) {
      const s = S();
      const sh = s.shelves[i];
      if (!sh) return fail('No such shelf.');
      if (good && !s.unlockedGoods[good]) return fail('You have not made that yet.');
      if (sh.good && sh.qty) s.store[sh.good] = (s.store[sh.good] || 0) + sh.qty; // return stock
      sh.good = good || null;
      sh.qty = 0;
      HC.sim.restock(s);
      return done(good ? 'Shelf ' + (i + 1) + ' now sells ' + D.good[good].name + '.' : 'Shelf ' + (i + 1) + ' cleared.', 'click');
    },

    buyUpgrade(id) {
      const s = S();
      const u = D.upgrade[id];
      if (!u) return fail('Unknown upgrade.');
      if (s.up[id] >= u.max) return fail(u.name + ' is maxed out.');
      if (!spend(f().upgradeCost(s, id))) return fail('Not enough coins.');
      s.up[id]++;
      if (id === 'shelf') {
        s.shelves.push({ good: null, qty: 0 });
        // Auto-fill the new shelf with the best product not already shelved.
        const shelved = new Set(s.shelves.map((x) => x.good));
        const best = D.GOODS.filter((g) => s.unlockedGoods[g.id] && !shelved.has(g.id)).pop();
        if (best) s.shelves[s.shelves.length - 1].good = best.id;
        HC.sim.restock(s);
      }
      if (id === 'nursery') s.nursery.push(null);
      bus.emit('upgraded', id);
      return done(u.name + ' is now level ' + s.up[id] + '.');
    },

    startBreed(slot, aId, bId) {
      const s = S();
      const a = s.bees[aId], b = s.bees[bId];
      if (!a || !b || aId === bId) return fail('Pick two different bees.');
      if (s.nursery[slot]) return fail('That cradle is busy.');
      if (s.nursery.some((n) => n && [n.a, n.b].some((x) => x === aId || x === bId))) return fail('One of those bees is already in the nursery.');
      const cost = f().breedCost(a, b);
      if (!spend(cost)) return fail('Not enough coins.');
      s.nursery[slot] = { a: aId, b: bId, t: 0, dur: f().breedTime(a, b), ready: false };
      bus.emit('breedStart', slot);
      return done(a.name + ' and ' + b.name + ' are tending an egg.');
    },

    hatch(slot) {
      const s = S();
      const n = s.nursery[slot];
      if (!n || !n.ready) return fail('The egg is not ready.');
      if (!hasRoom()) return fail('No room for a new bee. Free a space first.');
      const a = s.bees[n.a], b = s.bees[n.b];
      // Parents may have been sold mid-brood; fall back to whichever is left.
      const pa = a || b, pb = b || a;
      if (!pa) {
        s.nursery[slot] = null;
        return fail('Both parents are gone; the egg was lost.');
      }
      const egg = HC.sim.decideEgg(s, pa, pb);
      const isNew = !s.discovered[egg.sp];
      const newSparkle = egg.sparkle && !s.sparkleSeen[egg.sp];
      const bee = HC.state.makeBee(s, egg.sp, egg);
      placeBee(bee);
      s.nursery[slot] = null;
      s.stats.bred++;
      bus.emit('newBee', { bee, isNew, newSparkle, source: 'nursery' });
      return done(null, 'hatch');
    },

    cancelBreed(slot) {
      const s = S();
      if (!s.nursery[slot]) return fail('Nothing to cancel.');
      s.nursery[slot] = null;
      return done('The cradle is empty again.', 'click');
    },

    deliverOrder(id) {
      const s = S();
      const o = s.orders.find((x) => x.id === id);
      if (!o) return fail('That order has expired.');
      if ((s.store[o.good] || 0) < o.qty) return fail('Not enough ' + D.good[o.good].name + ' in the storehouse.');
      s.store[o.good] -= o.qty;
      s.orders = s.orders.filter((x) => x.id !== id);
      HC.sim.earn(s, o.reward);
      s.rep = Math.min(5, s.rep + 0.15);
      s.stats.orders++;
      bus.emit('orderDone', o);
      return done(o.who + ' paid ₵' + util.fmt(o.reward) + '. Word gets around.', 'order');
    },

    dismissOrder(id) {
      const s = S();
      s.orders = s.orders.filter((x) => x.id !== id);
      return done(null, 'click');
    },

    buyMerchant() {
      const s = S();
      if (!s.merchant) return fail('The merchant has left.');
      if (!hasRoom()) return fail('No room for another bee.');
      const o = s.merchant.offer;
      if (!spend(o.price)) return fail('Not enough coins.');
      const isNew = !s.discovered[o.sp];
      const newSparkle = o.sparkle && !s.sparkleSeen[o.sp];
      const bee = HC.state.makeBee(s, o.sp, o);
      placeBee(bee);
      s.merchant = null;
      bus.emit('newBee', { bee, isNew, newSparkle, source: 'merchant' });
      return done(null, 'hatch');
    },

    holdFestival(keepId) {
      const old = S();
      const gain = f().festivalRibbons(old);
      if (!gain) return fail('The town is not ready for a festival yet.');
      const s = HC.state.newGame();
      s.lifetime = old.lifetime;
      s.ribbons = old.ribbons + gain;
      s.festivals = old.festivals + 1;
      s.discovered = old.discovered;
      s.sparkleSeen = old.sparkleSeen;
      s.triedPairs = old.triedPairs;
      s.stats = old.stats;
      s.settings = old.settings;
      s.hints = old.hints;
      s.playTime = old.playTime;
      s.time = old.time;
      s.coins = 50 * (1 + s.ribbons);
      for (const sp of Object.keys(s.discovered)) s.unlockedGoods[D.species[sp].good] = true;
      const keep = old.bees[keepId];
      if (keep) {
        const copy = Object.assign({}, keep, { prog: 0 });
        s.bees[copy.id] = copy;
        s.hives[0].bees.push(copy.id);
      }
      HC.game = s;
      HC.sim.resetRuntime();
      bus.emit('festival', { gain, total: s.ribbons });
      return done(null, 'hatch');
    },
  };

  HC.act = act;
})();

<script>
// A linear chain of goals that guides the first few hours. Each pays a reward
// when claimed; the current goal shows in a strip under the scene.
(function () {
  const HC = window.HC;
  const { bus } = HC;
  const f = () => HC.sim.f;
  const disc = (sp) => Object.assign((s) => !!s.discovered[sp], { sp });

  const GOALS = [
    { text: 'Buy another Meadow Bee', check: (s) => f().beeCount(s) >= 3, reward: 30 },
    { text: 'Build a second hive', check: (s) => s.hives.length >= 2, reward: 80 },
    { text: 'Buy a Clover Bee', check: disc('clover'), reward: 100 },
    { text: 'Stock two different shelves', check: (s) => new Set(s.shelves.map((x) => x.good).filter(Boolean)).size >= 2, reward: 120 },
    { text: 'Hatch an egg in the Nursery', check: (s) => s.stats.bred >= 1, reward: 150 },
    { text: 'Discover the Waxwing Bee', check: disc('waxwing'), reward: 250 },
    { text: 'Fill a request from the Town board', check: (s) => s.stats.orders >= 1, reward: 300 },
    { text: 'Reach 3 stars of reputation', check: (s) => s.rep >= 3, reward: 500 },
    { text: 'Build a third hive', check: (s) => s.hives.length >= 3, reward: 600 },
    { text: 'Discover the Citrus Bee', check: disc('citrus'), reward: 1000 },
    { text: 'Upgrade any hive to level 3', check: (s) => s.hives.some((h) => h.level >= 2), reward: 1500 },
    { text: 'Discover the Lavender Bee', check: disc('lavender'), reward: 3000 },
    { text: 'Sell 1,000 items', check: (s) => s.stats.sold >= 1000, reward: 5000 },
    { text: 'Discover the Scout Bee', check: disc('scout'), reward: 6000 },
    { text: 'Build a fourth hive', check: (s) => s.hives.length >= 4, reward: 8000 },
    { text: 'Discover the Royal Bee', check: disc('royal'), reward: 15000 },
    { text: 'Discover the Moonmoth Bee', check: disc('moonmoth'), reward: 30000 },
    { text: 'Build a fifth hive', check: (s) => s.hives.length >= 5, reward: 40000 },
    { text: 'Discover the Nurse Bee', check: disc('nurse'), reward: 60000 },
    { text: 'Discover the Golden Bee', check: disc('golden'), reward: 120000 },
    { text: 'Reach 4.5 stars of reputation', check: (s) => s.rep >= 4.5, reward: 150000 },
    { text: 'Hatch a sparkle bee', check: (s) => Object.keys(s.sparkleSeen).length > 0, reward: 250000 },
    { text: 'Build all six hives', check: (s) => s.hives.length >= 6, reward: 400000 },
    { text: 'Discover the Crystal Bee', check: disc('crystal'), reward: 800000 },
    { text: 'Discover the Starlight Bee', check: disc('star'), reward: 3000000 },
    { text: 'Hold a Honey Festival', check: (s) => s.festivals >= 1, reward: 1000 },
  ];

  // Discovery goals remember their species so the goal strip can show a hint.
  for (const g of GOALS) if (g.check.sp) g.sp = g.check.sp;
  Object.assign(GOALS[1], { tip: 'Open the Apiary tab and scroll to "Build hive 2".' });
  Object.assign(GOALS[3], { tip: 'Buy an Extra Shelf in the Shop tab, then tap a shelf to choose what it sells.' });
  Object.assign(GOALS[6], { tip: 'Requests appear on the Town board every couple of minutes.' });
  Object.assign(GOALS[7], { tip: 'Keep shelves stocked. Every happy customer nudges reputation up, and requests give a big boost.' });

  function current(s) {
    return GOALS[s.goal || 0] || null;
  }

  function claim() {
    const s = HC.game;
    const g = current(s);
    if (!g || !g.check(s)) return { ok: false };
    s.goal = (s.goal || 0) + 1;
    HC.sim.earn(s, g.reward);
    bus.emit('sfx', 'order');
    bus.emit('goalClaimed', g);
    bus.emit('dirty');
    return { ok: true, msg: 'Goal complete: +₵' + HC.util.fmt(g.reward) };
  }

  HC.goals = { GOALS, current, claim };
})();
