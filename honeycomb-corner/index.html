<!doctype html>
<!--
  index.html: THE PAGE ITSELF
  This is the file a browser opens. It only lays out empty containers
  (the game screen, the status bar, the tabs, the pop-up window). The
  JavaScript files listed at the bottom fill them in and run the game.
  Nothing here needs changing for balance or content; see js/data.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honeycomb Corner</title>
<meta name="description" content="A cozy pixel-art idle game: keep bees, breed new species, and run a honey shop.">
<!-- Fonts from Google Fonts: Pixelify Sans (pixel style) for the logo and
     window titles, Nunito (rounded and easy to read) for everything else. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<!-- All the colours, sizes and layout rules. -->
<link rel="stylesheet" href="css/style.css">
<!-- Lets phones install the game to the home screen (see manifest.webmanifest and sw.js). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#221a24">
</head>
<body>
<div class="app">
  <!-- Title bar, with the settings (⚙) button on the right. -->
  <header class="masthead">
    <h1 class="logo"><span class="logo-mark" aria-hidden="true"></span>Honeycomb Corner</h1>
    <div class="mast-right">
      <p class="tagline">Honey shop &amp; apiary · est. today</p>
      <button class="hud-gear" data-act="tab" data-tab="menu" title="Settings and save" aria-label="Settings and save">⚙</button>
    </div>
  </header>

  <!-- The "handheld console": the pixel picture, status bar and tabs. -->
  <section class="stage" aria-label="Your shop and garden">
    <div class="bezel">
      <div class="screen">
        <!-- The game picture. It's drawn at 240×160 pixels and stretched up. -->
        <canvas id="scene" width="240" height="160" aria-label="Pixel-art view of your bee garden and honey shop. Tap a hive to collect honey; tap shelves, the Candle Machine, the request board or the merchant."></canvas>
      </div>
      <!-- The tutorial text box. It sits just below the picture (not on top of
           it) so the whole shop stays visible. Tap it to see the next line. -->
      <div id="textbox" class="textbox" hidden role="status">
        <img id="textboxFace" class="px speaker" alt="" width="32" height="40">
        <p id="textboxText"></p>
        <span class="more" aria-hidden="true"></span>
      </div>
      <!-- Coins, gems, time of day... (filled in by js/ui.js) -->
      <div id="hud" class="hud"></div>
      <!-- Current goal, what the shopkeeper is doing, builds in progress. -->
      <div id="goalbar" class="goalbar"></div>
    </div>
    <!-- The tabs. data-tab says which panel each one opens. -->
    <nav id="tabs" class="tabs" role="tablist" aria-label="Menus">
      <button role="tab" data-act="tab" data-tab="apiary">Apiary</button>
      <button role="tab" data-act="tab" data-tab="shop">Shop</button>
      <button role="tab" data-act="tab" data-tab="nursery">Nursery</button>
      <button role="tab" data-act="tab" data-tab="town">Town</button>
      <button role="tab" data-act="tab" data-tab="store">Store</button>
      <button role="tab" data-act="tab" data-tab="guide">Guide</button>
    </nav>
  </section>

  <!-- The open tab's content goes here. -->
  <main id="panel" class="panel" role="tabpanel"></main>
</div>

<!-- The pop-up window (bee details, pickers, reports...). Hidden until needed. -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
  </div>
</div>
<!-- Playtest feedback form. It stays hidden: it's only here so Netlify (the
     web host) knows the form exists. The real form is the "Send feedback"
     window in the game, which submits these same fields (see ui.js). -->
<form name="playtest-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><textarea name="enjoyed"></textarea><textarea name="bored"></textarea>
  <textarea name="confused"></textarea><input name="keepPlaying"><textarea name="stats"></textarea>
</form>
<!-- Short messages that slide in at the bottom. -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<!--
  The game code, loaded in this exact order (later files use earlier ones):
    util      helpers + the message bus        data      all the numbers and lists
    state     the save file                    nav       the map and walking routes
    sim       the rules and the passage of time
    builds    upgrade timers                   customers shoppers and townsfolk
    workers   shopkeeper and staff             actions   everything the player can do
    goals     the goal chain                   sprites   the pixel art
    render    drawing the picture              audio     sound effects and music
    ui        menus and buttons                track     playtest notes + feedback
    main      starts it all and runs the loop
-->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/sim.js"></script>
<script src="js/builds.js"></script>
<script src="js/customers.js"></script>
<script src="js/workers.js"></script>
<script src="js/actions.js"></script>
<script src="js/goals.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/track.js"></script>
<script src="js/main.js"></script>
</body>
</html>
